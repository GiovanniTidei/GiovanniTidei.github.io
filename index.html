        d: "Quale importante complesso religioso, situato sulla sommità dell'acropoli di Cosa, dominava la città e il mare circostante?",
        r: ["Il Capitolium, dedicato alla Triade Capitolina (Giove, Giunone e Minerva)", "Il Tempio di Nettuno, protettore dei naviganti", "Il Santuario di Ercole, dio protettore della colonia"],
        c: 0,
        sp: "Sull'arx di Cosa sorgeva il Capitolium, il tempio principale della colonia dedicato a Giove, Giunone e Minerva. La sua posizione dominante lo rendeva visibile da tutta la città e dal mare, simbolo del potere di Roma."
    },
    {
        d: "Quale materiale da costruzione, caratteristico dell'architettura romana, fu utilizzato per le mura poligonali di Cosa, note per la loro precisione?",
        r: ["Calcare locale, tagliato in blocchi poligonali incastrati senza malta (opera poligonale)", "Tufo vulcanico, scolpito in blocchi regolari (opera quadrata)", "Mattone cotto (opus testaceum), tipico dell'edilizia romana imperiale"],
        c: 0,
        sp: "Le mura di Cosa sono un eccellente esempio di opera poligonale, una tecnica che utilizza blocchi irregolari di calcare locale incastrati con precisione senza l'uso di malta, tipica delle fortificazioni del Lazio e dell'Italia centrale."
    },
    {
        d: "Quale edificio termale di Ostia Antica, famoso per i suoi mosaici con Nettuno e creature marine, testimonia l'importanza dell'acqua per la città?",
        r: ["Le Terme di Nettuno, situate lungo il Decumano Massimo", "Le Terme del Foro, le più antiche della città", "Le Terme Marittime, costruite direttamente sulla spiaggia"],
        c: 0,
        sp: "Le Terme di Nettuno sono un vasto complesso termale pubblico. I loro pavimenti musivi, con Nettuno su un carro trainato da cavalli marini, celebrano il legame di Ostia con il mare e la sua ricchezza."
    },
    {
        d: "L'Anfiteatro Flavio (Colosseo) fu inaugurato nell'80 d.C. con giochi che durarono 100 giorni. Quale imperatore ne completò la costruzione e la inaugurò?",
        r: ["Tito, figlio di Vespasiano", "Nerone, che aveva già iniziato i lavori", "Domiziano, che aggiunse anche l'ipogeo"],
        c: 0,
        sp: "Il Colosseo fu iniziato da Vespasiano nel 72 d.C. e completato dal figlio Tito, che lo inaugurò nell'80 d.C. con sontuosi giochi inaugurali della durata di 100 giorni."
    },
    {
        d: "Quale fu la funzione principale della Via Sacra che attraversa il Foro Romano fino al Colosseo?",
        r: ["Era il percorso cerimoniale delle processioni trionfali e religiose che collegava i principali monumenti", "Era la strada commerciale principale per il trasporto delle merci al porto", "Era la via di fuga sotterranea per l'imperatore in caso di rivolta"],
        c: 0,
        sp: "La Via Sacra era la strada più importante del Foro Romano, percorsa dalle processioni trionfali dei generali vittoriosi che salivano al Campidoglio per rendere grazie a Giove Ottimo Massimo."
    },
    {
        d: "La Tomba dei Giganti di Coddu Vecchiu in Gallura è caratterizzata da un'esedra. Qual era la funzione di questo spazio semicircolare?",
        r: ["Delimitava l'area cerimoniale antistante la tomba, dove si svolgevano riti in onore dei defunti", "Era una struttura difensiva per proteggere la tomba dai nemici", "Serviva come recinto per gli animali sacrificali"],
        c: 0,
        sp: "L'esedra, il grande spazio semicircolare delimitato da lastre di granito, costituiva l'area cerimoniale dove la comunità nuragica si riuniva per celebrare riti funebri e onorare gli antenati sepolti nella tomba."
    },
    {
        d: "Quale tecnica edilizia, tipica delle civiltà nuragiche, è utilizzata per la copertura interna dei nuraghi, creando una falsa cupola?",
        r: ["La tecnica a tholos, con filari di pietre aggettanti che si restringono progressivamente verso l'alto", "La volta a botte, costruita con conci di pietra disposti a raggiera", "Il tetto a capanna, con travi in legno e copertura in tegole"],
        c: 0,
        sp: "La tholos è la tecnica costruttiva tipica dei nuraghi: i filari di pietra sono disposti in cerchi concentrici che si restringono progressivamente, creando una cupola ogivale senza l'uso di malta, basata solo sul peso e l'aggetto."
    },
    {
        d: "Quale imperatore romano fece costruire un grande porto esagonale a Ostia, noto come 'Porto di Traiano', per migliorare l'approvvigionamento di Roma?",
        r: ["Traiano", "Claudio", "Augusto"],
        c: 0,
        sp: "Il bacino esagonale di Portus fu realizzato sotto l'imperatore Traiano (inizi II sec. d.C.) per ampliare e rendere più sicuro il porto di Claudio, creando un capolavoro di ingegneria portuale romana."
    },
    {
        d: "Quale importante categoria di reperti, provenienti da tutto il Mediterraneo, è stata rinvenuta in grande quantità a Ostia e testimonia i commerci della città?",
        r: ["Anfore vinarie e olearie con i loro bolli (tituli picti)", "Monete d'oro e d'argento di zecche orientali", "Statue di marmo greco e sarcofagi attici"],
        c: 0,
        sp: "Le anfore sono i reperti più numerosi a Ostia. I bolli e le iscrizioni dipinte (tituli picti) su di esse forniscono informazioni preziose sulla provenienza, il contenuto e i commercianti che gestivano i traffici."
    },
    {
        d: "Quale fu la causa del declino e dell'abbandono di Ostia Antica a partire dal V-VI secolo d.C.?",
        r: ["L'insabbiamento del porto e la conseguente perdita della sua funzione commerciale", "Una serie di devastanti terremoti che distrussero gli edifici", "L'invasione dei Goti che saccheggiò e incendiò la città"],
        c: 0,
        sp: "Il progressivo insabbiamento del bacino portuale, unito alla crisi economica e demografica dell'Impero, rese Ostia inutilizzabile come scalo commerciale, portando al suo lento abbandono."
    },
    {
        d: "Quale insediamento preistorico, caratterizzato da capanne villanoviane, ha preceduto la civiltà etrusca nella Necropoli di Tarquinia?",
        r: ["Un villaggio della cultura villanoviana sull'altura dei Monterozzi", "Un insediamento della cultura appenninica nella valle sottostante", "Un villaggio di palafitte sulle rive del fiume Marta"],
        c: 0,
        sp: "Prima della grande necropoli etrusca, l'area dei Monterozzi era occupata da un villaggio della cultura villanoviana (IX-VIII sec. a.C.), considerata la fase più antica della civiltà etrusca."
    },
    {
        d: "Quale tecnica pittorica utilizzavano gli Etruschi per decorare le tombe di Tarquinia, applicando i colori direttamente sull'intonaco fresco?",
        r: ["L'affresco, che faceva asciugare i pigmenti insieme all'intonaco", "La tempera, che utilizzava uovo o colla animale come legante", "L'encausto, che mescolava i pigmenti con cera fusa"],
        c: 0,
        sp: "Le pitture delle tombe di Tarquinia sono state realizzate prevalentemente con la tecnica dell'affresco, applicando pigmenti naturali su un intonaco ancora umido, garantendo così la loro straordinaria durata nel tempo."
    },
    {
        d: "Quale struttura difensiva, unica nel suo genere, proteggeva l'antica città di Cosa sul lato nord-occidentale?",
        r: ["Un'imponente cinta muraria in opera poligonale con torri quadrate e una grande porta (Porta Fiorentina)", "Un fossato profondo 10 metri scavato nella roccia", "Una palizzata lignea rinforzata da terrapieni"],
        c: 0,
        sp: "Le mura di Cosa, costruite in opera poligonale, erano interrotte da diverse porte. La Porta Fiorentina, sul lato nord-occidentale, è la meglio conservata e mostra l'accuratezza della tecnica costruttiva."
    },
    {
        d: "Quale importante sito archeologico della Sardegna, situato nel comune di Cabras, ha restituito le celebri statue note come Giganti di Monte Prama?",
        r: ["L'area archeologica di Mont'e Prama, nel Sinis", "Il complesso nuragico di Barumini (Su Nuraxi)", "L'area archeologica di Tharros, antica città fenicia"],
        c: 0,
        sp: "I Giganti di Monte Prama sono stati rinvenuti nell'area archeologica di Mont'e Prama, nella penisola del Sinis, nel comune di Cabras. Oggi sono esposti nel Museo Civico di Cabras."
    },
    {
        d: "Quale caratteristica rende il Teatro Greco di Siracusa uno dei più grandi e meglio conservati del mondo greco?",
        r: ["La sua cavea, scavata in gran parte nella roccia del colle Temenite, poteva ospitare fino a 15.000 spettatori", "È l'unico teatro greco con un palcoscenico in legno ancora intatto", "È l'unico teatro greco che viene ancora utilizzato per spettacoli classici"],
        c: 0,
        sp: "Il Teatro Greco di Siracusa, scavato in gran parte nella roccia del colle Temenite, è uno dei più grandi teatri del mondo greco, con una cavea che poteva contenere fino a 15.000 spettatori."
    },
    {
        d: "Quale struttura del Parco Archeologico della Neapolis, nota come Orecchio di Dionisio, è famosa per la sua eccezionale acustica?",
        r: ["Una grotta artificiale a forma di padiglione auricolare, che amplifica incredibilmente ogni suono", "Una stanza sotterranea dove l'eco si ripete fino a sette volte", "Un anfiteatro dove un attore sul palco può essere udito fino all'ultima fila senza amplificazione"],
        c: 0,
        sp: "L'Orecchio di Dionisio è un'alta grotta artificiale scavata nella roccia, famosa per la sua acustica che amplifica ogni suono. Secondo la leggenda, il tiranno Dionisio vi rinchiudeva i prigionieri per ascoltarne i discorsi."
    },
    {
        d: "Il Parco Archeologico di Sibari conserva i resti di più città sovrapposte. Quale fu la prima colonia greca fondata sul sito?",
        r: ["Sibari, fondata dagli Achei nell'VIII sec. a.C.", "Thurii, fondata da Pericle nel V sec. a.C.", "Copia, fondata dai Romani nel II sec. a.C."],
        c: 0,
        sp: "La prima colonia greca fu Sibari, fondata da coloni achei intorno al 720 a.C. Divenne una delle città più ricche e potenti della Magna Grecia, prima di essere distrutta da Crotone."
    },
    {
        d: "Quale materiale da costruzione, tipico della Gallura, fu utilizzato per edificare la Tomba dei Giganti di Coddu Vecchiu e come influisce sulla sua conservazione?",
        r: ["Granito locale, molto resistente agli agenti atmosferici, che ha permesso una buona conservazione", "Calcare, facilmente erodibile, che ha reso necessario un restauro conservativo", "Tufo vulcanico, poroso e soggetto a degrado, che richiede una protezione continua"],
        c: 0,
        sp: "La Tomba dei Giganti di Coddu Vecchiu è stata costruita con il granito locale, una pietra dura e resistente che ha permesso una buona conservazione del monumento nel corso dei millenni."
    },
    {
        d: "Cosa rappresenta la falsa cupola (tholos) interna di un nuraghe e quale principio statico utilizza per sostenersi?",
        r: ["Una camera circolare che utilizza il principio dell'aggetto: i filari di pietra si restringono progressivamente verso l'alto", "Una cupola parabolica sostenuta da un pilastro centrale in pietra", "Una volta a botte rinforzata da archi in mattoni"],
        c: 0,
        sp: "La falsa cupola (tholos) dei nuraghi è una camera circolare coperta da filari di pietre aggettanti che si restringono progressivamente, basandosi unicamente sul principio dell'aggetto e sul peso delle pietre, senza l'uso di malta."
    },
    {
        d: "Quale insieme di nove monumenti civili e religiosi a Palermo, Cefalù e Monreale è stato dichiarato Patrimonio dell'Umanità UNESCO nel 2015?",
        r: ["Palermo Arabo-Normanna e le Cattedrali di Cefalù e Monreale", "Le ville e i giardini della Conca d'Oro", "Le chiese barocche del Val di Noto"],
        c: 0,
        sp: "Il sito seriale UNESCO comprende nove monumenti: il Palazzo Reale e la Cappella Palatina, la Cattedrale di Palermo, San Giovanni degli Eremiti, la Martorana, San Cataldo, la Zisa, il Ponte dell'Ammiraglio, e le Cattedrali di Cefalù e Monreale."
    },
    {
        d: "Quale chiesa di Palermo, parte del sito UNESCO, è famosa per il suo chiostro con colonnine binate e un rigoglioso giardino, ed è un esempio di architettura normanna con influenze arabe?",
        r: ["San Giovanni degli Eremiti, con le sue caratteristiche cupole rosse", "La Chiesa della Martorana, con i suoi mosaici bizantini", "La Cappella Palatina, con il suo soffitto a muqarnas"],
        c: 0,
        sp: "San Giovanni degli Eremiti, costruita per volere di Ruggero II, è nota per le sue cinque cupole rosse di chiara influenza araba e per il suo suggestivo chiostro con colonnine binate e un giardino lussureggiante."
    },
    {
        d: "Quale importante reperto epigrafico, rinvenuto a Nora, contiene la più antica attestazione del nome 'Sardegna' in caratteri fenici?",
        r: ["La Stele di Nora, incisa su una lastra di arenaria", "L'Iscrizione di Melqart, su una lamina d'oro", "La Tavola di Sulky, un trattato commerciale inciso su bronzo"],
        c: 0,
        sp: "La Stele di Nora, rinvenuta nel 1773, è un'iscrizione fenicia dell'VIII sec. a.C. che menziona per la prima volta il nome 'Sardegna' (SRDN), fornendo una preziosa testimonianza della presenza fenicia sull'isola."
    },
    {
        d: "Quale materiale, facilmente lavorabile ma resistente, fu utilizzato per la costruzione delle mura e degli edifici pubblici di Ostia Antica?",
        r: ["Calcestruzzo romano (opus caementicium) rivestito in mattoni (opus testaceum)", "Blocchi di tufo giallo e rosso (opus quadratum)", "Marmo bianco di Carrara, importato via mare"],
        c: 0,
        sp: "La maggior parte degli edifici di Ostia fu costruita in calcestruzzo romano, una miscela di calce, sabbia e pietrisco, rivestita da mattoni. Questa tecnica, economica e veloce, permise la costruzione di interi quartieri ad alta densità."
    },
    {
        d: "Quale fu la causa della distruzione della ricca e potente Sibari nel 510 a.C.?",
        r: ["Fu attaccata e distrutta dall'esercito di Crotone, che deviò il fiume Crati per sommergerla", "Fu distrutta da un devastante terremoto che rase al suolo la città", "Fu abbandonata a causa di un'epidemia di peste bubbonica"],
        c: 0,
        sp: "La guerra tra Sibari e Crotone, due delle più potenti città della Magna Grecia, si concluse con la vittoria di Crotone e la distruzione totale di Sibari nel 510 a.C."
    },
    {
        d: "Quale strada consolare romana, che collegava Roma con la costa tirrenica, attraversava l'area archeologica di Cosa, rendendola strategica?",
        r: ["La Via Aurelia", "La Via Appia", "La Via Cassia"],
        c: 0,
        sp: "La Via Aurelia, costruita nel III sec. a.C., collegava Roma a Pisa passando lungo la costa tirrenica. Il suo passaggio ai piedi del promontorio di Ansedonia rese Cosa un punto chiave per il controllo dei traffici."
    },
    {
        d: "Quale materiale, facilmente lavorabile ma resistente, fu utilizzato per la costruzione delle mura di Ostia Antica?",
        r: ["Calcestruzzo romano (opus caementicium) rivestito in mattoni (opus testaceum)", "Blocchi di tufo giallo e rosso (opus quadratum)", "Marmo bianco di Carrara, importato via mare"],
        c: 0,
        sp: "Le mura di Ostia, come la maggior parte degli edifici della città, furono costruite in calcestruzzo romano rivestito di mattoni. Questa tecnica permise la costruzione di strutture robuste e durature."
    },
    {
        d: "Quale fu la causa del declino e dell'abbandono di Ostia Antica a partire dal V-VI secolo d.C.?",
        r: ["L'insabbiamento del porto e la conseguente perdita della sua funzione commerciale", "Una serie di devastanti terremoti che distrussero gli edifici", "L'invasione dei Vandali che saccheggiò e incendiò la città"],
        c: 0,
        sp: "Il progressivo insabbiamento del bacino portuale di Ostia, unito alla crisi economica e demografica dell'Impero, rese la città inutilizzabile come scalo commerciale, portando al suo lento abbandono."
    },
    {
        d: "Quale struttura del Parco Archeologico della Neapolis, nota come Orecchio di Dionisio, è famosa per la sua eccezionale acustica?",
        r: ["Una grotta artificiale a forma di padiglione auricolare, che amplifica incredibilmente ogni suono", "Una stanza sotterranea dove l'eco si ripete fino a sette volte", "Un anfiteatro dove un attore sul palco può essere udito fino all'ultima fila senza amplificazione"],
        c: 0,
        sp: "L'Orecchio di Dionisio è un'alta grotta artificiale scavata nella roccia, famosa per la sua acustica che amplifica ogni suono. Secondo la leggenda, il tiranno Dionisio vi rinchiudeva i prigionieri per ascoltarne i discorsi."
    },
    {
        d: "Quale materiale da costruzione, tipico della Gallura, fu utilizzato per edificare la Tomba dei Giganti di Coddu Vecchiu e come influisce sulla sua conservazione?",
        r: ["Granito locale, molto resistente agli agenti atmosferici, che ha permesso una buona conservazione", "Calcare, facilmente erodibile, che ha reso necessario un restauro conservativo", "Tufo vulcanico, poroso e soggetto a degrado, che richiede una protezione continua"],
        c: 0,
        sp: "La Tomba dei Giganti di Coddu Vecchiu è stata costruita con il granito locale, una pietra dura e resistente che ha permesso una buona conservazione del monumento nel corso dei millenni."
    },
    {
        d: "Cosa rappresenta la falsa cupola (tholos) interna di un nuraghe e quale principio statico utilizza per sostenersi?",
        r: ["Una camera circolare che utilizza il principio dell'aggetto: i filari di pietra si restringono progressivamente verso l'alto", "Una cupola parabolica sostenuta da un pilastro centrale in pietra", "Una volta a botte rinforzata da archi in mattoni"],
        c: 0,
        sp: "La falsa cupola (tholos) dei nuraghi è una camera circolare coperta da filari di pietre aggettanti che si restringono progressivamente, basandosi unicamente sul principio dell'aggetto e sul peso delle pietre, senza l'uso di malta."
    },

    { d: "Nell'area sacra del sito archeologico di Metaponto si trova, tra gli altri, il tempio di?", r: ["Hera (Tavole Palatine)", "Atena", "Persefone"], c: 0, sp: "Il Tempio extraurbano di Hera, detto Tavole Palatine, è il monumento meglio conservato di Metaponto; dorico con 8 colonne sul fronte e 17 sui lati, eretto verso la metà del VI sec. a.C." },
    { d: "I templi della Valle dei Templi di Agrigento sono in stile?", r: ["Dorico", "Ionico", "Corinzio"], c: 0, sp: "Tutti i templi della Valle dei Templi di Agrigento sono in stile dorico, caratterizzato da colonne massicce senza base e capitelli geometrici semplici." },
    { d: "I resti dell'unico anfiteatro romano rinvenuto in Calabria si trovano nel parco archeologico di?", r: ["Sibari", "Scolacium", "Kaulon"], c: 0, sp: "Il Parco Archeologico di Sibari (Cassano all'Ionio, CS) ospita i resti dell'unico anfiteatro romano rinvenuto in Calabria, nell'area di Copia, colonia latina del 193 a.C." },
    { d: "Nel Foro di Ostia Antica si erge un tempio dedicato alla Triade Capitolina. Come si chiama?", r: ["Capitolium", "Tempio di Roma e Augusto", "Tempio Rotondo"], c: 0, sp: "Il Capitolium (120 d.C., età adrianea) è il monumento più alto del Foro di Ostia Antica; era dedicato alla Triade Capitolina (Giove, Giunone e Minerva)." },
    { d: "Una celebre tomba etrusca di Chiusi è detta?", r: ["Tomba della Scimmia", "Tomba del Triclinio", "Tomba dell'Orco"], c: 0, sp: "La Tomba della Scimmia (V sec. a.C.) è una delle tombe dipinte più celebri di Chiusi (SI); raffigura scene di giochi atletici con una scimmia legata a un albero come elemento caratteristico." },
    { d: "Il Parco Archeologico della Neapolis di Siracusa comprende le Latomie. Quale è la più celebre cavità con straordinaria acustica?", r: ["L'Orecchio di Dionisio", "La Grotta dei Cordari", "La Latomia di Santa Venera"], c: 0, sp: "L'Orecchio di Dionisio è una grotta artificiale alta 23 m con pianta a S e straordinaria acustica; il nome fu attribuito da Caravaggio nel 1608 durante la sua visita a Siracusa." },
    { d: "Il Tempio C di Selinunte è il più antico sull'Acropoli. In quale secolo fu costruito?", r: ["VI sec. a.C. (570-550 a.C.)", "V sec. a.C.", "IV sec. a.C."], c: 0, sp: "Il Tempio C di Selinunte è datato al 570-550 a.C. ed è il più antico tra quelli sull'Acropoli; fu parzialmente ricostruito con anastilosi nel 1925-27." },
    { d: "Le metope scolpite dei templi di Selinunte sono conservate principalmente in quale museo?", r: ["Museo Archeologico Regionale di Palermo (Salinas)", "Museo Nazionale di Siracusa (Paolo Orsi)", "Museo Nazionale di Agrigento"], c: 0, sp: "Le metope scolpite dei templi C, E e F di Selinunte sono conservate al Museo Archeologico Regionale Antonio Salinas di Palermo; rappresentano scene mitologiche tra le più pregevoli della statuaria greca d'Occidente." },
    { d: "Il Foro di Ostia Antica comprende un edificio con bancone originale dove si vendevano cibi e bevande. Come si chiama?", r: ["Thermopolium", "Macellum", "Horreum"], c: 0, sp: "Il Thermopolium di Ostia Antica conserva il bancone originale dove venivano venduti cibi e bevande caldi; è uno dei meglio conservati del mondo romano." },
    { d: "La Grotta del Romito nel Parco del Museo di Reggio Calabria conserva un'incisione rupestre raffigurante quale animale?", r: ["Bos taurus primigenius (uro)", "Mammut lanoso", "Cervo dalle grandi corna"], c: 0, sp: "Dalla Grotta del Romito di Papasidero (CS) proviene il calco dell'incisione rupestre del Bos taurus primigenius (circa 12.000 anni fa), tra i più antichi esempi di arte rupestre in Italia, esposto al livello A del Museo di Reggio Calabria." },
    { d: "Il Tempio E di Selinunte è stato ricostruito anastiloticamente nel 1958. A quale divinità era probabilmente dedicato?", r: ["Era", "Atena", "Zeus"], c: 0, sp: "Il Tempio E di Selinunte (460 a.C.) è probabilmente dedicato ad Era; fu ricostruito anastiloticamente nel 1958 ed è uno dei templi dorici meglio leggibili del sito." },
    { d: "Le Cave di Rocche di Cusa, vicino a Selinunte, conservano fusti di colonne abbandonati. Perché i lavori si interruppero?", r: ["Per l'attacco cartaginese del 409 a.C.", "Per un terremoto nel V sec. a.C.", "Per la morte del tiranno committente"], c: 0, sp: "Le Cave di Rocche di Cusa, a 5 km da Selinunte, conservano i fusti di colonne abbandonati in lavorazione al momento dell'attacco cartaginese del 409 a.C." },
    { d: "Il Parco Archeologico di Carsulae in Umbria si sviluppa lungo quale via consolare romana?", r: ["Via Flaminia", "Via Appia", "Via Valeria"], c: 0, sp: "Carsulae si sviluppò lungo la Via Flaminia (costruita intorno al 220 a.C. dal console Gaio Flaminio); il basolato originale è ancora in situ e funge da cardo maximus del sito." },
    { d: "Nel Parco Archeologico di Saepinum-Altilia, quale edificio si trova all'incrocio tra cardo e decumano?", r: ["Il Foro di età augustea", "Il Teatro romano", "Il Capitolium"], c: 0, sp: "L'incrocio del cardo e del decumano di Saepinum coincide con il Foro di età augustea, a pianta trapezoidale e pavimentazione in basolato con iscrizione centrale che ricorda i magistrati finanziatori." },
    { d: "Il complesso di Aquileia conserva il più esteso mosaico paleocristiano del mondo occidentale. A quale periodo risale il programma iconografico?", r: ["313-319 d.C., con la storia di Giona e animali simbolici", "V sec. d.C., con scene della Vita di Cristo", "IX sec. d.C., realizzato dai monaci benedettini"], c: 0, sp: "I mosaici pavimentali dell'aula meridionale di Aquileia (760 mq) furono realizzati tra il 313 e il 319 d.C. circa, con la storia di Giona, animali simbolici e scene della vita cristiana." },
    { d: "Il Museo Nazionale del Metapontino espone reperti dalle origini fino alla tarda antichità. Quale popolazione preellenica è documentata nella fase più antica?", r: ["Enotri-Choni", "Lucani", "Brettii"], c: 0, sp: "Il Museo Nazionale del Metapontino illustra le fasi degli Enotri-Choni (antica popolazione italica), l'arrivo dei Greci e la successiva romanizzazione del territorio." },
    { d: "Nel Parco Archeologico di Pompei, la Regio V ha restituito iscrizioni a carboncino che hanno confermato la data dell'eruzione del 79 d.C. In quale stagione?", r: ["Autunno (ottobre-novembre)", "Estate (agosto)", "Primavera (aprile-maggio)"], c: 0, sp: "Le iscrizioni a carboncino rinvenute nella Regio V del Grande Progetto Pompei hanno confermato che l'eruzione del Vesuvio avvenne in autunno (ottobre-novembre 79 d.C.) e non in agosto come tradizionalmente ritenuto." },
    { d: "Il Santuario di Hera al Sele, vicino a Paestum, è famoso per quale tipo di opere scultoree conservate al Museo Nazionale di Paestum?", r: ["Metope scolpite del VI sec. a.C.", "Pinakes in terracotta del V sec. a.C.", "Acroteri fittili del IV sec. a.C."], c: 0, sp: "Il Museo Nazionale di Paestum conserva le metope scolpite del Santuario di Hera al Sele (VI sec. a.C.), straordinarie opere della scultura dorica arcaica in calcare." },
    { d: "Il Parco Archeologico di Capo Colonna fu sede di quale importante confederazione politica nel V sec. a.C.?", r: ["La Lega Italiota", "La Lega Magnogreca", "La Lega Achea d'Occidente"], c: 0, sp: "Nel V sec. a.C. il Santuario di Hera Lacinia a Capo Colonna divenne sede della Lega Italiota, confederazione politico-militare dei Greci d'Occidente." },
    { d: "Le domus de janas della Sardegna sono sepolture ipogee. Cosa significa letteralmente il termine sardo?", r: ["Case delle fate (o delle streghe)", "Tombe delle dee madri", "Grotte dei giganti"], c: 0, sp: "Domus de janas significa letteralmente 'case delle fate' (o 'delle streghe' in sardo); sono sepolture ipogee collettive scavate nella roccia tipiche della Sardegna preistorica tra il Neolitico finale e il Bronzo antico." },
    { d: "Il tophet di Tharros è un santuario fenicio-punico. A quali divinità erano dedicate le stele votive?", r: ["Baal Hammon e Tanit", "Melqart e Astarte", "Eshmun e Reshef"], c: 0, sp: "Il tophet di Tharros era dedicato a Baal Hammon e Tanit, le principali divinità del pantheon fenicio-punico; è tra i tophet meglio conservati del Mediterraneo." },
    { d: "Le Tavole Palatine di Metaponto sono i resti di quale edificio sacro?", r: ["Il Tempio extraurbano di Hera", "Il Tempio di Apollo Licio nell'agorà urbana", "Il Santuario ctonio di Demetra"], c: 0, sp: "Le Tavole Palatine sono i resti del Tempio extraurbano di Hera di Metaponto, il monumento meglio conservato del sito; il nome popolare deriva dalle tavole di pietra visibili tra i campi." },
    { d: "Nel Parco Archeologico di Locri Epizefiri si trova il Persefoneion sul Colle Mannella. Per quale tipo di oggetti votivi è celebre?", r: ["I pinakes, tavolette votive in terracotta", "Gli esvotos in bronzo a figura umana", "Le laminette d'oro con testi orfici"], c: 0, sp: "Dal Persefoneion di Locri sul Colle Mannella provengono i celebri pinakes, tavolette votive in terracotta, tra i documenti figurativi più importanti del culto di Persefone in Magna Grecia." },
    { d: "Il sito nuragico di Santa Vittoria a Serri si trova su quale tipo di rilievo geologico?", r: ["Un altopiano basaltico (Giara di Serri)", "Un pianoro calcareo carsico", "Uno sperone granitico"], c: 0, sp: "Il santuario nuragico di Santa Vittoria si trova nel comune di Serri, sull'altopiano basaltico della Giara di Serri a oltre 600 m s.l.m., in provincia di Sud Sardegna." },
    { d: "Il Castro originario di Ostia Antica risale a quale secolo e quale forma aveva?", r: ["IV sec. a.C., pianta rettangolare con mura in blocchi di tufo", "VI sec. a.C., pianta circolare con fossato difensivo", "II sec. a.C., pianta quadrata con quattro torri angolari"], c: 0, sp: "Il castrum di Ostia Antica risale al IV sec. a.C.; aveva pianta rettangolare (circa 194 x 125 m) con mura in blocchi di tufo, cardine e decumano ortogonali; è considerata la prima colonia romana." },
    { d: "La Necropoli di Grotticelli nel Parco della Neapolis di Siracusa comprende la cosiddetta Tomba di Archimede. Che tipo di tomba è in realtà?", r: ["Una tomba romana a edicola del IV-III sec. a.C., non di Archimede", "La vera tomba del matematico, identificata da Cicerone durante la sua questura", "Una tomba greca ipogea del V sec. a.C. con affresco dell'inventore"], c: 0, sp: "La cosiddetta Tomba di Archimede nel Parco della Neapolis a Siracusa è in realtà una tomba romana a edicola del IV-III sec. a.C.; la vera sepoltura di Archimede fu individuata da Cicerone durante la sua questura in Sicilia (75 a.C.)." },
    { d: "Le Grotte di Frasassi nelle Marche hanno una temperatura costante di?", r: ["14°C con umidità del 90%", "10°C con umidità del 70%", "18°C con umidità del 95%"], c: 0, sp: "Il percorso turistico delle Grotte di Frasassi si svolge a temperatura costante di 14°C con umidità del 90%; la principale sala è l'Abisso Ancona (180 x 120 m, altezza 200 m), una delle cavità carsiche più grandi d'Europa." },
    { d: "Il Sarcofago degli Sposi conservato al Museo di Villa Giulia a Roma è datato al 530 a.C. circa. In quale materiale è realizzato?", r: ["Terracotta policroma", "Marmo bianco di Carrara", "Pietra calcarea locale (nenfro)"], c: 0, sp: "Il Sarcofago degli Sposi (circa 530 a.C.) al Museo di Villa Giulia è in terracotta policroma; proviene da Cerveteri e raffigura una coppia di coniugi semidistesa sul kline in stile ionico-orientalizzante." },
    { d: "Il Parco Archeologico di Ercolano conserva oltre 300 scheletri di fuggiaschi dell'eruzione del 79 d.C. Dove furono rinvenuti?", r: ["Negli archi delle fornaci (fornici) sul litorale antico", "Nelle terme suburbane sul decumano inferiore", "Nel teatro romano della città bassa"], c: 0, sp: "Sul litorale antico di Ercolano furono rinvenuti oltre 300 scheletri di fuggiaschi soffocati dai gas piroclastici negli archi delle fornaci (fornici) mentre tentavano di imbarcarsi." },
    { d: "L'Apollo di Veio conservato al Museo di Villa Giulia è attribuito a quale scultore etrusco?", r: ["Vulca, unico artista etrusco citato dalle fonti latine", "Novios Plautios, artigiano romano che firmò la Cista Ficoroni", "Maestro di Portonaccio, scultore anonimo del santuario di Veio"], c: 0, sp: "L'Apollo di Veio (fine VI sec. a.C., terracotta dipinta) è attribuito a Vulca di Veio, l'unico artista etrusco citato dalle fonti latine antiche; fa parte del gruppo acroteriale del Santuario di Portonaccio." }
],

storia: [
    { d: "Amalfi fu una delle quattro Repubbliche Marinare. Quale fu il suo contributo al diritto marittimo medievale?", r: ["Le Tavole Amalfitane, il più antico codice di diritto marittimo del Medioevo occidentale", "Il Consolato del Mare, primo tribunale commerciale marittimo d'Europa", "Il Libro del Consolato, codice di navigazione adottato da tutte le repubbliche marinare"], c: 0, sp: "Amalfi fu la prima in Europa ad adottare le Tavole Amalfitane, il più antico codice di diritto marittimo del Medioevo occidentale; raggiunse il suo massimo splendore tra il IX e l'XI sec." },
    { d: "Il Sacco di Roma del 1527 vide le truppe di quale sovrano devastare la città?", r: ["Carlo V d'Asburgo", "Francesco I di Francia", "Enrico VIII d'Inghilterra"], c: 0, sp: "Durante il Sacco di Roma del 1527, le truppe di Carlo V (lanzichenecchi) devastarono la città; papa Clemente VII si rifugiò in Castel Sant'Angelo percorrendo il Passetto di Borgo." },
    { d: "Il Concilio di Trento si svolse nella Cattedrale di San Vigilio. In risposta a quale evento storico fu convocato?", r: ["La Riforma protestante di Lutero", "Lo Scisma d'Oriente del 1054", "L'eresia catara del XII sec."], c: 0, sp: "Il Concilio di Trento (1545-1563) fu convocato da papa Paolo III in risposta alla Riforma protestante di Lutero; ridefinì i sacramenti, confermò la Vulgata e avviò la Controriforma." },
    { d: "Matera è stata Capitale Europea della Cultura in quale anno?", r: ["2019", "2015", "2021"], c: 0, sp: "Matera è stata Capitale Europea della Cultura nel 2019; i Sassi erano stati iscritti nel Patrimonio UNESCO nel 1993 tra i primi siti italiani riconosciuti." },
    { d: "Il Castello di Miramare a Trieste fu sede di una scuola per ufficiali durante la Seconda Guerra Mondiale. Di quale nazione?", r: ["Nazisti tedeschi (1943)", "Americani (1945)", "Italiani fascisti (1940)"], c: 0, sp: "Durante la Seconda Guerra Mondiale (1943) il Castello di Miramare fu sede di una scuola per ufficiali nazisti; dal 1945 ospitò truppe neozelandesi, poi inglesi, poi americane fino al 1954." },
    { d: "L'Addizione Erculea di Ferrara fu progettata da Biagio Rossetti nel 1492. Quale duca la commissionò?", r: ["Ercole I d'Este", "Borso d'Este", "Alfonso I d'Este"], c: 0, sp: "L'Addizione Erculea (1492) fu voluta da Ercole I d'Este e progettata da Biagio Rossetti; raddoppiò la superficie urbana di Ferrara verso nord con assi ortogonali e prospetti armonici." },
    { d: "Lo Schiaffo di Anagni avvenne nel 1303. Chi fu il papa oltraggiato?", r: ["Bonifacio VIII", "Clemente V", "Innocenzo III"], c: 0, sp: "Nel 1303 ad Anagni il papa Bonifacio VIII fu catturato e oltraggiato dai legati di Filippo IV di Francia (Guglielmo di Nogaret e Giacomo Sciarra Colonna); l'episodio è noto come lo 'Schiaffo di Anagni'." },
    { d: "La Repubblica di Venezia cadde nel 1797. Per opera di chi?", r: ["Napoleone Bonaparte", "Federico il Grande di Prussia", "Maria Teresa d'Austria"], c: 0, sp: "La Serenissima Repubblica di Venezia (697-1797) cadde per opera di Napoleone Bonaparte nel 1797; il Palazzo Ducale fu sede del governo della Repubblica per quasi undici secoli." },
    { d: "La Reggia di Caserta fu voluta da Carlo di Borbone. In quale anno fu posta la prima pietra?", r: ["1752", "1735", "1768"], c: 0, sp: "Carlo di Borbone pose la prima pietra della Reggia di Caserta il 20 gennaio 1752; il progetto fu affidato a Luigi Vanvitelli con l'obiettivo dichiarato di superare in magnificenza Versailles e l'Escorial." },
    { d: "Il Sacrario di Redipuglia fu inaugurato nel 1938. Chi era sepolto ai piedi della scalinata per volontà testamentaria?", r: ["Il Duca Emanuele Filiberto d'Aosta, comandante della III Armata", "Il Generale Luigi Cadorna, Capo di Stato Maggiore", "Il Re Vittorio Emanuele III, che cedette il terreno allo Stato"], c: 0, sp: "Ai piedi della scalinata del Sacrario di Redipuglia si trova il sarcofago del Duca Emanuele Filiberto d'Aosta (morto nel 1931), comandante della III Armata, che per volontà testamentaria volle essere sepolto accanto ai suoi soldati." },
    { d: "La Prima Repubblica Marinara a istituire un codice di navigazione fu Amalfi. Le altre tre Repubbliche Marinare erano?", r: ["Venezia, Pisa e Genova", "Venezia, Napoli e Ancona", "Pisa, Genova e Ragusa"], c: 0, sp: "Le quattro Repubbliche Marinare erano Venezia, Pisa, Genova e Amalfi; Amalfi raggiunse il massimo splendore tra il IX e l'XI sec. e fu la prima ad adottare un codice di diritto marittimo." },
    { d: "Il Milite Ignoto fu tumulato al Vittoriano il 4 novembre di quale anno?", r: ["1921", "1918", "1925"], c: 0, sp: "Il 4 novembre 1921 fu tumulata la salma del Milite Ignoto nella cripta del Vittoriano progettata da Armando Brasini; la cerimonia avvenne nel terzo anniversario della fine della Prima Guerra Mondiale." },
    { d: "La Battaglia di Ascoli del 90 a.C. segnò l'inizio di quale guerra?", r: ["La Guerra Sociale", "La Seconda Guerra Punica", "La Guerra contro Mitridate"], c: 0, sp: "La Battaglia di Ascoli del 90 a.C. segnò l'inizio della Guerra Sociale (91-87 a.C.), la rivolta delle popolazioni italiche alleate di Roma che rivendicavano la cittadinanza romana." },
    { d: "Il Ducato di Mantova passò definitivamente ai Gonzaga in quale anno?", r: ["1328", "1273", "1530"], c: 0, sp: "La famiglia Gonzaga divenne signora di Mantova dal 1328; ottenne il titolo di marchesi nel 1433 e di duchi nel 1530. Il Palazzo Ducale fu la loro residenza dal 1328 al 1707." },
    { d: "La Venaria Reale fu aperta al pubblico dopo un grande restauro in quale anno?", r: ["2007", "1997", "2015"], c: 0, sp: "La Reggia di Venaria Reale, dopo un intervento di restauro del valore di circa 250 milioni di euro, è stata riaperta al pubblico nell'ottobre 2007; è Patrimonio UNESCO dal 1997 nel sistema delle Residenze Sabaude." },
    { d: "Sabbioneta fu costruita come città ideale rinascimentale da quale signore?", r: ["Vespasiano Gonzaga Colonna tra il 1556 e il 1591", "Federico II Gonzaga tra il 1525 e il 1540", "Ludovico III Gonzaga tra il 1460 e il 1478"], c: 0, sp: "Sabbioneta fu costruita dal nulla come città ideale rinascimentale da Vespasiano Gonzaga Colonna tra il 1556 e il 1591, su schema ortogonale con mura esagonali e i primi edifici pubblici rinascimentali d'Europa." },
    { d: "Il Tempietto Longobardo di Cividale del Friuli fu edificato nel VIII sec. Come si chiamava il re longobardo che probabilmente ne fu il committente?", r: ["Astolfo", "Alboino", "Liutprando"], c: 0, sp: "Il Tempietto Longobardo fu edificato verso la metà dell'VIII sec., probabilmente per volere del duca e poi re Astolfo, come cappella palatina della gastaldaga (residenza del gastaldo, rappresentante del re)." },
    { d: "La città di Aquileia fu saccheggiata e distrutta nel 452 d.C. da quale condottiero?", r: ["Attila", "Alarico", "Odoacre"], c: 0, sp: "Aquileia fu saccheggiata e distrutta da Attila nel 452 d.C.; da quel momento non fu mai più ricostruita e gran parte della città giace ancora non scavata sotto i campi, configurandosi come la più grande riserva archeologica romana del mondo occidentale." },
    { d: "Il Palazzo Reale di Napoli fu costruito a partire dal 1600. Su progetto di quale architetto?", r: ["Domenico Fontana", "Luigi Vanvitelli", "Giovan Battista Vaccarini"], c: 0, sp: "Il Palazzo Reale di Napoli fu costruito a partire dal 1600 su progetto di Domenico Fontana per il viceré Fernando Ruiz de Castro; la facciata è lunga 169 m." },
    { d: "Il Museo Nazionale del Cinema di Torino è ospitato nella Mole Antonelliana dal?", r: ["2000", "1990", "2008"], c: 0, sp: "Il Museo Nazionale del Cinema si trasferì nella Mole Antonelliana nel luglio 2000, con allestimento firmato dallo scenografo svizzero François Confino; era stato fondato nel 1941 da Maria Adriana Prolo." },
    { d: "Il Palio di Siena si corre in Piazza del Campo. Quante volte l'anno si disputa nella forma attuale attestata dal 1644?", r: ["Due volte: il 2 luglio e il 16 agosto", "Una volta: il 16 agosto per la festa dell'Assunta", "Tre volte: 2 luglio, 16 agosto e 29 settembre"], c: 0, sp: "Il Palio di Siena si corre due volte l'anno in Piazza del Campo: il 2 luglio (Palio di Provenzano) e il 16 agosto (Palio dell'Assunta); la gara tra le 17 contrade è attestata nella forma attuale dal 1644." },
    { d: "La Vernaccia di San Gimignano è stata la prima DOC bianca d'Italia. In quale anno ottenne la denominazione?", r: ["1966", "1963", "1980"], c: 0, sp: "La Vernaccia di San Gimignano è la prima DOC bianca d'Italia (1966) e ha ottenuto la DOCG nel 1993; San Gimignano è inscritta nel Patrimonio UNESCO dal 1990." },
    { d: "La Battaglia di Isso del 333 a.C. vide scontrarsi Alessandro Magno contro chi?", r: ["Dario III di Persia", "Tolomeo I d'Egitto", "Pirro d'Epiro"], c: 0, sp: "La Battaglia di Isso (333 a.C.) vide Alessandro Magno sconfiggere Dario III di Persia; l'episodio è raffigurato nel celebre mosaico proveniente dalla Casa del Fauno di Pompei, conservato al MANN di Napoli." },
    { d: "San Francesco d'Assisi ricevette le stimmate nel 1224 in quale luogo della Toscana?", r: ["La Verna (AR)", "Camaldoli (AR)", "Assisi, nella Porziuncola"], c: 0, sp: "Francesco d'Assisi ricevette le stimmate il 14 settembre 1224 sul monte della Verna nel Casentino aretino (AR), luogo ceduto al santo nel 1213 dal conte Orlando di Chiusi della Verna." },
    { d: "Il Corridoio Vasariano di Firenze collega Palazzo Vecchio a Palazzo Pitti attraverso il Ponte Vecchio. Chi lo fece costruire?", r: ["Cosimo I de' Medici nel 1565 su progetto di Giorgio Vasari", "Francesco I de' Medici nel 1581 come galleria privata", "Lorenzo il Magnifico nel 1490 su progetto di Giuliano da Sangallo"], c: 0, sp: "Il Corridoio Vasariano fu fatto costruire da Cosimo I de' Medici nel 1565 su progetto di Giorgio Vasari; collega Palazzo Vecchio a Palazzo Pitti passando sopra il Ponte Vecchio, da cui Cosimo espulse i beccai sostituendoli con orafi e gioiellieri." },
    { d: "Il Castello Estense di Ferrara è circondato da un fossato con elementi difensivi originali. Quali?", r: ["Ponti levatoi originali ancora funzionanti", "Cannoni in bronzo del XIV sec. ancora in posizione", "Torri angolari con caditoie medievali intatte"], c: 0, sp: "Il Castello Estense di Ferrara è tuttora circondato dal fossato con ponti levatoi originali; fu edificato nel 1385 per volontà di Niccolò II d'Este a seguito di una rivolta popolare." },
    { d: "Il Tempio di Ellesija nel Museo Egizio di Torino fu donato dall'Egitto all'Italia in quale anno?", r: ["1966", "1953", "1978"], c: 0, sp: "Il Tempio rupestre di Ellesija fu donato dall'Egitto all'Italia nel 1966, nell'ambito della campagna UNESCO per salvare i monumenti nubiani minacciati dalle acque del Lago Nasser dopo la costruzione della Diga di Assuan; fu presentato al pubblico nel 1970." },
    { d: "La Tomba di Kha e Merit fu scoperta intatta a Deir el-Medina nel 1906. Chi era Kha?", r: ["Capocantiere reale della XVIII Dinastia nella Valle dei Re", "Alto sacerdote di Amon durante il regno di Ramses II", "Generale dell'esercito del faraone Tutankhamon"], c: 0, sp: "Kha era capocantiere reale della XVIII Dinastia; la sua tomba, scoperta intatta il 15 febbraio 1906 da Schiaparelli a Deir el-Medina, è l'unica non saccheggiata dell'intera necropoli; il corredo conta oltre 460 oggetti conservati al Museo Egizio di Torino." },
    { d: "Il Consorzio Frasassi fu istituito nel 1972. In quale anno le Grotte di Frasassi furono aperte al pubblico?", r: ["1° settembre 1974", "15 giugno 1972", "1° aprile 1976"], c: 0, sp: "Le Grotte di Frasassi furono aperte al pubblico il 1° settembre 1974; il Consorzio Frasassi (Comune di Genga e Provincia di Ancona) era stato istituito nel 1972 dopo la scoperta del 1971." },
    { d: "Il Teatro alla Scala di Milano subì gravi danni durante la Seconda Guerra Mondiale. In quale anno fu riaperto e con quale evento?", r: ["Il 26 dicembre 1946 con un concerto storico diretto da Arturo Toscanini", "Il 3 agosto 1948 con la prima di Otello di Verdi diretta da Tullio Serafin", "Il 7 dicembre 1945 con il concerto inaugurale diretto da Victor De Sabata"], c: 0, sp: "Dopo i bombardamenti del 1943, il Teatro alla Scala di Milano fu ricostruito e riaperto il 26 dicembre 1946 con un concerto storico diretto da Arturo Toscanini." }
,{ d: "Piazza del Campo a Siena è caratterizzata da una forma a conchiglia con nove spicchi. Cosa rappresentano i nove spicchi?", r: ["Il Governo dei Nove (1287-1355), il regime oligarchico di mercanti", "Le nove porte medievali della città", "Le nove contrade più antiche di Siena"], c: 0, sp: "Piazza del Campo è la piazza principale, a forma di conchiglia o ventaglio con nove spicchi che rappresentano il Governo dei Nove (1287-1355), il regime oligarchico di mercanti che governò la città nel periodo d'oro." },
{ d: "In quali date si corre il Palio di Siena in Piazza del Campo?", r: ["2 luglio e 16 agosto", "15 giugno e 1° settembre", "25 aprile e 2 giugno"], c: 0, sp: "Due volte l'anno (2 luglio e 16 agosto) in piazza del Campo si corre il Palio di Siena, la storica gara equestre tra le 17 contrade della città, attestata dal 1644 nella forma attuale." },
{ d: "Per quale caratteristica la Val d'Orcia è stata iscritta nel Patrimonio Mondiale UNESCO nel 2004?", r: ["Paesaggio culturale che rappresenta un ideale di buon governo e gestione del territorio medievale e rinascimentale", "Presenza esclusiva di vigneti di Chianti Classico DOCG", "Conservazione di città-stato etrusche e romane"], c: 0, sp: "Il paesaggio della Val d'Orcia è iscritto nel Patrimonio Mondiale UNESCO dal 2004 come paesaggio culturale che rappresenta un ideale di buon governo e gestione del territorio elaborato nella Toscana medievale e rinascimentale." },
{ d: "Pienza è considerata il primo esempio di città pianificata secondo i principi dell'Umanesimo. Chi commissionò il progetto di rinnovamento urbano?", r: ["Papa Pio II Piccolomini", "Lorenzo il Magnifico", "Cosimo I de' Medici"], c: 0, sp: "Pienza è una cittadina rinascimentale progettata da Leon Battista Alberti e Bernardo Rossellino tra 1459 e 1462 su commissione di papa Pio II Piccolomini; fu il primo esempio di città pianificata secondo i principi dell'Umanesimo." },
{ d: "Quale tecnica decorativa riveste interamente la Cappella dei Principi nel mausoleo dei Medici a Firenze?", r: ["Commesso di pietre dure (porfido, lapislazzuli, madreperla, cristallo di rocca, giada)", "Affresco rinascimentale in stile grottesco", "Mosaico in tessere di vetro e oro"], c: 0, sp: "La Cappella dei Principi ... rivestita interamente in commesso di pietre dure (porfido, lapislazzuli, madreperla, cristallo di rocca, giada), è uno degli esempi più sontuosi di questo tipo di manifattura." }
  ,{ d: "Il David di Michelangelo fu originariamente commissionato per essere collocato dove?", r: ["Sul tetto della Cattedrale di Santa Maria del Fiore", "Nella Piazza della Signoria", "Nella Sagrestia Nuova di San Lorenzo"], c: 0, sp: "Il David (1501-04) fu commissionato dall'Opera del Duomo di Firenze per essere collocato sul tetto della Cattedrale ma, per la straordinaria qualità, fu posto in Piazza della Signoria." },
{ d: "Da chi fu acquistato Palazzo Pitti nel 1549, facendolo diventare la residenza principale dei Medici?", r: ["Eleonora di Toledo, moglie di Cosimo I de' Medici", "Luca Pitti, banchiere fiorentino", "Vittorio Emanuele III di Savoia"], c: 0, sp: "Palazzo Pitti ... nel 1549 fu acquistato da Eleonora di Toledo, moglie di Cosimo I de' Medici, e da allora divenne la residenza principale dei Medici." }

            normativa: [
                { d: "Il Codice dei Beni Culturali e del Paesaggio (D.Lgs. 42/2004) definisce la valorizzazione del patrimonio culturale. Come viene definita la fruizione in questo contesto?", r: ["Come il diritto della collettività di godere del patrimonio culturale, principio cardine del Codice (art. 103)", "Come l'insieme delle attività dirette a migliorare la conservazione e la conoscenza", "Come la concessione di licenze a privati per la gestione dei servizi museali aggiuntivi"], c: 0, sp: "La fruizione è definita nel Codice come il diritto della collettività di godere del patrimonio culturale; lo Stato ne promuove e facilita l'accesso, anche da parte delle persone con disabilità (art. 103)." },
                { d: "La Legge 190/2023 riforma la professione di guida turistica. Quale strumento operativo rende esecutiva questa riforma?", r: ["Il Decreto Ministeriale 26 giugno 2024 n. 88, con requisiti per l'iscrizione all'Albo, modalità d'esame e codice deontologico", "Il DPCM 177/2023 che definisce l'organizzazione del Ministero del Turismo", "Il D.Lgs. 79/2011 (Testo Unico del Turismo) che disciplina tutte le professioni turistiche"], c: 0, sp: "Il D.M. 88/2024 è lo strumento operativo che rende esecutiva la L. 190/2023: specifica requisiti per l'iscrizione all'Albo nazionale, modalità dell'esame di abilitazione, programma d'esame e codice deontologico." },
                { d: "La Convenzione ONU sui diritti delle persone con disabilità (2006), art. 30, riguarda il turismo accessibile. Quale forza giuridica ha in Italia?", r: ["Ha forza di legge in Italia, ratificata con L. 18/2009", "Ha valore di raccomandazione non vincolante, recepita volontariamente dalle regioni", "Ha valore di direttiva UE vincolante, recepita con D.Lgs. 29/2024"], c: 0, sp: "La Convenzione ONU sui diritti delle persone con disabilità (2006) ha forza di legge in Italia grazie alla ratifica con Legge 18/2009; l'art. 30 obbliga gli Stati a garantire l'accesso ai luoghi culturali e turistici." },
                { d: "Il D.Lgs. 79/2011 (Testo Unico del Turismo) distingue tra Organizzatori e Intermediari. Qual è la differenza principale?", r: ["Gli Organizzatori concepiscono e organizzano i pacchetti turistici; gli Intermediari li vendono al pubblico", "Gli Organizzatori vendono direttamente al cliente; gli Intermediari agiscono solo per conto terzi", "Gli Organizzatori sono tour operator internazionali; gli Intermediari sono agenzie locali"], c: 0, sp: "Il D.Lgs. 79/2011 distingue tra Organizzatori (che concepiscono e organizzano pacchetti turistici) e Intermediari (che vendono al pubblico i pacchetti organizzati da altri), imponendo obblighi informativi, contrattuali e di protezione finanziaria." },
                { d: "L'art. 9 della Costituzione italiana è rilevante per il turismo culturale. Quale principio enuncia?", r: ["La tutela del paesaggio e del patrimonio storico e artistico della Nazione", "La libertà di circolazione e di soggiorno, diritto di viaggiare liberamente", "Il diritto alla retribuzione proporzionata per i lavoratori del settore turistico"], c: 0, sp: "L'art. 9 della Costituzione enuncia la tutela del paesaggio e del patrimonio storico e artistico della Nazione; è il fondamento costituzionale per il turismo culturale e per tutta la legislazione sui beni culturali." }
            , { d: "Secondo il D.Lgs 42/2004, quali attività comprende la valorizzazione del patrimonio culturale?", r: ["Promozione di interventi per la qualità della fruizione, diffusione della conoscenza, ideazione di itinerari e collaborazione con enti pubblici e privati", "Esclusivamente la manutenzione straordinaria dei beni vincolati", "Solo l'organizzazione di mostre temporanee e prestiti internazionali"], c: 0, sp: "La valorizzazione (artt. 6 e 111-120) è definita come l'insieme delle attività dirette a migliorare la conservazione, la conoscenza e la pubblica fruizione, e comprende la promozione di interventi per la qualità della fruizione, la diffusione della conoscenza, l'ideazione di itinerari e la collaborazione con enti pubblici e privati." },
{ d: "Il Codice dei Beni Culturali disciplina concessioni e appalti per i servizi aggiuntivi nei musei. Quali servizi sono tipicamente inclusi?", r: ["Bookshop e caffetterie, finalizzati a migliorare l'esperienza di fruizione", "Servizi di vigilanza armata e trasporto valori", "Gestione delle prenotazioni alberghiere per i visitatori"], c: 0, sp: "Il Codice disciplina il sistema delle concessioni e degli appalti per i servizi aggiuntivi (bookshop, caffetterie) nei musei e luoghi della cultura, finalizzati a migliorare l'esperienza di fruizione." },
{ d: "Quali decreti hanno attuato la riforma dei musei italiani, successivamente integrati nel D.Lgs 42/2004?", r: ["D.Lgs. n. 62/2017 e D.M. n. 113/2018", "D.L. n. 83/2014 e D.M. n. 23/2015", "D.P.R. n. 417/1995 e D.M. n. 507/1997"], c: 0, sp: "Le successive modifiche e integrazioni del Codice includono i decreti attuativi della riforma dei musei: D.Lgs. n. 62/2017 e D.M. n. 113/2018." },
{ d: "Il D.Lgs 79/2011 impone agli operatori turistici specifici obblighi di garanzia finanziaria. Quali sono?", r: ["Polizza assicurativa di responsabilità civile e fideiussione", "Deposito cauzionale in denaro presso la Banca d'Italia", "Sottoscrizione obbligatoria di fondi pensione integrativi"], c: 0, sp: "Il Testo Unico del Turismo stabilisce i requisiti per l'esercizio delle imprese, incluso l'obbligo di polizza assicurativa RC e di fideiussione." },
{ d: "Quale direttiva europea è stata attuata dal Titolo II del D.Lgs 79/2011 in materia di contratti di pacchetto turistico?", r: ["Direttiva (UE) 2015/2302", "Direttiva 90/314/CEE", "Direttiva Servizi 2006/123/CE"], c: 0, sp: "Il Titolo II del D.Lgs. 79/2011 disciplina il contratto di pacchetto turistico e il contratto di vendita di servizi turistici isolati, attuando la Direttiva (UE) 2015/2302." },
{ d: "La L. 190/2023 mira a superare la frammentazione normativa regionale per le guide turistiche. Su quale articolo costituzionale si basa per garantire la libertà di prestazione su tutto il territorio nazionale?", r: ["Art. 16 Cost. (libertà di circolazione e soggiorno)", "Art. 9 Cost. (tutela del paesaggio)", "Art. 36 Cost. (retribuzione proporzionata)"], c: 0, sp: "La legge riconosce piena libertà di prestazione di servizi in tutta Italia alle guide iscritte all'albo di una qualsiasi regione, applicando l'art. 16 Cost. sulla libertà di circolazione e di soggiorno." },
{ d: "Quali requisiti minimi uniformi per l'accesso alla professione di guida turistica sono previsti dalla L. 190/2023?", r: ["Titoli di studio, abilitazione linguistica, corso di formazione", "Solo il superamento di un esame teorico-pratico regionale", "Laurea magistrale in storia dell'arte e cinque anni di esperienza"], c: 0, sp: "La L. 190/2023 ha l'obiettivo di stabilire requisiti minimi uniformi per l'accesso alla professione, tra cui titoli di studio, abilitazione linguistica e corso di formazione." },
{ d: "Prima della riforma del 2023, la regolamentazione delle guide turistiche era frammentata a causa della ripartizione delle competenze legislative. Quale articolo della Costituzione ne è la causa?", r: ["Art. 117 Cost.", "Art. 41 Cost.", "Art. 32 Cost."], c: 0, sp: "L'art. 117 Cost., ripartendo le competenze legislative tra Stato e Regioni, aveva generato un panorama normativo frammentato nel settore delle guide turistiche, ora superato dalla L. 190/2023." },
{ d: "Secondo l'art. 6 del TFUE, quale tipo di competenza ha l'Unione Europea in materia di turismo?", r: ["Politica di sostegno, coordinamento o completamento dell'azione degli Stati membri", "Competenza esclusiva", "Competenza concorrente con gli Stati membri"], c: 0, sp: "L'UE non ha una competenza diretta in materia di turismo: si tratta di una politica di sostegno ex art. 6 TFUE, per cui l'Unione può solo sostenere, coordinare o completare l'azione degli Stati membri." },
{ d: "Quale principio del TFUE garantisce alle imprese e ai professionisti del turismo la possibilità di operare liberamente in qualsiasi Stato membro?", r: ["Libera prestazione di servizi (Art. 56 TFUE)", "Libera circolazione delle merci (Art. 28 TFUE)", "Libera circolazione dei capitali (Art. 63 TFUE)"], c: 0, sp: "L'art. 56 TFUE sulla libera prestazione di servizi garantisce alle imprese e ai professionisti del turismo di operare in qualsiasi Stato membro, influendo profondamente sul settore." },
{ d: "Attraverso quali fondi l'Unione Europea finanzia progetti per lo sviluppo sostenibile del turismo?", r: ["Fondi Strutturali (FESR, FSE+)", "Fondo Europeo per gli Investimenti Strategici (FEIS) esclusivamente", "Banca Europea per gli Investimenti (BEI)"], c: 0, sp: "L'UE influisce sul turismo attraverso i Fondi Strutturali, in particolare FESR e FSE+, che finanziano progetti per lo sviluppo sostenibile del turismo." },

        const TOTALE_DOMANDE_DB = Object.values(DOMANDE).reduce((sum, arr) => sum + arr.length, 0);
        const TOTALE_TEST = Object.values(DISTRIBUZIONE).reduce((sum, n) => sum + n, 0);

        // Funzioni utilità
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function generaTest() {
            const test = [];
            Object.entries(DISTRIBUZIONE).forEach(([cat, num]) => {
                const pool = shuffle(DOMANDE[cat]);
                const selezionate = pool.slice(0, num);
                selezionate.forEach(q => {
                    const opzioni = q.r.map((testo, idx) => ({ testo, originale: idx }));
                    const opzioniMescolate = shuffle(opzioni);
                    const nuovoCorretto = opzioniMescolate.findIndex(o => o.originale === q.c);
                    test.push({
                        ...q,
                        categoria: cat,
                        r: opzioniMescolate.map(o => o.testo),
                        c: nuovoCorretto
                    });
                });
            });
            return shuffle(test);
        }

        // Componente App

                        </div>
                    </div>
                    <div style={{ maxWidth: '760px', margin: '0 auto 16px', height: '4px', background: '#d0dae8', borderRadius: '2px' }}>
                        <div style={{ height: '100%', background: '#1a3a6b', width: `${progresso}%`, borderRadius: '2px' }} />
                    </div>
                    <div style={{ maxWidth: '760px', margin: '0 auto', background: 'white', borderRadius: '4px', boxShadow: '0 2px 8px rgba(0,0,0,0.08)', overflow: 'hidden' }}>
                        <div style={{ background: CATEGORIE_COLORI[domanda.categoria], padding: '8px 20px', display: 'flex', alignItems: 'center', gap: '8px' }}>
                            <span style={{ color: 'white', fontSize: '11px', fontFamily: 'Arial', textTransform: 'uppercase', letterSpacing: '1.5px', fontWeight: 'bold' }}>{CATEGORIE_NOMI[domanda.categoria]}</span>
                        </div>
                        <div style={{ padding: '28px 28px 20px' }}>
                            <p style={{ fontSize: '1.05rem', color: '#1a2b4a', lineHeight: '1.7', margin: 0, fontWeight: 500 }}>{domanda.d}</p>
                        </div>
                        <div style={{ padding: '0 28px 24px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                            {domanda.r.map((testo, i) => (
                                <button key={i} onClick={() => rispondi(i)} disabled={mostrata} style={{ background: getColoreOpzione(i), border: `2px solid ${getBordoOpzione(i)}`, borderRadius: '4px', padding: '14px 16px', textAlign: 'left', cursor: mostrata ? 'default' : 'pointer', transition: 'all 0.15s', display: 'flex', alignItems: 'flex-start', gap: '12px', width: '100%' }}>
                                    <span style={{ minWidth: '26px', height: '26px', borderRadius: '50%', background: mostrata ? (i === corretta ? '#27ae60' : (i === selezionata ? '#c0392b' : '#e2e8f0')) : '#e2e8f0', color: mostrata ? (i === corretta || i === selezionata ? 'white' : '#666') : '#666', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '12px', fontWeight: 'bold', fontFamily: 'Arial', flexShrink: 0 }}>
                                        {mostrata ? (i === corretta ? '✓' : (i === selezionata ? '✗' : String.fromCharCode(65+i))) : String.fromCharCode(65+i)}
                                    </span>
                                    <span style={{ fontSize: '0.95rem', color: '#2d3748', lineHeight: '1.5' }}>{testo}</span>
                                </button>
                            ))}
                        </div>
                        {mostrata && (
                            <div style={{ margin: '0 28px 24px', background: isCorretta ? '#f0fff4' : '#fff5f5', border: `1px solid ${isCorretta ? '#9ae6b4' : '#feb2b2'}`, borderRadius: '4px', padding: '16px 18px' }}>
                                <div style={{ fontFamily: 'Arial', fontSize: '12px', fontWeight: 'bold', textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px', color: isCorretta ? '#276749' : '#9b2335' }}>{isCorretta ? '✓ Risposta Corretta' : '✗ Risposta Errata'}</div>
                                <p style={{ margin: 0, fontSize: '0.9rem', color: '#2d3748', lineHeight: '1.6' }}>{domanda.sp}</p>
                            </div>
                        )}
                        {mostrata && (
                            <div style={{ padding: '0 28px 28px' }}>
                                <div style={{ display: 'flex', gap: '12px' }}>
                                    <button onClick={indietro} disabled={idx === 0} style={{ background: idx === 0 ? '#ccc' : '#1a3a6b', color: 'white', border: 'none', borderRadius: '4px', padding: '14px 32px', fontSize: '14px', cursor: idx === 0 ? 'not-allowed' : 'pointer', fontFamily: 'Arial', textTransform: 'uppercase', letterSpacing: '1px', fontWeight: 'bold', flex: 1 }}>
                                        ← Domanda Precedente
                                    </button>
                                    <button onClick={avanti} style={{ background: '#1a3a6b', color: 'white', border: 'none', borderRadius: '4px', padding: '14px 32px', fontSize: '14px', cursor: 'pointer', fontFamily: 'Arial', textTransform: 'uppercase', letterSpacing: '1px', fontWeight: 'bold', width: '100%' }}>
                                        {idx + 1 >= test.length ? 'Vedi Risultati Finali →' : 'Domanda Successiva →'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
