                { d: "Il Tempio della Concordia nella Valle dei Templi di Agrigento è eccezionalmente conservato. A quale evento si deve la sua conservazione?", r: ["Alla trasformazione in chiesa cristiana nel VI sec. d.C. con apertura di arcate nelle pareti della cella", "All'interramento per frana che lo protesse dall'erosione medievale", "Al restauro integrale effettuato nel XIX sec. da Alexander Hardcastle"], c: 0, sp: "Il Tempio della Concordia (440-430 a.C.) è tra i più integri del mondo greco occidentale grazie alla trasformazione in chiesa cristiana nel VI sec. d.C. da parte del vescovo Grigentius." },

                { d: "Il Teatro Greco di Taormina è di impianto ellenistico ma fu trasformato in età romana. Qual è il diametro della cavea nella versione romana?", r: ["109 m, ampliata per accogliere spettacoli di gladiatori e venationes", "86 m, dimensione originale greca del III sec. a.C.", "130 m, dopo i lavori di Domiziano del I sec. d.C."], c: 0, sp: "In età romana la cavea del Teatro di Taormina fu ampliata fino a 109 m di diametro per adattarlo agli spettacoli di gladiatori e venationes." },

                { d: "La Cappella Palatina del Palazzo dei Normanni a Palermo fu consacrata nel 1140. Quale tecnica islamica caratterizza il suo soffitto?", r: ["Il soffitto a muqarnas in legno intagliato e dipinto, tecnica di origine islamica", "Il soffitto a volta a crociera con costolature gotiche in stile normanno-francese", "Il soffitto piano in lacunari di marmo bianco con dorature bizantine"], c: 0, sp: "La Cappella Palatina (consacrata nel 1140 sotto Ruggero II) presenta un soffitto a muqarnas in legno intagliato e dipinto, tecnica di origine islamica, combinata con mosaici dorati di maestranze bizantine e pavimento in opus sectile." },

                { d: "La Galleria degli Uffizi conserva la Nascita di Venere di Botticelli. Su quale supporto è dipinta quest'opera?", r: ["Su tela di lino, scelta per uso profano su commissione dei Medici", "Su tavola di pioppo preparata con gesso e colla", "Su rame con fondo argentato per uso decorativo"], c: 0, sp: "La Nascita di Venere (1485 ca.) è dipinta su tela di lino, scelta per uso profano su commissione dei Medici, non su tavola come le opere religiose." },
                { d: "La cupola di Santa Maria del Fiore a Firenze fu realizzata da Brunelleschi tra il 1420 e il 1436. Quale è il suo diametro?", r: ["45,5 m di diametro, la più grande cupola in muratura del mondo", "42,34 m come la cupola di San Pietro in Vaticano", "50 m, superiore a quella del Pantheon di Roma"], c: 0, sp: "La cupola di Brunelleschi misura 45,5 m di diametro ed è la cupola in muratura più grande del mondo, a 91 m di altezza alla sommità della lanterna." },
                { d: "La Cappella degli Scrovegni a Padova fu decorata da Giotto tra il 1304 e il 1306. Quale evento portò alla sua costruzione?", r: ["Enrico Scrovegni la fece costruire per espiare l'usura paterna sul terreno dell'antico anfiteatro romano", "Il vescovo di Padova la commissionò come cappella palatina sul sito di un tempio romano", "La famiglia Scrovegni la eresse come mausoleo di famiglia su richiesta di Bonifacio VIII"], c: 0, sp: "Enrico Scrovegni costruì la cappella tra il 1303 e il 1305 per espiare l'usura paterna, sul terreno dell'antico anfiteatro romano (Arena), affidando la decorazione a Giotto." },
                { d: "Le Cappelle Medicee comprendono la Sagrestia Nuova di Michelangelo. Quali statue ornano il sepolcro di Lorenzo de' Medici duca di Urbino?", r: ["L'Aurora e il Crepuscolo", "Il Giorno e la Notte", "La Vittoria e la Contemplazione"], c: 0, sp: "Il sepolcro di Lorenzo de' Medici duca di Urbino è ornato dall'Aurora e dal Crepuscolo, mentre quello di Giuliano duca di Nemours ha il Giorno e la Notte." },
                { d: "Il Battistero di Firenze presenta tre porte bronzee. Come definì Michelangelo la Porta Est di Ghiberti?", r: ["Porta del Paradiso", "Porta della Gloria", "Porta della Sapienza"], c: 0, sp: "Michelangelo definì la Porta Est di Lorenzo Ghiberti (1425-1452) 'Porta del Paradiso'; le dieci formelle dorate raffigurano scene dell'Antico Testamento in prospettiva scientifica." },
                { d: "Il Palazzo Ducale di Urbino conserva lo Studiolo del Duca. Di quale tecnica artistica è un capolavoro questo ambiente?", r: ["Della tarsia lignea: quattro pareti con illusioni tridimensionali di librerie, strumenti musicali e armature, di Giuliano e Benedetto da Maiano", "Dell'affresco prospettico: pareti dipinte con vedute di città ideale attribuite a Piero della Francesca", "Del commesso di pietre dure: pavimento e pareti in marmi policromi di manifattura fiorentina"], c: 0, sp: "Lo Studiolo del Duca (1476 ca.) è un capolavoro della tarsia lignea: quattro pareti interamente rivestite da intarsi di Giuliano e Benedetto da Maiano che creano illusioni tridimensionali di librerie, strumenti, armature e oggetti simbolici." },
                { d: "La Basilica di Santa Maria Novella a Firenze conserva la Trinità di Masaccio. Quale primato storico-artistico ha questo affresco?", r: ["È il primo affresco della storia dell'arte a utilizzare la prospettiva scientifica brunelleschiana con trompe-l'oeil architettonico", "È il primo ciclo narrativo in affresco a tre registri sovrapposti nell'arte toscana del Quattrocento", "È il primo affresco realizzato su intonaco secco con tecnica mista tempera e olio"], c: 0, sp: "La Trinità di Masaccio (1427-28) è il primo affresco della storia dell'arte a utilizzare la prospettiva scientifica brunelleschiana, con un trompe-l'oeil architettonico a volta a botte." },
                { d: "La Torre Pendente di Pisa ha subito interventi di consolidamento. Di quanto è inclinata rispetto alla verticale dopo i lavori del 1990-2001?", r: ["Di circa 3,99 m rispetto alla verticale, ridotta di circa 50 cm rispetto all'inclinazione precedente", "Di circa 5,50 m, mantenuta intenzionalmente per preservare il carattere del monumento", "Di circa 2,44 m, riportata alla stessa inclinazione del XIV sec. dopo i lavori"], c: 0, sp: "Dopo gli interventi di consolidamento del 1990-2001, la Torre di Pisa è pendente di circa 3,99 m rispetto alla verticale; l'inclinazione è stata ridotta di circa 50 cm rispetto a quella precedente." },
                { d: "Il Chianti Classico DOCG è prodotto nella zona tra Firenze e Siena. Quale vitigno è il principale della denominazione?", r: ["Il Sangiovese", "Il Vernaccia", "Il Canaiolo Nero"], c: 0, sp: "Il Chianti Classico DOCG è prodotto principalmente con il vitigno Sangiovese nel territorio collinare tra Firenze e Siena, riconoscibile dal simbolo del Gallo Nero del Consorzio." },
                { d: "Le Ville Medicee della Toscana sono Patrimonio UNESCO dal 2013. Quale villa fu commissionata da Lorenzo il Magnifico a Giuliano da Sangallo?", r: ["Villa Medici a Poggio a Caiano (Prato), con loggiato e fregio di Filippino Lippi", "Villa di Castello a Sesto Fiorentino, con i giardini di Tribolo", "Villa della Petraia a Sesto Fiorentino, con affreschi di Volterrano"], c: 0, sp: "Villa Medici a Poggio a Caiano (Prato) è l'unica villa commissionata da Lorenzo il Magnifico, progettata da Giuliano da Sangallo; è nota per il loggiato e il fregio di Filippino Lippi." },
                { d: "Il Tondo Doni di Michelangelo si trova nella Galleria degli Uffizi a Firenze (FI). Quale caratteristica lo rende unico nella produzione di Michelangelo?", r: ["È l'unica pittura su tavola autografa di Michelangelo conservata a Firenze", "È l'unico dipinto religioso di Michelangelo su commissione privata dei Medici", "È l'unica opera di Michelangelo con firma visibile nel cartiglio sul bordo"], c: 0, sp: "Il Tondo Doni (1506-08 ca.) nella Galleria degli Uffizi a Firenze (FI) è l'unica pittura su tavola autografa di Michelangelo conservata a Firenze; fu commissionato da Agnolo Doni per le nozze con Maddalena Strozzi." },
                { d: "Il David di Michelangelo è conservato nella Galleria dell'Accademia a Firenze (FI). Per quale destinazione originaria fu scolpito?", r: ["Per il tetto della Cattedrale di Santa Maria del Fiore, su commissione dell'Opera del Duomo", "Per la Piazza della Signoria come simbolo della Repubblica fiorentina su commissione dei Priori", "Per il cortile di Palazzo Vecchio come pendant del David di Donatello su commissione dei Medici"], c: 0, sp: "Il David (1501-04) fu commissionato dall'Opera del Duomo per essere collocato sul tetto della Cattedrale di Santa Maria del Fiore; per la straordinaria qualità fu poi posto in Piazza della Signoria. Oggi è alla Galleria dell'Accademia di Firenze (FI)." },
                { d: "La Primavera di Botticelli è conservata nella Galleria degli Uffizi a Firenze (FI). Su quale supporto è dipinta?", r: ["Su tavola di pioppo, a tempera, commissionata dalla famiglia Medici per uso profano", "Su tela di lino, a olio, come la Nascita di Venere dello stesso periodo", "Su tavola di noce, a tempera grassa, per la cappella privata di Lorenzo il Magnifico"], c: 0, sp: "La Primavera (1480-82 ca.) di Botticelli alla Galleria degli Uffizi di Firenze (FI) è dipinta a tempera su tavola di pioppo, su commissione dei Medici." },
                { d: "Il Pulpito di Nicola Pisano si trova nel Battistero di Pisa (PI). Quale primato storico rappresenta quest'opera?", r: ["È del 1260, prima opera che segna il recupero della scultura classica antica nella tradizione medievale italiana", "È del 1302-11, capolavoro della scultura gotica italiana con scene della vita di Cristo in rilievo vivacissimo", "È del 1265-68, il più antico dei pulpiti firmati di Nicola Pisano con scene di Cristo e del Giudizio Universale"], c: 0, sp: "Il Pulpito di Nicola Pisano (1260) nel Battistero di Pisa (PI) è la prima opera che segna il recupero della scultura classica antica nella tradizione medievale italiana; il Pulpito del 1265-68 è invece nel Duomo di Siena." },
                { d: "La Galleria Palatina di Palazzo Pitti a Firenze (FI) conserva il ciclo di affreschi di Pietro da Cortona nelle Sale dei Pianeti. Per quale granduca mediceo fu eseguito?", r: ["Per Ferdinando II de' Medici tra il 1640 e il 1647", "Per Cosimo I de' Medici tra il 1555 e il 1562 tramite Giorgio Vasari", "Per Francesco I de' Medici tra il 1570 e il 1575 come decorazione dello Studiolo"], c: 0, sp: "Il ciclo di affreschi di Pietro da Cortona nelle Sale dei Pianeti della Galleria Palatina di Palazzo Pitti a Firenze (FI) fu eseguito per Ferdinando II de' Medici tra il 1640 e il 1647; è uno dei massimi esempi di decorazione barocca in Italia." },
                { d: "Il Giardino di Boboli a Firenze (FI) fu progettato come giardino di quale residenza?", r: ["Di Palazzo Pitti, residenza dei granduchi di Toscana", "Della Villa Medicea di Castello, residenza estiva dei Medici", "Del Palazzo Vecchio, sede del governo della Repubblica fiorentina"], c: 0, sp: "Il Giardino di Boboli fu progettato come giardino di Palazzo Pitti, residenza dei granduchi di Toscana; è uno dei più importanti esempi di giardino all'italiana." },
               , { d: "Quale celebre ciclo di affreschi di Ambrogio Lorenzetti si trova nel Museo Civico del Palazzo Pubblico di Siena?", r: ["Allegoria del Buono e del Cattivo Governo", "Storie di Pio II", "Maestà"], c: 0, sp: "Il Palazzo Pubblico ... conserva il Museo Civico con i celebri affreschi ... di Ambrogio Lorenzetti (Allegoria del Buono e del Cattivo Governo, 1338-40, ciclo laico di eccezionale valore storico e artistico)." },
{ d: "Quale caratteristica distingue il pulpito del Duomo di Siena scolpito da Nicola Pisano?", r: ["È il più antico dei suoi pulpiti firmati", "È l'unico in Italia realizzato in marmo bianco e nero a fasce alternate", "Raffigura esclusivamente scene della Passione di Cristo"], c: 0, sp: "Il Pulpito di Nicola Pisano (1265-68), il più antico dei suoi pulpiti firmati, con scene di Cristo e del Giudizio Universale." },
{ d: "Chi affrescò la Libreria Piccolomini nel Duomo di Siena con le Storie di Pio II?", r: ["Pinturicchio", "Simone Martini", "Ambrogio Lorenzetti"], c: 0, sp: "La Libreria Piccolomini (1492-1502) è affrescata da Pinturicchio con le Storie di Pio II." },
{ d: "Quali figure allegoriche Michelangelo scolpì per il sepolcro di Giuliano de' Medici duca di Nemours nella Sagrestia Nuova?", r: ["Il Giorno e la Notte", "L'Aurora e il Crepuscolo", "La Vita e la Morte"], c: 0, sp: "La Sagrestia Nuova ... ospita i sepolcri di Giuliano de' Medici duca di Nemours (con le sculture allegoriche del Giorno e della Notte) e di Lorenzo de' Medici duca di Urbino (con l'Aurora e il Crepuscolo)." },
{ d: "Quale celebre scultura greca è conservata nella Tribuna degli Uffizi?", r: ["Venere de' Medici (copia ellenistica da Prassitele)", "Il Tondo Doni di Michelangelo", "La Medusa di Caravaggio"], c: 0, sp: "La Tribuna ... conserva la Venere de' Medici (I sec. a.C., copia ellenistica da Prassitele), capolavoro della scultura greca nella collezione medicea." },
{ d: "Quale museo fiorentino ospita la maggior concentrazione mondiale di opere di Raffaello?", r: ["La Galleria Palatina di Palazzo Pitti", "La Galleria degli Uffizi", "La Galleria dell'Accademia"], c: 0, sp: "La Galleria Palatina ... ospita la maggior concentrazione mondiale di opere di Raffaello (La Velata, Madonna della Seggiola, Madonna del Granduca, ecc.)." },
{ d: "Per quale progetto Michelangelo realizzò i Prigioni (o Schiavi) esposti nella Galleria dell'Accademia, lasciandoli deliberatamente incompiuti?", r: ["La tomba di papa Giulio II in San Pietro in Vincoli", "La facciata della Basilica di San Lorenzo", "Il coro del Duomo di Firenze"], c: 0, sp: "La Galleria dei Prigioni ... espone quattro statue colossali di Michelangelo ... originariamente destinate alla tomba di papa Giulio II in San Pietro in Vincoli e lasciate deliberatamente incompiute (non-finito michelangiolesco)." }
        ,       
                // VENETO (14)
                { d: "Le Gallerie dell'Accademia di Venezia conservano La Tempesta di Giorgione. Quale è il soggetto raffigurato nell'opera?", r: ["Una donna che allatta e un soldato in primo piano in un paesaggio burrascoso di soggetto incerto", "Una tempesta sul Canal Grande con gondolieri in fuga verso riva", "Il mito di Danae sorpresa da Zeus tramutato in nube temporalesca"], c: 0, sp: "La Tempesta (Giorgione, 1505-08 ca.) raffigura una donna che allatta e un soldato in primo piano in un paesaggio burrascoso; il soggetto è ancora incerto e il paesaggio atmosferico è protagonista assoluto." },
                { d: "La Basilica Palladiana di Vicenza fu progettata da Palladio nel 1549. Quale soluzione architettonica adottò Palladio per raccordare le aperture di ampiezza diseguale?", r: ["La serliana, bifora con arco centrale e piattabande laterali, detta anche motivo palladiano", "Il colonnato tuscanico con intercolumni variabili", "L'arco trionfale a tre fornici di diversa larghezza"], c: 0, sp: "Palladio usò la serliana (bifora con arco centrale e piattabande laterali), soluzione derivata da Sebastiano Serlio, che da lui prenderà il nome di motivo palladiano." },
                { d: "La Villa Capra detta La Rotonda di Palladio è la più celebre villa palladiana. Quale caratteristica la rende unica tra le ville private europee?", r: ["Fu la prima villa privata in Europa a ricevere un tetto a cupola, con quattro facciate identiche con pronao ionico", "Fu la prima villa costruita interamente in marmo di Carrara con giardino all'italiana", "Fu la prima villa privata a includere un teatro coperto sul modello del Teatro Olimpico"], c: 0, sp: "La Villa Capra-La Rotonda (1566-70) fu la prima villa privata in Europa a ricevere un tetto a cupola; ha pianta quadrata con quattro facciate identiche ognuna con pronao ionico e frontone." },
                { d: "Il Palazzo Ducale di Venezia conserva nella Sala del Maggior Consiglio il Paradiso di Tintoretto. Quali sono le dimensioni di questa tela?", r: ["22 x 7 m, la tela figurativa più grande del mondo (1592)", "30 x 10 m, la più grande tela del Rinascimento italiano", "18 x 6 m, eseguita per la Sala del Senato veneziano"], c: 0, sp: "Il Paradiso di Tintoretto (1592) misura 22 x 7 m ed è la tela figurativa più grande del mondo, conservata nella Sala del Maggior Consiglio del Palazzo Ducale." },
                { d: "La Basilica di Sant'Antonio a Padova ha un profilo esterno caratteristico. Quante cupole presenta?", r: ["Otto cupole: una centrale maggiore e sette minori sui transetti e sulle cappelle", "Cinque cupole di uguale dimensione in stile byzantino-veneziano", "Tre cupole: una centrale e due sui transetti come nelle basiliche bizantine"], c: 0, sp: "La Basilica di Sant'Antonio è caratterizzata da otto cupole (quella centrale maggiore, più le sette minori sui transetti e le cappelle), due campanili laterali e un portico frontale." },
                { d: "Il Prato della Valle a Padova è la più grande piazza d'Italia. Quale è la sua superficie e chi ne curò la sistemazione attuale?", r: ["88.620 mq di forma ellittica, sistemata dall'architetto Andrea Memmo nel 1775-76", "65.000 mq di forma rettangolare, sistemata dal Comune di Padova nel XVIII sec.", "120.000 mq di forma circolare, la più grande piazza d'Europa dell'età moderna"], c: 0, sp: "Il Prato della Valle misura 88.620 mq di forma ellittica con l'Isola Memmia al centro circondata da un canale con 78 statue; fu sistemato dall'architetto Andrea Memmo nel 1775-76." },
                { d: "L'Arena di Verona è il terzo anfiteatro per grandezza del mondo antico. Per quale evento culturale è oggi famosa?", r: ["Per il Festival Lirico dell'Arena, attivo dal 1913 con opere come l'Aida inaugurale", "Per il Festival Shakespeare, attivo dal 1850 con rappresentazioni delle tragedie del Bardo", "Per il Palio dell'Arena, gara equestre biennale tra i quartieri storici di Verona"], c: 0, sp: "L'Arena di Verona ospita il celebre Festival Lirico dell'Arena attivo dal 1913; la prima rappresentazione fu l'Aida di Verdi, in occasione del centenario della nascita del compositore." },
                { d: "La Laguna di Venezia è la più grande del Mediterraneo. Quale progetto ha installato barriere mobili alle bocche di porto?", r: ["Il progetto MOSE (Module Sperimentale Elettromeccanico), operativo dal 2020 con 78 barriere mobili", "Il progetto Atlantide, con 50 barriere fisse sommerse attivate per acqua alta superiore a 110 cm", "Il progetto Poseidon, con dighe mobili alle tre bocche di porto completato nel 2015"], c: 0, sp: "Il progetto MOSE (Module Sperimentale Elettromeccanico), con 78 barriere mobili alle tre bocche di porto (Lido, Malamocco e Chioggia), è operativo dal 2020 per difendere Venezia dall'acqua alta." },
                { d: "Le Gallerie dell'Accademia di Venezia conservano le Storie di Sant'Orsola di Vittore Carpaccio. Quante teleri compone questo ciclo?", r: ["Nove teleri (1490-1496) che narrano il martirio della principessa bretone", "Dodici teleri (1495-1500) con la vita di Sant'Orsola e dei suoi compagni martiri", "Sei teleri (1488-1492) con la leggenda della principessa e del suo corteo"], c: 0, sp: "Le Storie di Sant'Orsola di Carpaccio sono un ciclo di nove teleri (1490-1496) che narrano il martirio della principessa bretone con straordinaria ricchezza di dettagli architettonici e di costume." },
                { d: "L'Uomo Vitruviano di Leonardo da Vinci è conservato nelle Gallerie dell'Accademia di Venezia (VE). Quali sono le sue dimensioni e tecnica?", r: ["34,4 x 24,5 cm, penna e inchiostro su carta, datato al 1490; esposto rarissimamente per motivi conservativi", "50 x 35 cm, sanguigna su carta preparata, datato al 1492; esposto ogni cinque anni", "45 x 30 cm, matita e acquarello su pergamena, datato al 1495; visibile in copia digitale"], c: 0, sp: "L'Uomo Vitruviano (1490, penna e inchiostro su carta, 34,4 x 24,5 cm) è conservato nelle Gallerie dell'Accademia di Venezia (VE) e viene esposto rarissimamente per motivi conservativi." },
                { d: "Le Arche Scaligere si trovano accanto alla chiesa di Santa Maria Antica a Verona (VR). Quale tomba scaligera è considerata il più antico ritratto equestre gotico conservato in Italia?", r: ["La tomba di Cangrande I (morto 1329), con il cavaliere in sommità; l'originale è al Museo di Castelvecchio a Verona (VR)", "La tomba di Mastino II (morto 1351), con la figura equestre in bronzo dorato sul pinnacolo", "La tomba di Cansignorio (morto 1375), con doppia figura equestre sui lati del baldacchino"], c: 0, sp: "La tomba di Cangrande I (morto 1329) alle Arche Scaligere di Verona (VR) presenta il più antico ritratto equestre gotico conservato in Italia; l'originale del cavaliere è al Museo di Castelvecchio a Verona (VR), sul monumento c'è una copia." },
                { d: "La Pala d'Oro si trova nella Basilica di San Marco a Venezia (VE). Quali sono le sue dimensioni e di quante pietre preziose è composta?", r: ["250 x 140 cm con 2.000 pietre preziose e 83 smalti cloisonné (1102, ampliata nel 1209 e nel 1345)", "180 x 120 cm con 5.000 gemme e 150 smalti champlevé (IX sec., ampliata nel XII sec.)", "300 x 200 cm con 1.500 rubini e 200 smalti a mosaico (XI sec., completata nel XIV sec.)"], c: 0, sp: "La Pala d'Oro nella Basilica di San Marco a Venezia (VE) misura 250 x 140 cm ed è composta da 2.000 pietre preziose e 83 smalti cloisonné; fu realizzata nel 1102 e ampliata nel 1209 e nel 1345." },
                { d: "Il Ponte di Rialto a Venezia fu ricostruito in pietra tra il 1588 e il 1591. Chi ne fu il progettista?", r: ["Antonio da Ponte", "Andrea Palladio", "Jacopo Sansovino"], c: 0, sp: "Il Ponte di Rialto fu progettato da Antonio da Ponte e costruito tra il 1588 e il 1591; è l'unico ponte sul Canal Grande fino al 1854." },
                { d: "La Basilica di Santa Maria Gloriosa dei Frari a Venezia conserva l'Assunta di Tiziano. In quale anno fu completata quest'opera?", r: ["Nel 1518, per l'altare maggiore della basilica", "Nel 1505, come pala per la Chiesa di San Zaccaria", "Nel 1534, dopo il ritorno di Tiziano da Bologna"], c: 0, sp: "L'Assunta di Tiziano fu completata nel 1518 e collocata sull'altare maggiore della Basilica dei Frari; è considerata uno dei capolavori del Rinascimento veneziano." },

                // LOMBARDIA (10)
                { d: "Il Cenacolo Vinciano di Leonardo fu eseguito tra il 1494 e il 1498. Quale passo del Vangelo rappresenta?", r: ["Il momento in cui Cristo dice 'Uno di voi mi tradirà' (Vangelo di Giovanni 13,21)", "L'ultima cena secondo il Vangelo di Luca con l'istituzione dell'Eucaristia", "La lavanda dei piedi descritta dal Vangelo di Giovanni 13,1-17"], c: 0, sp: "Il Cenacolo rappresenta il momento dell'Ultima Cena descritto dal Vangelo di Giovanni (13,21): la frase 'Uno di voi mi tradirà' e la reazione dei dodici apostoli." },
                { d: "La Pinacoteca di Brera conserva il Cristo Morto di Mantegna. Quale tecnica e supporto furono usati per quest'opera?", r: ["Tempera su tela, con la prospettiva scorciata dei piedi in primo piano", "Olio su tavola di noce con fondo oro su commissione dei Gonzaga", "Affresco strappato e riportato su tela nel XVIII secolo"], c: 0, sp: "Il Cristo Morto (Mantegna, c.1483) è in tempera su tela ed è celebre per la prospettiva scorciata con i piedi in primo piano, soluzione compositiva di straordinaria audacia." },
                { d: "Il Teatro alla Scala di Milano fu inaugurato il 3 agosto 1778. Con quale opera fu inaugurato?", r: ["Europa riconosciuta di Antonio Salieri", "Orfeo ed Euridice di Cristoph Willibald Gluck", "Le nozze di Figaro di Wolfgang Amadeus Mozart"], c: 0, sp: "Il Teatro alla Scala fu inaugurato il 3 agosto 1778 con l'opera Europa riconosciuta di Antonio Salieri, su commissione dell'imperatrice Maria Teresa d'Austria." },
                { d: "La Certosa di Pavia fu fondata nel 1396 da Gian Galeazzo Visconti. Quale era la funzione originaria del complesso?", r: ["Mausoleo della dinastia viscontea e cappella palatina collegata al Castello Visconteo nel parco di caccia ducale", "Monastero di clausura benedettino per la preghiera perpetua in suffragio dei Visconti", "Centro di produzione artistica e scriptorium per la copiatura dei codici della Biblioteca Viscontea"], c: 0, sp: "La Certosa di Pavia fu fondata il 27 agosto 1396 da Gian Galeazzo Visconti come mausoleo della dinastia viscontea e cappella palatina collegata al vicino Castello Visconteo nel grande parco di caccia ducale." },
                { d: "Il Duomo di Milano è la più grande chiesa gotica d'Italia. Quante statue totali si contano sulla struttura?", r: ["Circa 3.400 statue totali tra guglie, pilastri e facciata, con 135 guglie", "Circa 1.200 statue concentrate sulla facciata neoclassica completata sotto Napoleone", "Circa 5.000 statue distribuite su tutti i livelli dell'edificio incluso l'interno"], c: 0, sp: "Il Duomo di Milano conta circa 3.400 statue totali e 135 guglie; la guglia maggiore (1762-1769) è sormontata dalla Madonnina dorata in rame dorato, alta 4,16 m, posta nel 1774." },
                { d: "Il Castello Scaligero di Sirmione è uno dei castelli lacustri medievali meglio conservati d'Italia. Quale elemento unico presenta al suo interno?", r: ["Un porto militare interno (darsena) che consentiva l'attracco diretto delle imbarcazioni militari all'interno del castello", "Un teatro all'aperto ricavato nel cortile centrale in età veneziana", "Un acquedotto sotterraneo che portava acqua dolce dal lago direttamente nelle cucine"], c: 0, sp: "Il Castello Scaligero di Sirmione presenta un porto militare interno (darsena) che consentiva l'attracco diretto delle imbarcazioni militari all'interno del castello, garantendo il controllo del traffico lacustre." },
                { d: "La Vittoria Alata è conservata nel Capitolium di Brescia (BS), nel Parco Archeologico di Brixia. Quando fu trovata e qual è la sua altezza?", r: ["Trovata nel 1826 tra due muri del tempio; bronzo del I sec. d.C., alta 194 cm", "Trovata nel 1930 durante i restauri del Capitolium; bronzo del II sec. d.C., alta 220 cm", "Trovata nel 1956 durante gli scavi del teatro romano; bronzo del III sec. d.C., alta 180 cm"], c: 0, sp: "La Vittoria Alata fu trovata nel 1826 tra due muri del Capitolium di Brescia (BS); è un bronzo del I sec. d.C. alto 194 cm, restaurato dall'Opificio delle Pietre Dure di Firenze." },
                { d: "La Camera degli Sposi di Mantegna si trova nel Castello di San Giorgio del Palazzo Ducale di Mantova (MN). In quale anno fu completata?", r: ["Nel 1474, affrescata per Ludovico III Gonzaga tra il 1465 e il 1474", "Nel 1480, completata dopo la morte di Mantegna dalla sua bottega", "Nel 1460, prima opera di Mantegna a Mantova per Francesco II Gonzaga"], c: 0, sp: "La Camera degli Sposi (o Camera Picta) nel Castello di San Giorgio del Palazzo Ducale di Mantova (MN) fu affrescata da Andrea Mantegna per Ludovico III Gonzaga tra il 1465 e il 1474." },
                { d: "La Crocifissione di Giovanni Donato da Montorfano del 1495 si trova nel refettorio di Santa Maria delle Grazie a Milano (MI). Sulla parete opposta si trova quale capolavoro?", r: ["Il Cenacolo Vinciano di Leonardo da Vinci (1494-1498)", "La Natività di Bernardino Luini (1510 ca.)", "L'Ultima Cena di Giovan Battista Tiepolo (1745 ca.)"], c: 0, sp: "Nel refettorio di Santa Maria delle Grazie a Milano (MI) la Crocifissione di Montorfano (1495) si trova sulla parete della controfacciata, sulla parete opposta al Cenacolo Vinciano di Leonardo da Vinci (1494-1498)." },
                { d: "Il Tempio Capitolino di Brescia fa parte del Parco Archeologico di Brixia (BS). A quale divinità era dedicato il tempio principale?", r: ["Alla Triade Capitolina: Giove, Giunone e Minerva", "Ad Apollo e alle Muse, divinità protettrici della cultura", "A Marte e Venere, progenitori mitici del popolo romano"], c: 0, sp: "Il Tempio Capitolino di Brescia era dedicato alla Triade Capitolina: Giove, Giunone e Minerva; il Parco Archeologico di Brixia è Patrimonio UNESCO dal 2011." },

    {

                // EMILIA-ROMAGNA (9)
                { d: "Il Battistero di Parma fu avviato da Benedetto Antelami nel 1196. In quanti ordini di logge si sviluppa la struttura ottagonale?", r: ["Quattro ordini di logge rivestiti in marmo rosa di Verona", "Tre ordini di arcate in marmo bianco di Carrara", "Cinque ordini di gallerie in pietra d'Istria bianca"], c: 0, sp: "Il Battistero di Parma, rivestito in marmo rosa di Verona, si sviluppa in altezza con quattro ordini di logge; è considerato il massimo esempio del passaggio dal romanico al gotico in Italia." },
                { d: "I Monumenti Paleocristiani di Ravenna comprendono la Basilica di Sant'Apollinare Nuovo. Chi la fece costruire all'inizio del VI sec.?", r: ["Teodorico, con due solenni cortei a mosaico nelle navate", "Galla Placidia, come suo mausoleo personale", "Giustiniano, dopo la conquista dell'Esarcato nel 540"], c: 0, sp: "La Basilica di Sant'Apollinare Nuovo fu voluta da Teodorico agli inizi del VI sec.; le navate ospitano due solenni cortei a mosaico, quello delle Vergini e quello dei Martiri." },
                { d: "Le Due Torri di Bologna sono il simbolo della città. Quale è l'altezza della Torre degli Asinelli?", r: ["Circa 97,2 m, la più alta torre medievale ancora accessibile d'Italia", "Circa 87 m come la Torre Ghirlandina di Modena", "Circa 102 m come la Torre del Mangia di Siena"], c: 0, sp: "La Torre degli Asinelli misura circa 97,2 m ed è la più alta torre medievale ancora accessibile d'Italia; è inclinata di circa 2,23 m rispetto alla verticale." },
                { d: "Il Castello Estense di Ferrara fu edificato nel 1385. Per quale motivo fu costruito così rapidamente?", r: ["A seguito di una rivolta popolare contro Niccolò II d'Este, che ordinò la costruzione immediata per protezione", "Per ospitare le truppe di Carlo Magno durante la campagna contro i Longobardi", "Per celebrare il matrimonio di Ercole I d'Este con Eleonora d'Aragona nel 1473"], c: 0, sp: "Il Castello Estense fu edificato nel 1385 per volontà di Niccolò II d'Este a seguito di una rivolta popolare; è tuttora circondato dal fossato con ponti levatoi originali." },
                { d: "Il Duomo di Modena fu fondato nel 1099. Chi ne progettò la struttura e chi eseguì le sculture della facciata?", r: ["L'architetto Lanfranco progettò la struttura; il maestro Wiligelmo scolpì i rilievi della facciata con scene della Genesi", "Benedetto Antelami progettò sia la struttura che le sculture come a Parma", "Nicola Pisano realizzò sia il progetto architettonico che il ciclo scultoreo della facciata"], c: 0, sp: "Il Duomo di Modena fu fondato nel 1099 su progetto dell'architetto Lanfranco con sculture del maestro Wiligelmo; i rilievi del portale centrale raffigurano scene della Genesi e storie dei protomartiri." },
                { d: "Il Teatro Farnese della Pilotta a Parma fu costruito tra il 1617 e il 1618. In quale occasione fu inaugurato e quando fu realmente usato per la prima volta?", r: ["Costruito per la visita di Cosimo II de' Medici, inaugurato nel 1628 per le nozze tra Margherita de' Medici e il duca Odoardo con una naumachia finale", "Costruito per l'incoronazione di Ranuccio I Farnese, inaugurato subito nel 1618 con l'opera di Monteverdi Orfeo", "Costruito per Carlo III di Borbone, inaugurato nel 1748 con la prima opera buffa italiana"], c: 0, sp: "Il Teatro Farnese fu costruito per la visita di Cosimo II de' Medici ma inaugurato solo nel 1628 per le nozze di Margherita de' Medici e il duca Odoardo, con l'opera Mercurio e Marte e una spettacolare naumachia finale." },
                { d: "Gli affreschi di Correggio con l'Assunzione della Vergine si trovano nella cupola del Duomo di Parma (PR). In quale anno furono completati?", r: ["Tra il 1526 e il 1530, capolavoro del manierismo per l'effetto di sfondamento prospettico", "Tra il 1515 e il 1520, prima opera monumentale di Correggio a Parma", "Tra il 1535 e il 1540, completati dopo la morte di Correggio dalla sua bottega"], c: 0, sp: "Gli affreschi di Correggio con l'Assunzione della Vergine nella cupola del Duomo di Parma (PR) furono realizzati tra il 1526 e il 1530; sono un capolavoro del manierismo per l'effetto di sfondamento prospettico." },
                { d: "Il Mausoleo di Galla Placidia si trova a Ravenna (RA) ed è il più antico degli otto edifici paleocristiani UNESCO. Quale caratteristica ha il ciclo musivo nella cupola?", r: ["Fondo blu con stelle dorate nella cupola a croce latina; Galla Placidia lo fece costruire post 426 d.C.", "Fondo oro con scene della Passione di Cristo; edificato nel V sec. per papa Leone I", "Fondo verde con pavoni e agnelli simbolici; costruito nel IV sec. da Costantino II"], c: 0, sp: "Il Mausoleo di Galla Placidia a Ravenna (RA), il più antico degli otto siti UNESCO (post 426 d.C.), presenta cicli musivi con fondo blu e stelle dorate nella cupola; la pianta è a croce latina." },
                { d: "Il Palazzo dei Diamanti si trova a Ferrara (FE) ed è il simbolo dell'Addizione Erculea. Di quanti blocchi marmorei è composta la sua facciata?", r: ["Di 8.500 blocchi di marmo bicromi a punta di diamante", "Di 12.000 blocchi di marmo bianco di Carrara tagliati a punta", "Di 6.000 blocchi di pietra d'Istria alternati a marmo rosa di Verona"], c: 0, sp: "Il Palazzo dei Diamanti a Ferrara (FE), simbolo dell'Addizione Erculea voluta da Ercole I d'Este (1492), ha la facciata composta da 8.500 blocchi di marmo bicromi a punta di diamante." },

        sp: "L'isola di Murano è celebre in tutto il mondo per la produzione artigianale del vetro soffiato, un'arte che vi fu trasferita da Venezia nel 1291 per decreto della Serenissima."},
    {
        d: "Per quale tradizionale attività artigianale è conosciuta l'isola di Burano, nella Laguna di Venezia?",
        r: ["La lavorazione del merletto ad ago", "La produzione del vetro soffiato", "La costruzione di strumenti musicali"],
        c: 0,
        sp: "L'isola di Burano è famosa in tutto il mondo per la secolare tradizione della lavorazione artigianale del merletto ad ago, oltre che per le sue caratteristiche case vivacemente colorate."},
    {
        d: "Secondo la tradizione popolare, perché le case dell'isola di Burano sono dipinte con colori vivaci e diversi l'una dall'altra?",
        r: ["Per permettere ai pescatori di riconoscerle da lontano nei giorni di nebbia", "Per celebrare la festa del Redentore con decorazioni permanenti", "Per indicare la professione degli abitanti di ciascuna casa"],
        c: 0,
        sp: "Secondo la tradizione, le case di Burano sono dipinte con colori vivaci per permettere ai pescatori di riconoscere le loro abitazioni anche da lontano, specialmente nelle giornate di nebbia."},
    {
        d: "Qual è l'antica cattedrale dell'isola di Torcello, considerata uno degli esempi più antichi e meglio conservati di arte bizantina nella Laguna di Venezia?",
        r: ["La Basilica di Santa Maria Assunta", "La Chiesa di Santa Fosca", "La Basilica di San Marco"],
        c: 0,
        sp: "La Basilica di Santa Maria Assunta è l'antica cattedrale dell'isola di Torcello e rappresenta uno degli esempi più antichi e meglio conservati di arte veneto-bizantina nella Laguna di Venezia."},
    {
        d: "Quali sono i quattro torrioni angolari del Castello Estense di Ferrara?",
        r: ["Torre dei Leoni, Marchesana, San Paolo, Santa Caterina", "Torre dell'Orologio, Marchesana, San Paolo, Santa Caterina", "Torre dei Leoni, Marchesana, San Giorgio, Santa Caterina"],
        c: 0,
        sp: "Il Castello Estense di Ferrara presenta quattro imponenti torrioni angolari: la Torre dei Leoni (la più antica), la Marchesana, la Torre di San Paolo e la Torre di Santa Caterina."},
    {
        d: "Quale scena è raffigurata nel mosaico absidale della Basilica di Sant'Apollinare in Classe a Ravenna?",
        r: ["Sant'Apollinare in preghiera tra pecore e la Trasfigurazione di Cristo", "La Teoria dei Santi e delle Vergini", "Cristo in trono tra angeli e santi"],
        c: 0,
        sp: "Il mosaico absidale di Sant'Apollinare in Classe a Ravenna raffigura Sant'Apollinare in posizione orante, circondato da pecore, sotto la rappresentazione della Trasfigurazione di Cristo."},
    {
        d: "Quali soggetti sono raffigurati sulle formelle dello Zooforo del Battistero di Parma?",
        r: ["Animali fantastici e reali come centauri, sirene, grifoni, cani e uccelli", "Storie dell'Antico e Nuovo Testamento", "Allegorie dei vizi e delle virtù"],
        c: 0,
        sp: "Le 75 formelle dello Zooforo del Battistero di Parma raffigurano un bestiario fantastico con mostri infernali e marini, centauri, sirene, liocorni, basilischi, grifoni e vari animali reali."},
                // PUGLIA (9)
                { d: "Castel del Monte in Puglia fu costruito da Federico II di Svevia intorno al 1240. Quale numero si ripete ossessivamente nella struttura?", r: ["Il numero otto: pianta ottagonale, otto torri ottagonali, otto sale per piano", "Il numero sette: sette torri, sette sale, sette finestre per lato", "Il numero dodici: dodici torri, dodici sale, dodici colonne nel cortile"], c: 0, sp: "Castel del Monte è basato sulla ricorrenza del numero otto: pianta ottagonale, otto torri ottagonali agli spigoli, cortile ottagonale, otto sale al piano terra e otto al piano superiore." },
                { d: "La Basilica di San Nicola a Bari fu avviata l'8 luglio 1087. Da dove provenivano le reliquie di San Nicola?", r: ["Dalla città di Myra in Licia (odierna Turchia), trafugate da 62 marinai baresi", "Da Costantinopoli, donate dall'imperatore bizantino Basilio II ai baresi", "Da Alessandria d'Egitto, portate dai crociati di ritorno dalla Prima Crociata"], c: 0, sp: "Le reliquie di San Nicola furono trafugate dalla città di Myra in Licia (odierna Turchia) da 62 marinai baresi e giunsero a Bari il 9 maggio 1087." },
                { d: "La Cattedrale di Trani è considerata la 'regina delle cattedrali pugliesi'. Quale è la sua caratteristica unica rispetto alle altre cattedrali romaniche italiane?", r: ["È l'unica grande cattedrale romanica italiana che si affaccia direttamente sul mare", "È l'unica cattedrale pugliese costruita interamente in marmo bianco di Carrara", "È l'unica cattedrale con tre livelli sovrapposti di cui uno completamente sottomarino"], c: 0, sp: "La Cattedrale di Trani è l'unica grande cattedrale romanica italiana che si affaccia direttamente sul mare, sorta su una costa rocciosa in piena città vecchia." },
                { d: "I Trulli di Alberobello sono Patrimonio UNESCO dal 1996. Quale è la caratteristica costruttiva del tetto del trullo?", r: ["Doppio strato: volta interna conica in chiave di pietra e cono esterno di lastre calcaree sovrapposte a sbalzo", "Struttura in muratura a sacco con malta e riempimento di pietrisco", "Copertura a cupola in mattoni cotti con nervature in pietra calcarea"], c: 0, sp: "Il tetto del trullo è a doppio strato: volta interna conica in chiave di pietra, e cono esterno impermeabile di lastre calcaree (chianche) sovrapposte a sbalzo, culminante in un pinnacolo decorativo." },
                { d: "Il Santuario di San Michele Arcangelo a Monte Sant'Angelo è il più antico santuario cristiano d'Occidente dedicato all'Arcangelo. Quale popolo lo elesse a santuario nazionale nel VII sec.?", r: ["I Longobardi, che eleggono Michele arcangelo a proprio patrono dopo la conquista del Gargano", "I Normanni, che lo trasformarono nel principale santuario del loro regno nel Meridione", "Gli Angioini, che lo finanziarono come simbolo della loro legittimità nel regno di Napoli"], c: 0, sp: "Dalla conquista longobarda del Gargano (VII sec.), il santuario divenne il santuario nazionale del popolo longobardo, che elesse Michele arcangelo a proprio patrono." },
                { d: "La Basilica di Santa Croce a Lecce è il capolavoro del barocco leccese. Quanti architetti si successero nella sua costruzione?", r: ["Tre architetti leccesi: Gabriele Riccardi, Francesco Antonio Zimbalo e Cesare Penna (1549-1699)", "Cinque architetti tra cui Bernini e Borromini su commissione dei Celestini", "Due architetti: Zimbalo per la facciata e Riccardi per l'interno (1600-1680)"], c: 0, sp: "La basilica fu costruita dal 1549 al 1699 con il contributo di tre architetti leccesi: Gabriele Riccardi (ordine inferiore), Francesco Antonio Zimbalo (portali) e Cesare Penna (ordine superiore e rosone)." },
                { d: "Il MArTA di Taranto conserva gli Ori di Taranto. A quale periodo risalgono questi gioielli?", r: ["Al IV-I sec. a.C., massima espressione dell'oreficeria ellenistica tarantina e della Magna Grecia", "Al VI-V sec. a.C., periodo arcaico della colonia spartana di Taras", "All'età imperiale romana, I-III sec. d.C., provenienti dalla villa del governatore romano"], c: 0, sp: "Gli Ori di Taranto sono straordinari gioielli in oro del IV-I sec. a.C., massima espressione dell'oreficeria ellenistica tarantina; provengono dai corredi funerari della necropoli." },
                { d: "La Cattedra episcopale della Basilica di San Nicola a Bari (BA) è considerata un capolavoro della scultura romanica pugliese. A quale periodo risale?", r: ["Alla fine dell'XI sec., in marmo, con telamoni in altorilievo e leonesse scolpite sul dorso", "Al XIII sec., in marmo di Carrara, opera attribuita a Nicola Pisano durante il suo soggiorno pugliese", "Al XII sec., in pietra calcarea locale, con scene della vita di San Nicola nei pannelli laterali"], c: 0, sp: "La Cattedra episcopale della Basilica di San Nicola a Bari (BA) risale alla fine dell'XI sec.; è in marmo con telamoni in altorilievo e leonesse scolpite sul dorso, capolavoro della scultura romanica pugliese." },
                { d: "Il Santuario di San Pio da Pietrelcina a San Giovanni Rotondo (FG) include una nuova chiesa progettata da Renzo Piano. Quanti posti ha?", r: ["6.500 posti con copertura a lamelle di pietra di Apricena che filtra la luce, inaugurata nel 2004", "10.000 posti con cupola in acciaio e vetro, inaugurata nel 2002 per la canonizzazione", "4.000 posti con struttura in calcestruzzo armato a pianta ellittica, inaugurata nel 1999"], c: 0, sp: "La Nuova Chiesa di San Pio a San Giovanni Rotondo (FG), progettata da Renzo Piano (inaugurata nel 2004), ha capacità di 6.500 posti con innovativa copertura a lamelle di pietra di Apricena che filtra la luce." },
                // SARDEGNA (6)
                { d: "I Giganti di Monte Prama sono la più importante scoperta archeologica del Mediterraneo del XX sec. Quante tipologie di statue sono state identificate?", r: ["Tre: pugilatori, arcieri e guerrieri, alte tra 2 e 2,5 m", "Due: guerrieri con scudo e sacerdoti con tirso, alte circa 3 m", "Quattro: re, guerrieri, sacerdoti e musicanti, alte tra 1,5 e 2 m"], c: 0, sp: "I Giganti di Monte Prama (circa 950-730 a.C.) rappresentano tre tipologie: pugilatori (con guanto armato e scudo sopra la testa), arcieri e guerrieri, tutti alti tra 2 e 2,5 m." },
                { d: "Il Tempio a pozzo di Santa Cristina a Paulilatino presenta un particolare fenomeno astronomico. Quale?", r: ["Al solstizio d'estate e agli equinozi il sole illumina perfettamente la superficie dell'acqua attraverso il lucernaio", "Nella notte del solstizio invernale la luna piena si riflette nella camera del pozzo", "All'alba dell'equinozio di primavera la luce attraversa il dromos e illumina l'altare"], c: 0, sp: "Il pozzo di Santa Cristina ha un preciso orientamento astronomico: al solstizio d'estate e agli equinozi il sole illumina perfettamente la superficie dell'acqua attraverso il lucernaio dell'atrio." },
                { d: "Il Museo di Cabras (OR) conserva i Giganti di Monte Prama. In quale anno avvenne la scoperta casuale?", r: ["Nel marzo 1974, quando un contadino che arava un campo portò alla luce frammenti di statue", "Nel 1968, durante lavori di bonifica agricola nella penisola del Sinis", "Nel 1980, durante una campagna di ricognizione aerea dell'Università di Sassari"], c: 0, sp: "La scoperta dei Giganti di Monte Prama, conservati al Museo di Cabras (OR), avvenne nel marzo 1974 quando un contadino che arava un campo portò alla luce i primi frammenti di queste statue colossali." },
                // UMBRIA (6)
                { d: "La Basilica di San Francesco ad Assisi è composta da due chiese sovrapposte. Dove si trovano i resti mortali di San Francesco?", r: ["Nella cripta della Chiesa Inferiore, in un sarcofago ritrovato nel 1818", "Nell'altare maggiore della Chiesa Superiore in un'urna dorata", "Nella Cappella della Maddalena, celato dietro un affresco di Giotto"], c: 0, sp: "I resti di San Francesco si trovano nella cripta della Chiesa Inferiore in un sarcofago di pietra, ritrovato nel 1818 dopo essere stato mantenuto segreto dal XIII sec. per timore di trafugamento." },
                { d: "Il Duomo di Orvieto fu avviato nel 1290. A quale miracolo eucaristico è legata la sua fondazione?", r: ["Al miracolo di Bolsena del 1263, quando l'ostia consacrata sanguinò sul corporale", "Al miracolo di Orvieto del 1290, quando una statua della Vergine si illuminò spontaneamente", "Al miracolo di Bolsena del 1264, quando papa Urbano IV vide una visione di Cristo"], c: 0, sp: "Il Duomo fu avviato per custodire il Corporale di Bolsena: nel 1263, durante la Messa del sacerdote Pietro da Praag, l'ostia consacrata sanguinò sul corporale, evento che spinse a istituire il Corpus Domini." },
                { d: "Le Cascate delle Marmore sono un'opera di ingegneria idraulica romana. Chi le creò e in quale anno?", r: ["Il console Manio Curio Dentato nel 271 a.C., per far defluire le acque stagnanti del Velino nella piana reatina verso il fiume Nera", "Il censore Appio Claudio Cieco nel 312 a.C., contestualmente alla costruzione della Via Appia", "L'ingegnere Antonio da Sangallo il Giovane nel 1400, per ordine del Comune di Terni"], c: 0, sp: "Le Cascate delle Marmore furono create dal console romano Manio Curio Dentato nel 271 a.C. scavando la Cava Curiana per far defluire le acque stagnanti del Velino verso il precipizio naturale e quindi nel Nera." },
                { d: "Il Reliquiario del Corporale di Bolsena si trova nel Duomo di Orvieto (TR). Chi lo realizzò e in quale anno?", r: ["L'orafo Ugolino di Vieri nel 1338, con 32 smalti traslucidi raffiguranti la storia del miracolo", "Lorenzo Maitani nel 1320, contestualmente ai rilievi dei pilastri della facciata", "Andrea Pisano nel 1330, su commissione di papa Benedetto XII"], c: 0, sp: "Il Reliquiario del Corporale (1338) nel Duomo di Orvieto (TR) è opera dell'orafo Ugolino di Vieri; è detto 'arca del Corporale' e presenta 32 smalti traslucidi raffiguranti la storia del miracolo eucaristico di Bolsena." },
                { d: "La Fontana Maggiore di Perugia (PG) si trova in Piazza IV Novembre davanti alla Cattedrale di San Lorenzo. Chi la realizzò?", r: ["Nicola Pisano e Giovanni Pisano con la collaborazione di fra' Bevignate (1275-78)", "Arnolfo di Cambio su commissione del Comune di Perugia nel 1280", "Giovanni Pisano da solo, dopo la morte del padre Nicola, tra il 1278 e il 1285"], c: 0, sp: "La Fontana Maggiore di Perugia (PG), capolavoro della scultura medievale perugina, fu realizzata da Nicola Pisano e Giovanni Pisano con la collaborazione di fra' Bevignate tra il 1275 e il 1278." },
                // FRIULI-VENEZIA GIULIA (6)
                { d: "Il Tempietto Longobardo di Cividale del Friuli conserva figure in stucco di grande importanza. Cosa raffigurano le sei figure monumentali sulla parete d'ingresso?", r: ["Sei Sante in altorilievo di stucco in stile che fonde modelli classici, longobardi e bizantini", "Sei Arcangeli con simboli liturgici in stile romano-carolingio puro", "Sei Apostoli con codici in mano in stile paleocristiano tardo-antico"], c: 0, sp: "La parete d'ingresso (ovest) del Tempietto Longobardo conserva sei figure monumentali di Sante in altorilievo di stucco, databili al 760-770 circa, in stile che fonde modelli classici, longobardi e bizantini." },
                { d: "Il Castello di Miramare a Trieste fu costruito per Ferdinando Massimiliano d'Asburgo. Quale destino toccò a Massimiliano?", r: ["Fu fucilato in Messico il 19 giugno 1867 dopo aver accettato la corona di imperatore del Messico", "Morì in esilio a Madeira nel 1871 dopo la sconfitta nella guerra austro-prussiana", "Fu deposto dall'imperatore Francesco Giuseppe e confinato nel castello fino alla morte nel 1875"], c: 0, sp: "Massimiliano d'Asburgo accettò nel 1864 la corona di imperatore del Messico; fu fucilato il 19 giugno 1867. Il castello fu completato nel 1860, prima della sua morte." },
                { d: "La Basilica Patriarcale di Aquileia conserva il più esteso mosaico paleocristiano del mondo occidentale. Quale superficie copre?", r: ["760 mq nell'aula meridionale, con scene della storia di Giona e animali simbolici, databili al 313-319 d.C.", "540 mq nella cripta, con la storia della Salvezza dall'Antico al Nuovo Testamento", "1.200 mq nell'intera navata, il più grande mosaico del mondo antico dopo Ravenna"], c: 0, sp: "La prima basilica di Aquileia (costruita dal vescovo Teodoro ante 319 d.C.) conserva mosaici pavimentali di 760 mq nell'aula meridionale, il più esteso mosaico paleocristiano del mondo occidentale, con la storia di Giona." },
                { d: "Il Sacrario Militare di Redipuglia è noto come 'Sacrario dei Centomila'. Quanti caduti identificati sono tumulati sui 22 gradoni?", r: ["39.857 caduti identificati in ordine alfabetico, ognuno con la scritta 'Presente'", "60.000 caduti identificati e oltre 40.000 ignoti nelle tombe comuni in cima", "100.187 caduti totali tutti identificati e tumulati in ordine alfabetico"], c: 0, sp: "Sui 22 gradoni del Sacrario sono tumulati in ordine alfabetico 39.857 caduti identificati, ognuno con la scritta 'Presente'; in cima due grandi tombe comuni accolgono oltre 60.000 caduti ignoti." },
                { d: "L'Altare di Ratchis si trova nel Museo Cristiano (MUCRIS) di Cividale del Friuli (UD). In quale anno fu realizzato e da chi fu commissionato?", r: ["Tra il 737 e il 744, voluto dal duca Ratchis in onore del padre Pemmone, con rilievi di Cristo in trono tra cherubini", "Nell'VIII sec., commissionato dal re longobardo Astolfo come ex voto dopo la vittoria sui Franchi", "Nel IX sec., opera carolingia voluta da Carlo Magno durante la sua visita al ducato del Friuli"], c: 0, sp: "L'Altare di Ratchis nel Museo Cristiano di Cividale del Friuli (UD) fu realizzato tra il 737 e il 744 per volontà del duca Ratchis in onore del padre Pemmone; i rilievi raffigurano Cristo in trono tra cherubini, la Visitazione e l'Adorazione dei Magi." },
                { d: "Il Castello di Miramare si trova sul promontorio di Grignano a Trieste (TS). In quale materiale è costruito l'edificio?", r: ["In pietra d'Istria bianca, con stile eclettico che fonde gotico, medievale e rinascimentale", "In marmo istriano grigio con stile neoclassico tipico dell'architettura asburgica", "In pietra calcarea locale con rivestimento in stucco bianco tipico dello stile Biedermeier"], c: 0, sp: "Il Castello di Miramare a Trieste (TS) è realizzato in pietra d'Istria bianca con stile eclettico che fonde gotico, medievale e rinascimentale, tipico della moda architettonica ottocentesca mitteleuropea." },
                // PIEMONTE (10)
                { d: "La Mole Antonelliana di Torino fu progettata da Alessandro Antonelli. Per quale committente fu originariamente concepita?", r: ["Per la Comunità Israelitica torinese, che intendeva costruire una sinagoga", "Per il Comune di Torino come monumento all'Unità d'Italia", "Per la Casa Reale dei Savoia come torre panoramica sul Palazzo Reale"], c: 0, sp: "La Mole fu progettata da Antonelli a partire dal 1862-63 su commissione della Comunità Israelitica torinese come sinagoga in segno di gratitudine per lo Statuto Albertino." },
                { d: "La Sacra di San Michele sorge sul Monte Pirchiriano in Val di Susa. Quale percorso di pellegrinaggio internazionale attraversa questo sito?", r: ["La via da Mont Saint-Michel in Francia a Monte Sant'Angelo in Puglia, dedicata all'Arcangelo Michele", "Il Cammino di Santiago da Torino a Compostela attraverso le Alpi occidentali", "La Via Francigena da Canterbury a Roma con tappa in Val di Susa"], c: 0, sp: "La Sacra di San Michele si colloca sulla via di pellegrinaggio che da Mont Saint-Michel (Francia) conduce a Monte Sant'Angelo (Puglia), percorso di oltre 2.000 km dedicato all'Arcangelo Michele." },
                { d: "Il Museo Egizio di Torino è il secondo museo egizio al mondo. Chi acquistò la collezione Drovetti che ne costituì il nucleo fondamentale?", r: ["Carlo Felice di Savoia nel 1824, per 5.628 reperti tra statue, papiri e sarcofagi", "Carlo Emanuele III nel 1753, tramite la spedizione del naturalista Vitaliano Donati", "Carlo Alberto nel 1831, contemporaneamente alla fondazione della Biblioteca Reale"], c: 0, sp: "Nel 1824 Carlo Felice di Savoia acquistò la collezione del console generale francese Bernardino Drovetti (5.628 reperti), primo grande nucleo del primo museo egizio del mondo." },
                { d: "La Reggia di Venaria Reale è Patrimonio UNESCO dal 1997. Chi fu l'architetto che la trasformò in capolavoro barocco nella prima metà del Settecento?", r: ["Filippo Juvarra, che realizzò la Grande Galleria, la Cappella di Sant'Uberto e le Scuderie Juvarriane", "Guarino Guarini, che progettò la cappella principale e i giardini formali", "Amedeo di Castellamonte, che concepì il progetto originario per Carlo Emanuele II nel 1658"], c: 0, sp: "Vittorio Amedeo II chiamò Filippo Juvarra, che trasformò la Venaria in capolavoro assoluto realizzando la Grande Galleria, la Cappella di Sant'Uberto, la Citroniera e le Scuderie Juvarriane." },
                { d: "I Paesaggi Vitivinicoli del Piemonte: Langhe-Roero e Monferrato sono Patrimonio UNESCO dal 2014. Quante componenti compongono questo sito seriale?", r: ["Sei componenti tra cui La Langa del Barolo, Le Colline del Barbaresco e il Monferrato degli Infernot", "Quattro componenti legate ai principali vini DOCG: Barolo, Barbaresco, Barbera e Moscato", "Tre componenti: le Langhe, il Roero e il Monferrato come entità geografiche distinte"], c: 0, sp: "Il sito seriale è articolato in sei componenti: La Langa del Barolo, Le Colline del Barbaresco, Nizza Monferrato e il Barbera, Canelli e l'Asti Spumante, il Monferrato degli Infernot e il Castello di Grinzane Cavour." },
                { d: "I Musei Reali di Torino comprendono la Cappella della Sacra Sindone. Chi ne fu il progettista?", r: ["Guarino Guarini nella seconda metà del XVII sec. (costruzione 1668-1694)", "Filippo Juvarra, che la costruì contestualmente alla Venaria Reale nel primo Settecento", "Benedetto Alfieri, che la progettò per Carlo Emanuele III nel 1739"], c: 0, sp: "La Cappella della Sacra Sindone è un capolavoro del barocco italiano progettato da Guarino Guarini nella seconda metà del XVII sec. (costruzione 1668-1694); un incendio nel 1997 la danneggiò gravemente." },
                { d: "La Sacra di San Michele si trova sul Monte Pirchiriano a Sant'Ambrogio di Torino (TO). Quale elemento architettonico segna l'ingresso al percorso di visita?", r: ["Lo Scalone dei Morti, che conduce alla Porta dello Zodiaco (XII sec.) con rilievi dei segni zodiacali opera di maestro Niccolò", "Il Portale degli Angeli con figure in bronzo dorato dell'VIII sec. longobardo", "La Porta Ferrata con i battenti originali in ferro battuto del XI sec. normanno"], c: 0, sp: "Il percorso di visita della Sacra di San Michele a Sant'Ambrogio di Torino (TO) inizia con lo Scalone dei Morti che conduce alla Porta dello Zodiaco (XII sec.) con stipiti decorati da rilievi dei segni zodiacali, opera di maestro Niccolò." },
                { d: "Il Tempio di Ellesija è conservato nel Museo Egizio di Torino (TO). Da quale faraone fu fatto scavare e in quale paese era originariamente?", r: ["Da Thutmosi III intorno al 1430 a.C. in Nubia; dedicato a Horus di Miam, alla dea Satet e allo stesso faraone", "Da Ramses II intorno al 1270 a.C. in Nubia; dedicato ad Amon-Ra e alla dea Hathor", "Da Amenofi III intorno al 1380 a.C. in Egitto; dedicato ad Aton e alla consorte reale Nefertiti"], c: 0, sp: "Il Tempio di Ellesija al Museo Egizio di Torino (TO) fu fatto scavare da Thutmosi III intorno al 1430 a.C. in Nubia; dedicato a Horus di Miam, alla dea Satet e allo stesso faraone; donato dall'Egitto all'Italia nel 1966, ricostruito in 66 blocchi di arenaria." },
                { d: "L'Arco di Augusto si trova a Susa (TO) in Piemonte-Val di Susa. A chi fu dedicato e in quale anno?", r: ["Al re Cozio in onore dell'imperatore Augusto, intorno all'8 a.C., con iscrizione del foedus tra Cottius e Augusto", "All'imperatore Traiano nel 113 d.C. per celebrare la vittoria sui Daci", "All'imperatore Costantino nel 315 d.C. dopo la vittoria su Massenzio a Ponte Milvio"], c: 0, sp: "L'Arco di Augusto a Susa (TO), datato intorno all'8 a.C., fu dedicato dal re Cozio in onore dell'imperatore Augusto; l'iscrizione sull'attico documenta il foedus tra Cottius e Augusto; è uno dei più antichi e meglio conservati archi romani del nord Italia." },
                { d: "La Fontana del Nettuno si trova in Piazza Duomo a Trento (TN). Dove è conservato l'originale in pietra?", r: ["Nel cortile del Palazzo Thun a Trento (TN); in piazza si trova la copia in bronzo del XVIII sec.", "Al Museo Diocesano Tridentino nel Palazzo Pretorio a Trento (TN)", "Nella cripta della Cattedrale di San Vigilio a Trento (TN) per motivi conservativi"], c: 0, sp: "La statua originale in pietra della Fontana del Nettuno di Piazza Duomo a Trento (TN), opera dello scultore Stefano Salterio, è custodita nel cortile del Palazzo Thun; in piazza si trova la versione in bronzo." },
                ,  {
        d: "La tomba di Kha e Merit, conservata al Museo Egizio di Torino, fu scoperta intatta nel 1906. Chi era il direttore del museo che condusse gli scavi?",
        r: ["Ernesto Schiaparelli", "Bernardino Drovetti", "Silvio Curto"],
        c: 0,
        sp: "La tomba fu scoperta intatta nel 1906 dall'allora direttore del Museo Egizio, Ernesto Schiaparelli, e gran parte del corredo fu trasferito al Museo, dove è tuttora conservato. [reference:0]"
    },
    {
        d: "Quale importante oggetto, parte del corredo di Kha e solitamente conservato al Louvre, è stato eccezionalmente prestato al Museo Egizio di Torino?",
        r: ["Il pyramidion di Kha, la cuspide della sua cappella funeraria", "La maschera funeraria in oro massiccio di Kha", "Il trono cerimoniale in legno e avorio di Kha"],
        c: 0,
        sp: "In occasione dei 120 anni dalla scoperta della tomba, il pyramidion di Kha, oggi conservato al Musée du Louvre, è arrivato a Torino per essere esposto insieme al resto del corredo. [reference:1]"
    },
    {
        d: "Qual era la professione di Kha, il proprietario della celebre tomba esposta al Museo Egizio?",
        r: ["Era il 'direttore dei lavori', ovvero il responsabile della progettazione e costruzione delle tombe reali", "Era un alto sacerdote del tempio di Amon a Karnak", "Era uno scriba reale e consigliere personale del faraone"],

        sp: "Kha aveva il titolo di 'direttore dei lavori', ovvero era il responsabile della progettazione e della costruzione delle tombe reali. Tra i suoi datori di lavoro vi furono i faraoni Thutmose III e Amenhotep II. [reference:2]"
    },
    {
        d: "Il Libro dei Morti di Merit, parte del corredo funerario, è un papiro eccezionalmente lungo. Qual è la sua lunghezza approssimativa?",
        r: ["Circa 14 metri", "Circa 7 metri", "Circa 2 metri"],
        c: 0,
        sp: "Il Libro dei Morti di Merit è un papiro lungo circa 14 metri. Per la sua conservazione, viene custodito in una teca con gas inerte che crea un ambiente senza ossigeno. [reference:3]"
    },
    {
        d: "Il Tempio di Ellesija, conservato al Museo Egizio, fu donato all'Italia dall'Egitto. Per quale motivo?",
        r: ["Come ringraziamento per il contributo italiano alla campagna UNESCO per il salvataggio dei templi della Nubia", "Come parte degli accordi per la restituzione di reperti egizi trafugati durante il periodo coloniale", "In seguito a uno scambio culturale con il Museo del Cairo"],
        c: 0,
        sp: "A seguito della costruzione della diga di Assuan, l'Italia e il Museo Egizio contribuirono alla campagna UNESCO per il salvataggio dei templi della Nubia. Il governo egiziano donò il tempio all'Italia in segno di gratitudine. [reference:4]"
    },
    {
        d: "Quale faraone fece scavare nella roccia il Tempio di Ellesija, il più antico tempio rupestre della Nubia?",
        r: ["Thutmose III", "Ramesse II", "Amenhotep II"],
        c: 0,
        sp: "Il tempio rupestre di Ellesija fu fatto scavare dal faraone Thutmose III intorno al 1430 a.C. ed era dedicato a Horus di Miam, alla dea Satet e allo stesso sovrano. [reference:5]"
    },
    {
        d: "Da dove provengono le statue monumentali esposte nella Galleria dei Re del Museo Egizio di Torino?",
        r: ["Dall'antica città di Tebe, in particolare dal tempio di Karnak", "Dalla necropoli di Giza, presso le grandi piramidi", "Dalla città sacra di Eliopoli, oggi sobborgo del Cairo"],
        c: 0,
        sp: "La Galleria dei Re ospita una collezione di statue colossali provenienti dall'antica città di Tebe, oggi conosciuta come Luxor, in particolare dal complesso templare di Karnak. [reference:6]"
    },
    {
        d: "Quale innovativo concetto ha guidato il riallestimento della nuova Galleria dei Re, inaugurata nel 2024?",
        r: ["Una transizione graduale dall'oscurità alla luce, simbolo della creazione nell'antico Egitto", "Una disposizione rigorosamente cronologica basata sulle dinastie dei faraoni", "Un'ambientazione ispirata alle tombe della Valle dei Re"],
        c: 0,
        sp: "La nuova Galleria dei Re propone un percorso che va dall'oscurità alla luce, un simbolo di creazione associato nell'antico Egitto a re e divinità. [reference:7]"
    },
    {
        d: "Cosa sono le Gallerie della Cultura Materiale del Museo Egizio di Torino?",
        r: ["Depositi visitabili che espongono circa 12.000 reperti ordinati per tipologia, materiale e funzione", "Una sezione dedicata esclusivamente alla statuaria di epoca tolemaica", "Una mostra temporanea di reperti provenienti da altri musei europei"],
        c: 0,
        sp: "Le Gallerie della Cultura Materiale sono veri e propri depositi visitabili che espongono una rassegna di manufatti ordinati per tipologie in base al materiale, alla forma e alla funzione. Ospitano circa 12.000 reperti. [reference:8][reference:9]"
    },
    {
        d: "A quale periodo storico risalgono principalmente i sarcofagi esposti nella Galleria dei Sarcofagi del Museo Egizio di Torino?",
        r: ["Terzo Periodo Intermedio ed Epoca Tarda (1100 – 600 a.C.)", "Antico Regno (2700 – 2200 a.C.)", "Epoca Tolemaica e Romana (300 a.C. – 300 d.C.)"],
        c: 0,
        sp: "La Galleria dei Sarcofagi ospita alcuni fra i più bei sarcofagi del Terzo Periodo Intermedio e dell'Epoca Tarda, databili tra il 1100 e il 600 a.C. [reference:10]"
    },
    {
        d: "Quale architetto è il principale artefice del progetto della Cappella della Sacra Sindone a Torino, noto per la sua ardita cupola?",
        r: ["Guarino Guarini", "Filippo Juvarra", "Ascanio Vitozzi"],
        c: 0,
        sp: "La costruzione della Cappella della Sindone ricevette un impulso determinante con l'arrivo dell'architetto Guarino Guarini, padre teatino e insigne matematico, che concepì la spettacolare cupola. [reference:11]"

    {

        c: 0,
        sp: "Nella notte tra l'11 e il 12 aprile 1997, un vasto incendio divampò nella Cappella della Sindone, che fu poi oggetto di un complesso intervento di restauro conclusosi con la riapertura nel 2018. [reference:12]"
    },
    {

        c: 0,

    },
    {

        sp: "La Galleria Sabauda fu istituita dal re Carlo Alberto il 2 ottobre 1832, proprio nel giorno del suo compleanno. [reference:14]"

    {

    {

    {

        c: 0,
        sp: "Il Canone Reale, conosciuto come Papiro di Torino, è una delle più importanti fonti sulla sequenza dei sovrani egizi ed è conservato al Museo Egizio. [reference:20]"
    },
    {
        d: "Qual è il titolo e il ruolo di colui che ha curato il progetto scientifico del nuovo allestimento del Museo Egizio di Torino?",
        r: ["Christian Greco, Direttore del Museo Egizio", "Evelina Christillin, Presidente della Fondazione Museo delle Antichità Egizie", "Dante Ferretti, Scenografo e curatore dell'allestimento"],
        c: 0,
        sp: "Il progetto scientifico del rinnovato Museo Egizio è stato realizzato dal Direttore Christian Greco e dagli otto curatori. [reference:21]"
    },
                // MARCHE (5)
                { d: "Il Palazzo Ducale di Urbino è sede della Galleria Nazionale delle Marche. Quale opera di Piero della Francesca di piccole dimensioni vi è conservata?", r: ["La Flagellazione di Cristo (1458-60 ca., 58,4 x 81,5 cm, tavola)", "La Madonna di Senigallia (circa 70 x 53 cm, tavola)", "La Veduta della Città Ideale (circa 60 x 200 cm, tavola)"], c: 0, sp: "La Flagellazione di Cristo di Piero della Francesca (1458-1460 ca., 58,4 x 81,5 cm, tavola) è conservata nella Galleria Nazionale delle Marche del Palazzo Ducale di Urbino." },
                { d: "La Rocca di Gradara è legata alla leggenda di Paolo e Francesca. In quale opera letteraria è immortalato questo episodio?", r: ["Nel V canto dell'Inferno di Dante (c. 1307)", "Nel Decameron di Boccaccio, quarta giornata, novella quinta", "Nella Gerusalemme Liberata di Torquato Tasso, canto XII"], c: 0, sp: "L'episodio di Paolo e Francesca (uccisi da Gianciotto Malatesta sorprendendo i due amanti) è immortalato nel V canto dell'Inferno di Dante (c. 1307)." },
                { d: "Il Santuario di Loreto è uno dei principali luoghi di pellegrinaggio cattolico. Cosa custodisce secondo la tradizione?", r: ["La Santa Casa, piccola struttura in mattoni identificata come la casa di Nazaret dove la Vergine ricevette l'Annunciazione", "La reliquia del Sacro Legno della Croce portata dalla Terra Santa durante la Prima Crociata", "Il corpo incorrotto della Madonna, secondo una tradizione locale della Marca medievale"], c: 0, sp: "Il Santuario di Loreto fu edificato intorno alla Santa Casa, piccola struttura in mattoni che la tradizione identifica come la casa di Nazaret dove la Vergine Maria ricevette l'Annunciazione e dove visse Gesù." },
                { d: "Il Centro storico di Ascoli Piceno (AP) è costruito quasi interamente in un materiale caratteristico. Quale?", r: ["In travertino locale bianco e compatto che conferisce l'inconfondibile fisionomia monumentale alla città", "In pietra arenaria rosa estratta dai Monti Sibillini nelle cave storiche della Marca", "In mattoni cotti di produzione locale con rivestimenti in calcare bianco delle facciate principali"], c: 0, sp: "Il centro storico di Ascoli Piceno (AP) è costruito quasi interamente in travertino locale (bianco, compatto, caratteristico) che le conferisce un'inconfondibile fisionomia monumentale; la piazza del Popolo è considerata una delle più belle d'Italia." },
                // CALABRIA (7)
                { d: "Il Parco Archeologico di Sibari sovrappone i resti di tre città storiche. Quali sono nell'ordine cronologico corretto?", r: ["Sybaris (720 a.C.), Thurii (444-443 a.C.) e Copia (193 a.C.)", "Sybaris (800 a.C.), Metapontum (600 a.C.) e Copia (200 a.C.)", "Kroton (700 a.C.), Thurii (450 a.C.) e Vibo Valentia (100 a.C.)"], c: 0, sp: "Il sito di Sibari sovrappone tre città: Sybaris (fondata intorno al 720 a.C. da coloni achei, distrutta nel 510 a.C.), Thurii (colonia panellenica fondata nel 444-443 a.C.) e Copia (colonia latina del 193 a.C.)." },
                { d: "Il Museo di Reggio Calabria conserva la Testa del Filosofo in bronzo. Da quali fondali fu recuperata?", r: ["Dai fondali di Porticello, nello Stretto di Messina, talvolta identificata con Pitagora", "Dai fondali di Riace Marina nel 1972, insieme ai Bronzi di Riace", "Dai fondali di Capo Colonna, nei pressi del santuario di Hera Lacinia"], c: 0, sp: "La Testa del Filosofo (bronzo, V sec. a.C.) proviene dai fondali di Porticello nello Stretto di Messina ed è talvolta identificata con Pitagora; si trova al Livello D del Museo di Reggio Calabria." },
                { d: "Il Parco Archeologico di Capo Colonna conserva il Tempio di Hera Lacinia. Quante colonne rimangono ancora in piedi di questo tempio dorico?", r: ["Una sola colonna, alta circa 8,5 m, simbolo del parco e del promontorio", "Sette colonne parzialmente restaurate nel 1958 con anastilosi", "Tre colonne con parte dell'architrave, come al Tempio E di Selinunte"], c: 0, sp: "Del Tempio dorico di Hera Lacinia (480-470 a.C.) sopravvive un'unica colonna alta circa 8,5 m, divenuta il simbolo del parco e del promontorio; era un peristilo di 6x19 colonne su stilobate di circa 59x22 m." },
                { d: "Il centro storico di Gerace in Calabria è noto per il numero di edifici religiosi. Qual è il soprannome che ne deriva?", r: ["La città delle cento chiese per il numero elevato di edifici religiosi", "La città dei Normanni per la straordinaria concentrazione di architettura normanna", "La città degli eremi per i numerosi monasteri rupestri nei dintorni"], c: 0, sp: "Gerace è nota come 'la città delle cento chiese' per il numero elevato di edifici religiosi nel suo tessuto urbano medievale pressoché integro." },
                { d: "Locri Epizefiri è famosa per il suo contributo alla storia del diritto. Quale primato storico ha?", r: ["Intorno al 660 a.C. il legislatore Zaleuco redasse per Locri il primo codice di leggi scritte del mondo occidentale", "Nel V sec. a.C. fu la prima polis greca a istituire un tribunale democratico permanente", "Nel IV sec. a.C. Archita di Locri scrisse il primo trattato di filosofia del diritto del mondo antico"], c: 0, sp: "Intorno al 660 a.C. il legislatore Zaleuco redasse per Locri il primo codice di leggi scritte del mondo occidentale, conferendo alla città il primato storico nella storia del diritto." },
                { d: "La Fortezza Aragonese di Le Castella si trova a Isola di Capo Rizzuto (KR). In quale periodo fu edificata nella struttura attuale?", r: ["Tra il 1510 e il 1526 dagli Aragonesi come fortezza difensiva contro le incursioni dei pirati turchi", "Nel XIII sec. dagli Angioini come residenza nobiliare sul golfo di Squillace", "Nel XVI sec. dai Borboni come avamposto difensivo del Regno di Napoli"], c: 0, sp: "La struttura attuale della Fortezza Aragonese di Le Castella a Isola di Capo Rizzuto (KR) fu edificata e ammodernata dagli Aragonesi tra il 1510 e il 1526 come fortezza difensiva contro le incursioni dei pirati turchi." },
                { d: "I Bronzi di Riace sono conservati al Museo Nazionale di Reggio Calabria (RC). In quale anno e da chi furono scoperti?", r: ["Nel 1972 da un sub nei fondali di Riace Marina (RC)", "Nel 1964 durante lavori di dragaggio del porto di Reggio Calabria (RC)", "Nel 1980 da pescatori di fronte alla costa di Locri Epizefiri (RC)"], c: 0, sp: "I Bronzi di Riace furono scoperti nel 1972 da un sub nei fondali di Riace Marina (RC); sono originali greci della metà del V sec. a.C. e sono esposti in ambiente a condizioni controllate al Museo di Reggio Calabria (RC)." },
                // BASILICATA (4)
                { d: "I Sassi di Matera sono stati iscritti nel Patrimonio UNESCO nel 1993. Quale scrittore italiano denunciò le condizioni di vita nei Sassi?", r: ["Carlo Levi in Cristo si è fermato a Eboli (1945)", "Ignazio Silone in Fontamara (1933)", "Leonardo Sciascia in Il giorno della civetta (1961)"], c: 0, sp: "Carlo Levi denunciò le condizioni di vita nei Sassi nel libro Cristo si è fermato a Eboli; nel 1952 il presidente De Gasperi definì i Sassi 'la vergogna nazionale', avviando lo sfollamento forzato." },
                { d: "Metaponto era una colonia achea della Magna Grecia. Quale filosofo, secondo la tradizione, visse e morì in questa città?", r: ["Pitagora", "Empedocle", "Zenone di Elea"], c: 0, sp: "Secondo la tradizione antica, Pitagora visse e morì a Metaponto, dove si era rifugiato dopo aver lasciato Crotone. Il Tempio extraurbano di Hera, detto Tavole Palatine, è il monumento meglio conservato del sito." },
                { d: "Le Dolomiti Lucane a Castelmezzano e Pietrapertosa sono collegate da una tirolese. Come si chiama?", r: ["Il Volo dell'Angelo, che attraversa la valle del Basento", "Il Volo del Falco, che sorvola la gola del Torrente Camastra", "Il Volo dell'Aquila, il più lungo d'Europa tra le due cime principali"], c: 0, sp: "I borghi di Castelmezzano e Pietrapertosa sono collegati dal Volo dell'Angelo, una tirolese che attraversa la valle del Basento, oltre che da percorsi escursionistici come il Sentiero delle Sette Pietre." },
                { d: "La Cattedrale romanica della Civita di Matera (MT) fu edificata in quale secolo e in quale stile?", r: ["Nel XIII sec. (1268-70) in stile romanico pugliese con elementi di transizione gotica", "Nel XI sec. in stile romanico lombardo su preesistente chiesa rupestre bizantina", "Nel XIV sec. in stile gotico normanno con elementi arabo-siciliani"], c: 0, sp: "La Cattedrale della Civita di Matera (MT) fu edificata nel 1268-70 in stile romanico pugliese con elementi di transizione gotica; sorge sullo sperone della Civita, nucleo più antico e più elevato dei Sassi." },
                // ABRUZZO (3)
                { d: "Il Parco Nazionale del Gran Sasso e Monti della Laga comprende l'unico ghiacciaio degli Appennini. Come si chiama e su quale vetta si trova?", r: ["Il Calderone, sul Corno Grande (2.912 m), massima elevazione dell'Appennino", "Il Calderone, sul Monte Aquila (2.494 m), nel gruppo del Gran Sasso", "Il Ghiacciaio del Velino, sul Monte Velino (2.487 m), massiccio della Laga"], c: 0, sp: "Il Calderone è l'unico ghiacciaio della catena appenninica e si trova sul Corno Grande (2.912 m), la vetta più alta del Parco e massima elevazione dell'Appennino." },
                { d: "Il sito archeologico di Alba Fucens fu fondato nel 303 a.C. Quale via consolare la attraversava?", r: ["La Via Valeria, prolungamento della Via Tiburtina, crocevia dell'Italia centrale", "La Via Appia, che collegava Roma a Capua e poi a Brindisi", "La Via Flaminia, che collegava Roma con Ariminum (Rimini)"], c: 0, sp: "Alba Fucens era attraversata dalla Via Valeria, prolungamento della Via Tiburtina; lungo la Via del Miliario è stato rinvenuto un miliare con l'indicazione di 68 miglia da Roma." },
                { d: "Il sito di Alba Fucens si trova a Massa d'Albe (AQ) in Abruzzo. Quale monumento cristiano fu edificato sul colle del tempio di Apollo?", r: ["La chiesa di San Pietro in Albe, edificata dai Benedettini e ricostruita con materiali originali dopo il terremoto del 1915", "La chiesa di Santa Maria Assunta, costruita dai Normanni nell'XI sec. incorporando le colonne romane", "L'abbazia di Santo Stefano, fondata da Benedetto da Norcia nel VI sec. sul sito del tempio"], c: 0, sp: "Sul colle del tempio di Apollo di Alba Fucens a Massa d'Albe (AQ) i Benedettini edificarono la chiesa di San Pietro in Albe, ricostruita dopo il terremoto del 1915 con materiali originali recuperati." },
                // LIGURIA (3)
                { d: "Il sistema dei Palazzi dei Rolli di Genova è Patrimonio UNESCO dal 2006. Quanti palazzi appartengono a questo sistema?", r: ["Circa 42 palazzi concentrati in Via Garibaldi, Via Balbi e altre strade", "Circa 70 palazzi distribuiti in tutto il centro storico genovese", "Circa 20 palazzi solo in Via Garibaldi (Strada Nuova)"], c: 0, sp: "Il sito UNESCO dei Rolli comprende circa 42 palazzi, concentrati in Via Garibaldi (già Strada Nuova), Via Balbi, Via Lomellini e Salita Santa Caterina." },
                { d: "La Cattedrale di San Lorenzo a Genova conserva il Sacro Catino nel Museo del Tesoro. Cosa si credeva fosse questo oggetto nel Medioevo?", r: ["Il Santo Graal, un grande piatto in vetro romano portato da Cesarea nel 1101", "La coppa dell'Ultima Cena di Cristo, in agata orientale proveniente da Costantinopoli", "Il calice di Giuseppe d'Arimatea, in cristallo di rocca lavorato in Terrasanta"], c: 0, sp: "Il Sacro Catino è un grande piatto in vetro romano (non smeraldo come si credeva); fu portato da Cesarea nel 1101 ed era ritenuto per secoli il Santo Graal, la coppa dell'Ultima Cena." },
                { d: "Il Palazzo Rosso si trova in Via Garibaldi 18 a Genova (GE), nel sistema dei Musei di Strada Nuova. Quali dipinti di celebri maestri conserva?", r: ["Opere di Van Dyck, Dürer e Guercino, con affreschi di Gregorio De Ferrari nelle sale di rappresentanza", "Opere di Caravaggio, Rubens e Murillo nelle sale della pittura fiamminga e italiana", "Opere di Tiziano, Veronese e Tintoretto nelle sale della pittura veneziana del Cinquecento"], c: 0, sp: "Palazzo Rosso (Via Garibaldi 18, Genova GE), dei fratelli Brignole Sale (1671-1677), conserva la collezione d'arte Brignole-Sale con dipinti di Van Dyck, Dürer e Guercino, con affreschi di Gregorio De Ferrari." },
                // MOLISE (2)
                { d: "L'arco monumentale di San Damiano si trova nel Parco Archeologico di Saepinum-Altilia a Sepino (CB). Quali caratteristiche presenta?", r: ["Tre fornici in calcare locale; è l'ingresso nord monumentale alla città ed il monumento più noto del sito", "Un fornice unico in travertino con iscrizioni dedicatorie ai magistrati augustei finanziatori", "Due fornici affiancati in opus reticulatum con bassorilievi delle divinità protettrici della città"], c: 0, sp: "L'arco monumentale di San Damiano nel Parco di Saepinum-Altilia a Sepino (CB) è a tre fornici in calcare locale; è il monumentale ingresso nord alla città e il monumento più noto del sito." },
                // TRENTINO-ALTO ADIGE (2)
                { d: "La Cattedrale di San Vigilio a Trento è il luogo simbolo del Concilio di Trento. In quante fasi si svolse il Concilio?", r: ["Tre fasi: 1545-47, 1551-52 e 1562-63, con i decreti promulgati il 5 dicembre 1563", "Due fasi: 1545-50 e 1560-63, con interruzione per la guerra tra Carlo V e i protestanti", "Quattro sessioni: 1545, 1551, 1561 e 1563, con 300 padri conciliari presenti"], c: 0, sp: "Il Concilio di Trento si svolse in tre fasi (1545-47; 1551-52; 1562-63); i decreti furono promulgati nel presbiterio della cattedrale il 5 dicembre 1563 alla presenza di 217 padri conciliari." },
                { d: "Il fenomeno dell'Enrosadira caratterizza le Dolomiti all'alba e al tramonto. Da cosa è causato?", r: ["Dalle proprietà ottiche della dolomia che tinge le vette di rosso, arancio e viola per la rifrazione della luce", "Dalla combustione di gas vulcanici che emergono dalle fessure delle pareti dolomitiche", "Dal riflesso delle nevi perenni che assume colorazioni diverse secondo l'ora del giorno"], c: 0, sp: "L'Enrosadira (termine ladino per 'arrossamento') è causato dalle proprietà ottiche della dolomia (carbonato doppio di calcio e magnesio) che tinge le vette di rosso, arancio e viola all'alba e al tramonto." },
                // VALLE D'AOSTA (2)
