                { d: "Il Parco Nazionale del Gran Paradiso è il più antico parco nazionale italiano. In quale anno fu istituito e da quale area reale derivò?", r: ["Nel 1922, dalla Riserva Reale di Caccia dei Savoia ceduta da Vittorio Emanuele III allo Stato nel 1919", "Nel 1934, dal Parco Reale dei Savoia istituito da Carlo Alberto nel 1856", "Nel 1918, dalla Riserva di Caccia di Valdieri-Entracque istituita nel 1857 da Vittorio Emanuele II"], c: 0, sp: "Il Parco del Gran Paradiso fu istituito con regio decreto il 3 dicembre 1922, partendo dalla Riserva Reale di Caccia dei Savoia ceduta da Vittorio Emanuele III allo Stato nel 1919." },
                { d: "La Marmolada è la vetta più alta delle Dolomiti e si trova nella Provincia Autonoma di Trento (TN) e Belluno. Qual è la sua quota?", r: ["3.343 m s.l.m., con il più grande ghiacciaio delle Dolomiti", "3.905 m s.l.m., al confine tra Trentino e Alto Adige", "2.810 m s.l.m., come la Croda del Becco nel Parco Fanes-Senes-Braies"], c: 0, sp: "La Marmolada è la vetta più alta delle Dolomiti con 3.343 m s.l.m. e ospita il più grande ghiacciaio delle Dolomiti; è uno dei nove sistemi del sito UNESCO istituito nel 2009." }
            , 
            
            ],

            geografia: [
                { d: "Il Parco Nazionale della Sila si estende sull'altopiano calabrese. Quale è la sua superficie e quante province coinvolge?", r: ["73.695 ettari su tre province: Cosenza, Catanzaro e Crotone per 19 comuni", "192.565 ettari su tre province tra Calabria e Basilicata", "141.341 ettari su tre regioni come il Parco del Gran Sasso"], c: 0, sp: "Il Parco della Sila copre 73.695 ettari sulle province di Cosenza (9 comuni), Catanzaro (6 comuni) e Crotone (4 comuni), per un totale di 19 comuni." },
                { d: "Le Dolomiti sono state iscritte nel Patrimonio UNESCO nel 2009 come sito naturale seriale. Quanti sistemi distinti comprende il sito?", r: ["Nove sistemi distinti per una superficie complessiva di 141.903 ettari", "Sei sistemi distinti per una superficie di 89.267 ettari", "Dodici sistemi distinti per una superficie di 200.000 ettari"], c: 0, sp: "Il sito UNESCO delle Dolomiti è composto da nove sistemi distinti (tra cui Marmolada, Pale di San Martino, Puez-Odle, Sciliar-Catinaccio) per 141.903 ettari totali." },
                { d: "Il Lago di Braies si trova nella Val Pusteria in Alto Adige. Come si è formato geologicamente questo lago?", r: ["È un lago di sbarramento formatosi quando una frana ostruì il Rio Braies", "È un lago glaciale di origine pleistocenica scavato da un antico ghiacciaio", "È un lago carsico formatosi per dissoluzione del calcare dolomitico"], c: 0, sp: "Il Lago di Braies è un lago di sbarramento: si formò quando una frana staccatasi dal Sasso del Signore ostruì il Rio Braies; le acque drenano in parte in superficie e in parte per via sotterranea." },
                { d: "La Costiera Amalfitana è Patrimonio UNESCO dal 1997. Per quanti chilometri si estende lungo il Mar Tirreno?", r: ["Circa 50 km dal promontorio di Punta Campanella fino a Vietri sul Mare", "Circa 30 km da Positano fino a Salerno", "Circa 70 km dall'isola di Capri fino a Paestum"], c: 0, sp: "La Costiera Amalfitana si estende per circa 50 km dal promontorio di Punta Campanella fino a Vietri sul Mare, affacciata sul Mar Tirreno in provincia di Salerno." },
                { d: "La Valle del Bove si trova sul versante orientale dell'Etna. Quale funzione svolge nella dinamica vulcanica?", r: ["È una depressione di circa 7x5 km che canalizza le principali colate laviche verso il mare", "È un cratere sommitale spento che funge da serbatoio magmatico secondario", "È una caldera di collasso che documenta la precedente attività esplosiva pliniana"], c: 0, sp: "La Valle del Bove è una depressione di circa 7x5 km che si apre sul versante orientale dell'Etna e canalizza le principali colate laviche verso il mare." },
                { d: "Le Colline del Prosecco di Conegliano e Valdobbiadene sono Patrimonio UNESCO dal 2019. Quale tecnica di allevamento della vite è tipica di questo territorio?", r: ["La bellussera, sistema a pergole a raggiera su pali inclinati sviluppato intorno al 1880, lavorabile solo manualmente", "Il Guyot basso con filari paralleli meccanizzati su pendii terrazzati", "Il tendone a doppia pergola orizzontale tipico dei vigneti di pianura veneta"], c: 0, sp: "La bellussera, sviluppata intorno al 1880, determina pergole a raggiera su pali di legno inclinati che dall'alto assumono l'aspetto di un alveare; richiede esclusivamente lavorazione manuale per l'impossibilità di meccanizzare su queste pendici." },
                { d: "Il Parco del Pollino è il più grande parco protetto di nuova istituzione in Italia. Quale albero simbolo cresce esclusivamente in questo territorio italiano?", r: ["Il Pino Loricato (Pinus leucodermis), conifera relitto glaciale di origine balcanica", "Il Faggio di Bosco (Fagus sylvatica subsp. orientalis), endemismo appenninico", "L'Abete bianco appenninico (Abies alba subsp. apennina), reliquia glaciale alpina"], c: 0, sp: "Il simbolo del Parco del Pollino è il Pino Loricato (Pinus leucodermis), conifera relitto glaciale di origine balcanica che in Italia cresce esclusivamente in quest'area, con forme contorte sulle pareti rocciose d'alta quota." },
                { d: "Il Parco Nazionale del Gran Paradiso si estende tra Valle d'Aosta (AO) e Piemonte (TO). Con quale parco nazionale francese forma la più grande area protetta alpina dell'Europa occidentale?", r: ["Con il Parc National de la Vanoise, per un totale di circa 150.000 ettari totali", "Con il Parc National du Mercantour, che condivide un confine di 35 km con le Alpi Marittime", "Con il Parc National des Écrins, nella zona del massiccio del Delfinato francese"], c: 0, sp: "Il Parco Nazionale del Gran Paradiso (Valle d'Aosta e Piemonte) è contiguo con il Parc National de la Vanoise francese, con cui forma la più grande area protetta alpina dell'Europa occidentale (circa 150.000 ettari totali)." },
                { d: "Il Parco Nazionale delle Cinque Terre si trova in provincia di La Spezia (SP). Quale è la sua superficie e quale primato detiene?", r: ["3.869 ettari: è il più piccolo parco nazionale italiano per superficie e il più densamente popolato", "8.482 ettari: è il parco nazionale con la maggiore biodiversità costiera d'Italia", "20.598 ettari: include anche l'entroterra delle Alpi Apuane in Liguria"], c: 0, sp: "Il Parco Nazionale delle Cinque Terre in provincia di La Spezia (SP) ha una superficie di 3.869 ettari; è il più piccolo parco nazionale italiano per superficie e il più densamente popolato; include l'Area Marina Protetta e fa parte del Santuario dei Cetacei." },
                { d: "Monte Isola si trova nel Lago d'Iseo in provincia di Brescia (BS). Quale primato europeo detiene?", r: ["È la più grande isola lacustre dell'Europa continentale con 4,5 km² e circa 1.800 abitanti", "È l'isola lacustre più alta d'Europa con il suo borgo medievale a 600 m s.l.m.", "È l'isola lacustre più antica d'Europa con insediamenti documentati dal Neolitico"], c: 0, sp: "Monte Isola nel Lago d'Iseo (BS) è la più grande isola lacustre dell'Europa continentale con 4,5 km² e circa 1.800 abitanti permanenti." },
                { d: "Il Parco Naturale delle Alpi Marittime si trova nelle province di Cuneo (CN) e confina con la Francia. Quante specie vegetali conta il parco?", r: ["Circa 2.600 specie vegetali con 14 endemismi esclusivi tra cui la Saxifraga florulenta e la Potentilla valderia", "Circa 1.500 specie vegetali con 8 endemismi condivisi con il Parco del Mercantour francese", "Circa 3.500 specie vegetali, la maggiore biodiversità botanica di tutte le Alpi italiane"], c: 0, sp: "Il Parco Naturale delle Alpi Marittime in provincia di Cuneo (CN) conta circa 2.600 specie vegetali con 14 endemismi esclusivi tra cui la Saxifraga florulenta e la Potentilla valderia; 40 delle 80 specie di orchidee italiane sono presenti nel parco." },
                { d: "La Costiera Amalfitana in provincia di Salerno (SA) è Patrimonio UNESCO dal 1997. Quale prodotto agricolo tipico è a indicazione geografica protetta?", r: ["Il limone sfusato amalfitano IGP, base dell'economia agricola tradizionale della costa", "Il pomodoro corbarino DOP, coltivato sulle terrazze rocciose sopra Positano", "L'olio extravergine Colline Salernitane DOP, prodotto nei terrazzamenti della Costiera"], c: 0, sp: "L'economia tradizionale della Costiera Amalfitana (SA) si basa sulla produzione del limone sfusato amalfitano IGP, coltivato sulle terrazze rocciose caratteristiche di questo paesaggio UNESCO." },
                { d: "Le Grotte di Pertosa-Auletta si trovano nel Parco Nazionale del Cilento (SA). Quale duplice unicità europea presentano?", r: ["Sono le sole grotte in Italia in cui si naviga un fiume sotterraneo (il Negro) e le uniche in Europa con resti di un villaggio palafitticolo del II millennio a.C.", "Sono le grotte con le stalattiti più alte d'Europa e le uniche con cristalli di gesso giganti in ambiente acquatico", "Sono le sole grotte visitabili in Italia con un lago sotterraneo e le uniche con pitture rupestri paleolitiche in contesto carsico"], c: 0, sp: "Le Grotte di Pertosa-Auletta (SA) presentano due unicità europee: sono le sole grotte in Italia in cui si naviga un fiume sotterraneo (il Negro) e le uniche in Europa a conservare resti di un villaggio palafitticolo risalente al II millennio a.C." }
           ,
                           { d: "Le Grotte di Frasassi nelle Marche furono scoperte ufficialmente il 27 settembre 1971. Come avvenne la scoperta del sistema principale?", r: ["Un gruppo del CAI di Ancona guidato da Giancarlo Cappanera entrò da un pertugio sul Monte Valmontagnana attirato da una corrente d'aria fredda", "Un geologo dell'Università di Ancona individuò la cavità durante campagne di mappatura sismica", "Operai durante lavori stradali aprirono accidentalmente una voragine che immetteva nella grotta principale"], c: 0, sp: "Il 27 settembre 1971 un gruppo speleologico del CAI di Ancona guidato da Giancarlo Cappanera scoprì la Grotta Grande del Vento entrando da un pertugio sul Monte Valmontagnana, attirato da una forte corrente d'aria fredda." },
, { d: "Qual è l'animale simbolo del Parco Nazionale del Vesuvio?", r: ["La volpe", "Il falco pellegrino", "La civetta"], c: 0, sp: "La volpe è considerata il simbolo del Parco Nazionale del Vesuvio, un'area che protegge una ricca biodiversità alle pendici del vulcano." },
    { d: "Quale maestoso rapace è tornato a nidificare sull'Etna ed è considerato un simbolo del Parco?", r: ["L'aquila reale", "Il falco pellegrino", "Il gheppio"], c: 0, sp: "L'aquila reale è un maestoso rapace che, dopo anni di assenza, è tornato a nidificare sulle pareti rocciose dell'Etna, diventando un simbolo del Parco dell'Etna." },
    { d: "Qual è la superficie in ettari del Parco Nazionale delle Cinque Terre e quale primato detiene?", r: ["Circa 3.860 ettari; è il parco nazionale più piccolo e densamente popolato d'Italia", "Circa 5.000 ettari; è il parco nazionale con la maggiore biodiversità costiera", "Circa 2.000 ettari; è il parco nazionale più antico d'Italia"], c: 0, sp: "Il Parco Nazionale delle Cinque Terre si estende per circa 3.860 ettari, è il più piccolo d'Italia e allo stesso tempo il più densamente popolato, con circa 4.000 abitanti divisi in cinque borghi." },
    { d: "Qual è l'animale simbolo del Parco Nazionale della Sila?", r: ["Il lupo", "Il capriolo", "L'istrice"], c: 0, sp: "Il simbolo del Parco Nazionale della Sila è il lupo, una specie perseguitata per secoli e fortunatamente sopravvissuta, che ha ispirato anche la mascotte del parco, 'Silotto'." },
    { d: "Qual è l'animale simbolo del Parco Nazionale del Gran Paradiso, la cui protezione ha portato all'istituzione dell'area protetta?", r: ["Lo stambecco", "Il camoscio", "La marmotta"], c: 0, sp: "L'animale simbolo del Parco Nazionale del Gran Paradiso è lo stambecco. La storia del parco è indissolubilmente legata alla protezione di questo ungulato, che compare anche nel logo ufficiale." },
    { d: "Quale pianta endemica è il simbolo del Parco Nazionale delle Dolomiti Bellunesi?", r: ["La Campanula di Moretti", "La Stella Alpina", "Il Rododendro"], c: 0, sp: "Il simbolo del Parco Nazionale delle Dolomiti Bellunesi è la Campanula di Moretti, una specie endemica che cresce sulle rupi a quote superiori ai 1.200 metri." },
    { d: "Qual è l'animale simbolo del Parco Nazionale del Gargano?", r: ["Il capriolo garganico", "Il gatto selvatico", "Il cinghiale"], c: 0, sp: "Il simbolo del Parco Nazionale del Gargano è il capriolo garganico, una sottospecie autoctona che vive nelle foreste dell'area protetta." },
    { d: "Quale uccello marino è l'emblema del Parco Nazionale dell'Arcipelago Toscano?", r: ["Il gabbiano corso", "La berta maggiore", "Il falco pellegrino"], c: 0, sp: "L'emblema del Parco Nazionale dell'Arcipelago Toscano è il gabbiano corso. L'area protetta è un importante punto di sosta e nidificazione per molti uccelli migratori." },
    { d: "Qual è la vetta più alta del Parco Nazionale del Pollino, che rappresenta anche la cima più elevata dell'Italia meridionale peninsulare?", r: ["Serra Dolcedorme (2.267 m)", "Monte Pollino (2.248 m)", "Serra del Prete (2.180 m)"], c: 0, sp: "La vetta più alta del Parco Nazionale del Pollino è la Serra Dolcedorme, che con i suoi 2.267 metri è anche la montagna più alta dell'Italia meridionale peninsulare." },
    { d: "Quale tipo di paesaggio, unico a livello mondiale, caratterizza le Colline del Prosecco di Conegliano e Valdobbiadene?", r: ["Il paesaggio a 'monoclinale'", "Il paesaggio a 'hogback'", "Il paesaggio a 'cuesta'"], c: 0, sp: "Le Colline del Prosecco sono caratterizzate da un paesaggio a 'monoclinale', formato da strati resistenti di conglomerato, arenaria o calcare, alternati a fasce depresse di argille o marne, una configurazione unica al mondo." },
    { d: "Quale tipo di roccia costituisce le resistenti dorsali delle Colline del Prosecco di Conegliano e Valdobbiadene?", r: ["Conglomerato, arenaria o calcare", "Granito e basalto", "Dolomia e gesso"], c: 0, sp: "Le dorsali delle Colline del Prosecco sono formate da resistenti strati di conglomerato, arenaria o calcare, che hanno modellato questo paesaggio unico." },
    { d: "Quale fiume sotterraneo si può navigare all'interno delle Grotte di Pertosa-Auletta?", r: ["Il fiume Negro", "Il fiume Tanagro", "Il fiume Sele"], c: 0, sp: "Le Grotte di Pertosa-Auletta sono le uniche in Italia dove è possibile navigare un fiume sotterraneo, il fiume Negro, offrendo un'esperienza speleologica unica in Europa." },
    { d: "Quale tipo di reperto archeologico, risalente al II millennio a.C., è stato ritrovato all'interno delle Grotte di Pertosa-Auletta?", r: ["Resti di un villaggio palafitticolo", "Pitture rupestri", "Ceramiche neolitiche"], c: 0, sp: "All'interno delle Grotte di Pertosa-Auletta sono stati ritrovati i resti di un villaggio palafitticolo risalente al II millennio a.C., un ritrovamento eccezionale che le rende uniche in Europa." },
    { d: "Quale monumentale albero è il simbolo del Parco Nazionale del Pollino e cresce esclusivamente in questo territorio in Italia?", r: ["Il Pino Loricato (Pinus leucodermis)", "Il Faggio", "L'Abete bianco"], c: 0, sp: "Il simbolo del Parco Nazionale del Pollino è il Pino Loricato, una conifera relitto di origine balcanica che in Italia cresce esclusivamente su queste montagne." },
    { d: "Con quale parco nazionale francese confina il Parco Nazionale del Gran Paradiso, formando la più grande area protetta dell'Europa occidentale?", r: ["Con il Parc National de la Vanoise", "Con il Parc National des Écrins", "Con il Parc National du Mercantour"], c: 0, sp: "Il Parco Nazionale del Gran Paradiso confina con il Parc National de la Vanoise in Francia, formando insieme la più vasta area protetta dell'Europa occidentale." },
    { d: "Qual è il nome della grande depressione sul versante orientale dell'Etna che canalizza le colate laviche verso il mare?", r: ["La Valle del Bove", "La Valle del Leone", "La Valle dell'Orso"], c: 0, sp: "La Valle del Bove è un'enorme depressione di circa 7x5 km sul versante orientale dell'Etna che funge da canale per le principali colate laviche." },
    { d: "Quale lago del Trentino-Alto Adige si è formato in seguito a una frana che ha ostruito un corso d'acqua?", r: ["Il Lago di Braies", "Il Lago di Carezza", "Il Lago di Tovel"], c: 0, sp: "Il Lago di Braies è un lago di sbarramento, formatosi quando una frana staccatasi dal Sasso del Signore ostruì il Rio Braies." },
    { d: "Qual è il nome del sistema di allevamento della vite a pergola, tipico delle Colline del Prosecco di Conegliano e Valdobbiadene?", r: ["La bellussera", "La pergola trentina", "Il tendone"], c: 0, sp: "La bellussera è il tradizionale sistema di allevamento della vite a pergola a raggiera sviluppato intorno al 1880, tipico delle Colline del Prosecco e lavorabile solo manualmente." },
    { d: "Quale era l'antico lago, di cui oggi rimane la Riserva Naturale Diaccia Botrona, che dominava la Maremma in epoca etrusca e romana?", r: ["L'antico Lago Prile", "L'antico Lago di Burano", "L'antico Lago di Massaciuccoli"], c: 0, sp: "La Riserva Naturale Diaccia Botrona rappresenta ciò che resta dell'antico Lago Prile, un'immensa laguna che dominava la Maremma in epoca etrusca e romana." },
    { d: "Quale prodotto agricolo IGP è alla base dell'economia tradizionale della Costiera Amalfitana?", r: ["Il limone sfusato amalfitano", "Il pomodoro corbarino", "L'olio extravergine Colline Salernitane"], c: 0, sp: "L'economia tradizionale della Costiera Amalfitana si basa sulla produzione del limone sfusato amalfitano IGP, coltivato sui caratteristici terrazzamenti rocciosi." },
    { d: "Quante isole compongono il Parco Nazionale dell'Arcipelago Toscano?", r: ["Sette isole", "Cinque isole", "Dieci isole"], c: 0, sp: "Il Parco Nazionale dell'Arcipelago Toscano comprende sette isole, ognuna unica per clima, geologia e biodiversità." },
    { d: "Quale lago della Lombardia ospita Monte Isola, la più grande isola lacustre dell'Europa continentale?", r: ["Il Lago d'Iseo", "Il Lago di Como", "Il Lago di Garda"], c: 0, sp: "Monte Isola si trova nel Lago d'Iseo ed è la più grande isola lacustre dell'Europa continentale, con una superficie di 4,5 km²." },
    { d: "Qual è l'animale simbolo del Parco Naturale Regionale delle Alpi Apuane?", r: ["Il lupo appenninico", "L'aquila reale", "Il muflone"], c: 0, sp: "Il lupo appenninico è considerato l'animale simbolo del Parco Naturale Regionale delle Alpi Apuane, un'area protetta tra la Toscana e la Liguria." },
    { d: "Quale tipo di roccia caratterizza le Alpi Apuane, rendendole uniche nell'Appennino settentrionale?", r: ["Il marmo", "La dolomia", "Il calcare"], c: 0, sp: "Le Alpi Apuane sono famose in tutto il mondo per le loro cave di marmo, una roccia che caratterizza il paesaggio di queste montagne uniche nell'Appennino settentrionale." },
    { d: "Quale fenomeno geologico ha creato lo spettacolare scenario delle Grotte di Frasassi nelle Marche?", r: ["L'erosione carsica", "L'attività vulcanica", "L'erosione glaciale"], c: 0, sp: "Le Grotte di Frasassi sono uno spettacolare esempio di erosione carsica, un fenomeno geologico che ha modellato le rocce calcaree creando ambienti sotterranei unici." },
    { d: "Qual è il nome della vetta più alta del Parco Nazionale dei Monti Sibillini?", r: ["Monte Vettore (2.476 m)", "Monte Priora (2.332 m)", "Monte Bove (2.112 m)"], c: 0, sp: "Il Monte Vettore, con i suoi 2.476 metri di altitudine, è la cima più elevata del Parco Nazionale dei Monti Sibillini." },
    { d: "Quale raro felino, a rischio di estinzione, è un simbolo della biodiversità del Parco Nazionale del Pollino?", r: ["Il gatto selvatico", "La lince", "Il leopardo"], c: 0, sp: "Il gatto selvatico è un raro e schivo felino che rappresenta uno dei simboli della biodiversità del Parco Nazionale del Pollino." },
    { d: "Quale pianta, simbolo del Parco Nazionale del Vesuvio, è tipica della macchia mediterranea e ricopre le sue pendici?", r: ["Il pino marittimo", "La ginestra", "Il leccio"], c: 0, sp: "La ginestra è una pianta simbolo del Parco Nazionale del Vesuvio, tipica della macchia mediterranea, e ricopre vaste aree delle sue pendici con le sue fioriture gialle." },
    { d: "Quale antica roccia vulcanica caratterizza il paesaggio dell'Altopiano della Sila in Calabria?", r: ["Il granito", "Il basalto", "La trachite"], c: 0, sp: "L'altopiano della Sila è caratterizzato da un'antica base di rocce granitiche, modellate nel tempo dagli agenti atmosferici." },
    { d: "Quale mare, con il suo colore cristallino, bagna la Costa dei Trabocchi in Abruzzo?", r: ["Il Mare Adriatico", "Il Mar Tirreno", "Il Mar Ionio"], c: 0, sp: "La Costa dei Trabocchi è bagnata dal Mare Adriatico, le cui acque cristalline lambiscono le caratteristiche spiagge di ciottoli dell'Abruzzo." },
    { d: "Qual è il nome del più grande parco nazionale d'Italia, situato tra le province di Salerno, Potenza e Matera?", r: ["Il Parco Nazionale del Cilento, Vallo di Diano e Alburni", "Il Parco Nazionale del Pollino", "Il Parco Nazionale della Sila"], c: 0, sp: "Il Parco Nazionale del Cilento, Vallo di Diano e Alburni è il più grande parco nazionale italiano, un territorio ricco di storia e biodiversità." },
    { d: "Quale dolce tipico, a forma di piccola noce, è originario del Parco Nazionale della Sila?", r: ["Il torrone di copeta", "Il croccante di mandorle", "I mostaccioli"], c: 0, sp: "Il torrone di copeta è un dolce tipico della tradizione silana, spesso associato alle festività e realizzato con ingredienti semplici del territorio." } ],
           
archeologia: [                { d: "Locri Epizefiri è famosa per il suo contributo alla storia del diritto. Quale primato storico ha?", r: ["Intorno al 660 a.C. il legislatore Zaleuco redasse per Locri il primo codice di leggi scritte del mondo occidentale", "Nel V sec. a.C. fu la prima polis greca a istituire un tribunale democratico permanente", "Nel IV sec. a.C. Archita di Locri scrisse il primo trattato di filosofia del diritto del mondo antico"], c: 0, sp: "Intorno al 660 a.C. il legislatore Zaleuco redasse per Locri il primo codice di leggi scritte del mondo occidentale, conferendo alla città il primato storico nella storia del diritto." },
                { d: "La Fortezza Aragonese di Le Castella si trova a Isola di Capo Rizzuto (KR). In quale periodo fu edificata nella struttura attuale?", r: ["Tra il 1510 e il 1526 dagli Aragonesi come fortezza difensiva contro le incursioni dei pirati turchi", "Nel XIII sec. dagli Angioini come residenza nobiliare sul golfo di Squillace", "Nel XVI sec. dai Borboni come avamposto difensivo del Regno di Napoli"], c: 0, sp: "La struttura attuale della Fortezza Aragonese di Le Castella a Isola di Capo Rizzuto (KR) fu edificata e ammodernata dagli Aragonesi tra il 1510 e il 1526 come fortezza difensiva contro le incursioni dei pirati turchi." },
,                { d: "Ostia Antica conserva il Piazzale delle Corporazioni. Cosa raffigurano i mosaici pavimentali delle 64 stationes?", r: ["Simboli di navicularii e corporazioni commerciali del Mediterraneo: Cartagine, Alessandria, Gallia, Egitto", "Ritratti degli imperatori che finanziarono il porto di Ostia da Augusto a Costantino", "Scene di vita portuale con navi, merci e mestieri dell'antica Roma imperiale"], c: 0, sp: "Il Piazzale delle Corporazioni (età augustea, forma attuale adrianea) ha 64 stationes con mosaici raffiguranti simboli dei navicularii e delle corporazioni commerciali del Mediterraneo." },
,
           { d: "Il Parco Archeologico di Carsulae in Umbria si sviluppa lungo quale via consolare romana?", r: ["La Via Flaminia, costruita dal console Gaio Flaminio intorno al 220 a.C. per collegare Roma con Rimini", "La Via Appia Traiana, prolungamento della Via Appia verso l'Adriatico", "La Via Valeria, prolungamento della Via Tiburtina verso i territori dei Marsi"], c: 0, sp: "Carsulae si sviluppò lungo la Via Flaminia (costruita intorno al 220 a.C.); il basolato originale è ancora in situ attraverso il sito e funge da cardo maximus." },
                { d: "Il Parco Archeologico di Saepinum-Altilia in Molise è paragonabile per integrità planimetrica a Pompei. Quante porte monumentali presenta la cinta muraria?", r: ["Quattro porte: Porta Bojano, Porta Tammaro, Porta Benevento e Porta Terravecchia", "Tre porte: Porta Nord, Porta Sud e Porta Est con archi di trionfo", "Sei porte distribuite su una cinta muraria a pianta esagonale"], c: 0, sp: "La cinta muraria di Saepinum (oltre 1 km in opera reticolata) si apre in quattro porte monumentali: Porta Bojano (nord, la principale), Porta Tammaro, Porta Benevento e Porta Terravecchia." },

     
                { d: "Il Museo Archeologico Nazionale di Napoli conserva il Toro Farnese. Da quale sito romano proviene questa scultura?", r: ["Dalle Terme di Caracalla a Roma", "Dal Foro di Traiano a Roma", "Dalla Villa Adriana a Tivoli"], c: 0, sp: "Il Toro Farnese (copia romana del II sec. d.C. da originale ellenistico di Apollonio e Taurisco di Tralles) fu rinvenuto alle Terme di Caracalla a Roma." },
                { d: "Il Parco Archeologico di Pompei conserva la Casa del Fauno. Quale celebre mosaico proviene da questa domus?", r: ["Il mosaico della Battaglia di Isso, ora al Museo Nazionale di Napoli", "Il mosaico delle Quattro Stagioni, ora agli Uffizi di Firenze", "Il mosaico del Nilo, ora al Museo Nazionale Romano"], c: 0, sp: "Dalla Casa del Fauno di Pompei proviene il mosaico della Battaglia di Isso (Alessandro Magno contro Dario III), ora al Museo Nazionale di Napoli." },
                { d: "Il Parco Archeologico di Paestum custodisce tre templi dorici tra i meglio conservati al mondo. Quale è il più antico?", r: ["Il Tempio di Hera I (o Basilica), di metà VI sec. a.C., pseudoperiptero con 9 colonne in facciata", "Il Tempio di Hera II (o di Nettuno), di metà V sec. a.C., periptero esastilo con 6 colonne", "Il Tempio di Atena (o di Cerere), di fine VI sec. a.C., con elementi misti dorico-ionici"], c: 0, sp: "Il Tempio di Hera I, detto Basilica, di metà VI sec. a.C., è il più antico dei tre templi di Paestum; è pseudoperiptero con 9 colonne sulla facciata e 18 sui lati, privo di frontoni." },
                    { d: "Il Parco Archeologico della Neapolis di Siracusa comprende l'Ara di Ierone II. A quale divinità era dedicata e quanti buoi vi venivano immolati?", r: ["A Zeus Eleuterio, con 300 buoi immolati simultaneamente", "Ad Apollo Licio, con 100 buoi immolati per le Panatenee", "A Demetra, con 200 buoi per i Misteri Eleusini"], c: 0, sp: "L'Ara di Ierone II (III sec. a.C., lunga 198 m) era destinata ai sacrifici pubblici in onore di Zeus Eleuterio, con 300 buoi immolati simultaneamente secondo le fonti." },
                { d: "Il Museo Archeologico Paolo Orsi di Siracusa conserva la Venus Landolina. Che tipo di opera è?", r: ["Una scultura in marmo di I-II sec. d.C., copia romana di originale ellenistico del tipo Afrodite Anadiomene, rinvenuta nel 1804", "Una statua originale greca del V sec. a.C. rinvenuta durante gli scavi della Neapolis di Siracusa", "Un'opera firmata dallo scultore Prassitele, unica copia autentica di un bronzo originale greco"], c: 0, sp: "La Venus Landolina è una scultura in marmo di I-II sec. d.C., copia romana di originale ellenistico del tipo Afrodite Anadiomene, rinvenuta nel giardino della Villa Landolina nel 1804 da Saverio Landolina Nava." },
{
        d: "Quale peculiare struttura del Parco Archeologico della Neapolis, l'Orecchio di Dionisio, è famosa per una sua caratteristica acustica?",
        r: ["È una grotta artificiale a forma di orecchio umano che amplifica incredibilmente i suoni, persino un bisbiglio", "È una stanza sotterranea dove l'eco si ripete fino a sette volte", "È un anfiteatro dove la voce di un attore sul palco può essere udita fino all'ultima fila senza amplificazione"],
        c: 0,
        sp: "L'Orecchio di Dionisio è un'alta grotta artificiale scavata nella roccia, famosa per la sua eccezionale acustica che amplifica ogni suono. Secondo la leggenda, il tiranno Dionisio vi rinchiudeva i prigionieri per ascoltarne i discorsi."
    },
                { d: "Il Parco Archeologico dell'Appia Antica comprende il Mausoleo di Cecilia Metella. Da quale famiglia fu trasformato in fortezza medievale?", r: ["Dai Caetani tra il 1302 e il 1303, con cinta muraria e 19 torri", "Dai Colonna nel XIV sec., che vi aggiunsero il ponte levatoio", "Dai Savelli nel XIII sec., che lo inglobarono nel loro castello sul Palatino"], c: 0, sp: "Il Mausoleo di Cecilia Metella (30-20 a.C.) fu trasformato in castrum medievale dai Caetani tra il 1302 e il 1303 con una cinta muraria, 19 torri e la chiesa di San Nicola." },
,
                { d: "Il sito fenicio-punico di Tharros si trova sulla penisola del Sinis in Sardegna. Quale fu la sua funzione dopo la conquista romana del 238 a.C.?", r: ["Continuò come centro urbano romano con cardo e decumano, terme e strutture portuali; divenne poi capitale del Giudicato di Arborea intorno al 900 d.C.", "Fu abbandonata immediatamente dopo la conquista e il sito rimase deserto fino al Medioevo", "Divenne colonia latina come Paestum e Cosa, con impianto ortogonale e foro monumentale"], c: 0, sp: "Dopo il 238 a.C. Tharros proseguì come centro romano con cardo, decumano, terme e porto; in età bizantina fu sede vescovile e prima capitale del Giudicato di Arborea prima del trasferimento a Oristano nel 1070." },
                { d: "Il Museo Archeologico Nazionale di Cagliari conserva i bronzetti nuragici. Quale è la collezione più importante dell'isola per questi manufatti?", r: ["La collezione del museo cagliaritano, con esemplari da tutta la Sardegna tra cui capi tribù, arcieri e guerrieri", "La collezione del Museo di Cabras, che custodisce i bronzetti rinvenuti a Monte Prama", "La collezione del Museo di Sassari, con i bronzetti più antichi del Bronzo Medio sardo"], c: 0, sp: "Il Museo Archeologico Nazionale di Cagliari conserva la collezione più importante dell'isola di bronzetti nuragici, con esemplari da tutta la Sardegna tra cui capi tribù con attributi del potere, personaggi femminili, arcieri e guerrieri." },
                { d: "La Tomba dei Giganti di Coddu Vecchiu si trova ad Arzachena (SS) in Sardegna. Qual è l'altezza della stele centinata centrale?", r: ["4 m, la più alta stele centinata dell'isola, con portello alla base per le offerte rituali", "6 m, la più alta struttura megalitica della Sardegna nuragica", "2,5 m, stele in granito locale con decorazioni geometriche incise"], c: 0, sp: "La stele centinata centrale della Tomba dei Giganti di Coddu Vecchiu ad Arzachena (SS) è alta 4 m, la più alta stele dell'isola; la stele simboleggia la 'falsa porta' tra il mondo dei vivi e quello dei morti." },
,
                { d: "Le Terme di Caracalla furono costruite tra il 212 e il 216 d.C. Quale acquedotto le alimentava?", r: ["Un ramo speciale dell'Acqua Marcia", "L'Acquedotto dell'Acqua Vergine", "L'Acquedotto Carolino da Monte Taburno"], c: 0, sp: "Le Terme di Caracalla erano alimentate da un ramo speciale dell'Acqua Marcia, uno degli acquedotti romani di maggiore portata." },
                { d: "La Necropoli di Tarquinia è la più estesa necropoli etrusca conosciuta. Quale è la sua superficie?", r: ["130 ettari con oltre 6.000 sepolcri", "80 ettari con circa 3.000 sepolcri", "400 ettari come l'intera area della Banditaccia"], c: 0, sp: "La Necropoli dei Monterozzi di Tarquinia si estende su 130 ettari con oltre 6.000 sepolcri scavati nel tufo, di cui circa 200 tombe dipinte." },
,
                { d: "Il Museo Archeologico Regionale Antonino Salinas di Palermo conserva le sculture del Tempio di Selinunte. Quale ordine architettonico caratterizza questi templi?", r: ["Ordine dorico con colonne possenti e capitelli geometrici", "Ordine ionico con capitelli a volute e basi decorate", "Ordine corinzio con capitelli riccamente scolpiti"], c: 0, sp: "I templi di Selinunte sono caratterizzati dall'ordine dorico, con colonne massicce e capitelli semplici; il Tempio G è uno dei più grandi templi dorici mai costruiti." },
                { d: "Il Teatro Greco di Taormina fu costruito nel III sec. a.C. Quale panorama si gode dalla cavea?", r: ["Il panorama dell'Etna e del Mar Ionio, con vista sulla baia di Naxos", "Il panorama delle Isole Eolie e del Mar Tirreno", "Il panorama del Monte Tauro e della valle dell'Alcantara"], c: 0, sp: "Dalla cavea del Teatro Greco di Taormina si gode uno spettacolare panorama sull'Etna e sul Mar Ionio, con vista sulla baia di Naxos; il teatro fu ampliato in età romana." },
,                { d: "Il Museo Archeologico Nazionale di Napoli conserva il Toro Farnese. Da quale sito romano proviene questa scultura?", r: ["Dalle Terme di Caracalla a Roma", "Dal Foro di Traiano a Roma", "Dalla Villa Adriana a Tivoli"], c: 0, sp: "Il Toro Farnese (copia romana del II sec. d.C. da originale ellenistico di Apollonio e Taurisco di Tralles) fu rinvenuto alle Terme di Caracalla a Roma." },
,
{
        d: "L'Anfiteatro Flavio, universalmente noto come Colosseo, fu iniziato sotto Vespasiano. Su quale struttura preesistente, appartenuta a Nerone, fu edificato?",
        r: ["Sul laghetto artificiale della Domus Aurea", "Sul Circo di Caligola", "Sugli Horti Sallustiani"],
        c: 0,
        sp: "L'Anfiteatro Flavio fu edificato sul sito del laghetto artificiale della Domus Aurea di Nerone, una scelta dal forte valore simbolico di restituzione al popolo di uno spazio privatizzato dall'imperatore."
    },
                    { d: "Il Mosaico della Battaglia di Isso è conservato al Museo Nazionale di Napoli (NA). Da quale domus di Pompei proviene?", r: ["Dalla Casa del Fauno a Pompei (NA); è una copia di un dipinto ellenistico del IV sec. a.C. con circa 1,5 milioni di tessere", "Dalla Casa dei Vettii a Pompei (NA); raffigura la battaglia di Arbela del 331 a.C.", "Dalla Villa dei Misteri a Pompei (NA); documenta la vittoria di Alessandro a Gaugamela"], c: 0, sp: "Il Mosaico della Battaglia di Isso (I sec. a.C., circa 1,5 milioni di tessere in opus vermiculatum, 272x513 cm) proviene dalla Casa del Fauno a Pompei (NA) ed è conservato al MANN di Napoli (NA); raffigura la battaglia di Isso (333 a.C.) tra Alessandro Magno e Dario III." },
                { d: "La Necropoli della Banditaccia di Cerveteri è UNESCO dal 2004. Quale tipologia tombale la distingue dalle altre necropoli etrusche?", r: ["I grandi tumuli circolari fino a 40 m di diametro che coprono ipogei con camere funerarie che imitano le abitazioni etrusche", "Le tombe dipinte con affreschi policromi che documentano scene di banchetto e danza", "Le tombe a dado in blocchi di tufo allineate lungo strade in una vera città dei morti senza tumuli"], c: 0, sp: "La necropoli di Cerveteri è caratterizzata da grandi tumuli circolari (fino a 40 m), tombe a dado e da un'organizzazione urbanistica a strade e quartieri; le camere interne imitano le abitazioni etrusche con soffitti, letti e suppellettili scolpite." },
                { d: "Il Tempio di Segesta è un peristilio dorico del V sec. a.C. Quale indizio suggerisce che non fu mai completato?", r: ["Mancano la cella, le metope, le scanalature delle colonne e le finiture dei capitelli; tracce di bozze di lavorazione sono visibili sulle colonne", "Il tetto non fu mai posato e i blocchi del frontone giacciono ancora a terra intorno al tempio", "Le colonne sono state riassemblate anastiloticamente nel XX sec. da materiale sparso nell'area"], c: 0, sp: "Il Tempio di Segesta (430-420 a.C.) non fu mai completato: mancano cella, metope, triglifi, scanalature delle colonne e finiture dei capitelli; Cicerone nelle Verrine menziona nidi di rondini tra le colonne, conferma che in età romana era già privo di copertura." },
                { d: "Il Parco Archeologico di Selinunte è uno dei più estesi d'Europa. Come vengono convenzionalmente identificati i templi del sito?", r: ["Con lettere dell'alfabeto, poiché le divinità a cui erano dedicati non sono state accertate con certezza", "Con i nomi delle divinità greche identificate grazie alle iscrizioni rinvenute durante gli scavi", "Con numeri progressivi assegnati in ordine cronologico di costruzione durante gli scavi ottocenteschi"], c: 0, sp: "I templi di Selinunte sono convenzionalmente identificati con lettere (A, C, D, E, F, G) poiché le divinità a cui erano dedicati non sono state accertate con certezza dalle iscrizioni." },
,
    {
        d: "Quale ordine architettonico si sovrappone nei tre livelli esterni del Colosseo, dal basso verso l'alto?",
        r: ["Tuscanico (o Dorico), Ionico, Corinzio", "Dorico, Ionico, Composito", "Corinzio, Ionico, Dorico"],
        c: 0,
        sp: "La facciata esterna del Colosseo presenta una classica sovrapposizione di ordini: tuscanico al piano terra, ionico al primo piano e corinzio al secondo."
    },
    {
        d: "La Necropoli della Banditaccia a Cerveteri è celebre per le sue tombe a tumulo. Cosa riproducono al loro interno queste tombe?",
        r: ["La struttura di una casa etrusca, con stanze, porte e arredi scolpiti nella roccia", "Un labirinto simbolico che rappresenta il viaggio verso l'aldilà", "Una piramide sotterranea con camere concentriche"],
        c: 0,
        sp: "Le tombe della Banditaccia sono veri e propri 'negative' di abitazioni, con vani scavati nel tufo che imitano l'architettura domestica etrusca, inclusi dettagli come travi del soffitto e letti funerari."
    },
    {
        d: "Qual è il nome della tomba più celebre della Necropoli di Cerveteri, nota per i suoi rilievi in stucco che riproducono oggetti della vita quotidiana?",
        r: ["La Tomba dei Rilievi", "La Tomba dei Leopardi", "La Tomba della Nave"],
        c: 0,
        sp: "La Tomba dei Rilievi (IV sec. a.C.) deve il suo nome agli stucchi dipinti che raffigurano armi, utensili e oggetti domestici, offrendo uno spaccato della vita materiale etrusca."
    },
    {
        d: "La Necropoli di Tarquinia, sito UNESCO, è famosa per le tombe dipinte. Con quale altro nome è nota la necropoli?",
        r: ["Necropoli dei Monterozzi", "Necropoli del Crocifisso del Tufo", "Necropoli di Poggio Gaiella"],
        c: 0,
        sp: "La Necropoli di Tarquinia è nota come Necropoli dei Monterozzi. È celebre per le sue tombe affrescate, che rappresentano la più importante testimonianza della pittura etrusca."
    },
    {
        d: "La Tomba dei Leopardi di Tarquinia, capolavoro della pittura etrusca, da cosa prende il nome?",
        r: ["Dai due felini raffigurati sul frontone della parete di fondo, simmetrici ai lati di un albero", "Dalla presenza di pelli di leopardo nei corredi funebri", "Dalla forma della tomba, simile alla sagoma di un leopardo"],
        c: 0,
        sp: "La Tomba dei Leopardi (circa 480 a.C.) è così chiamata per la raffigurazione di due leopardi araldici sulla parete di fondo. È celebre anche per la scena di banchetto."
    },
    {
        d: "Cosa si intende per 'domus de janas' nella cultura della Sardegna prenuragica?",
        r: ["Tombe ipogeiche scavate nella roccia, il cui nome significa 'case delle fate'", "Torri megalitiche a pianta circolare", "Templi a pozzo per il culto delle acque"],
        c: 0,
        sp: "'Domus de janas' significa letteralmente 'case delle fate' in sardo. Sono tombe scavate nella roccia tipiche della cultura di Ozieri (Neolitico finale), spesso decorate con simboli scolpiti."
    },
    {
        d: "La Necropoli di Anghelu Ruju, vicino ad Alghero, è una delle più importanti necropoli prenuragiche. A quale cultura è principalmente associata?",
        r: ["Cultura di Ozieri", "Cultura nuragica", "Cultura fenicia"],
        c: 0,
        sp: "La Necropoli di Anghelu Ruju, con le sue 38 domus de janas, è una delle principali testimonianze della Cultura di Ozieri (3200-2800 a.C. circa) nel nord Sardegna."
    },
    {
        d: "Qual è la funzione principale dei 'templi a pozzo' nuragici, come quelli di Santa Cristina e Santa Vittoria?",
        r: ["Erano santuari legati al culto delle acque", "Erano fortezze difensive contro gli invasori", "Erano tombe per i capi villaggio"],
        c: 0,
        sp: "I templi a pozzo sono tra le più raffinate architetture nuragiche. Erano santuari dedicati al culto delle acque, con scale che scendono a una camera sotterranea dove sgorgava la sorgente sacra."
    },
    {
        d: "Il sito nuragico di Santa Cristina a Paulilatino è noto per la precisione astronomica del suo pozzo sacro. Cosa accade durante gli equinozi?",
        r: ["La luce del sole penetra nel pozzo e illumina perfettamente il fondo", "Si verifica un fenomeno di risonanza acustica naturale", "L'acqua del pozzo cambia leggermente colore"],
        c: 0,
        sp: "Il pozzo sacro di Santa Cristina è orientato in modo che durante gli equinozi la luce solare scenda perpendicolarmente attraverso la scala, illuminando la camera del pozzo."
    },
    {
        d: "Cosa sono i 'Giganti di Monte Prama', esposti al Museo di Cabras?",
        r: ["Statue di guerrieri, arcieri e pugilatori in arenaria della civiltà nuragica, alte fino a 2,5 metri", "Grandi betili in granito che segnano le tombe dei giganti", "Sculture romane di divinità rinvenute in un tempio"],
        c: 0,
        sp: "I Giganti di Monte Prama sono statue di arenaria a tutto tondo, alte fino a 2,5 metri, raffiguranti pugilatori, arcieri e guerrieri. Rappresentano uno dei più antichi esempi di scultura monumentale del Mediterraneo."
    },
    {
        d: "La Tomba dei Giganti di Coddu Vecchiu, in Gallura, è caratterizzata da un imponente esedra. Qual è la particolarità della sua stele centrale?",
        r: ["È la stele più alta trovata in Sardegna (circa 4,4 m) ed è realizzata in granito locale", "È l'unica stele in Sardegna decorata con motivi a spirale", "Raffigura una divinità femminile legata al culto della fertilità"],
        c: 0,
        sp: "La stele centrale di Coddu Vecchiu è la più alta rinvenuta in Sardegna (4,4 m). L'intero monumento è costruito con blocchi di granito locale, materiale tipico della Gallura."
    },
    {
        d: "Quale importante città fenicia, oggi nel comune di Cabras, era situata nella penisola del Sinis e rappresenta un esempio di continuità insediativa dal periodo nuragico all'epoca romana?",
        r: ["Tharros", "Nora", "Sulky"],
        c: 0,
        sp: "Tharros, fondata dai Fenici nell'VIII sec. a.C. sulla penisola del Sinis, fu un importante centro commerciale che vide una continuità di vita fino al Medioevo."
    },
    {
        d: "Nora, situata nel comune di Pula, è considerata una delle più antiche città fenicie della Sardegna. Quale importantissimo reperto epigrafico vi è stato rinvenuto?",
        r: ["La stele di Nora, con la più antica attestazione del nome 'Sardegna'", "Il Trattato di Nora, primo accordo commerciale tra Fenici e Nuragici", "La Tavola di Nora, un codice di leggi marittime"],
        c: 0,
        sp: "La Stele di Nora, incisa in caratteri fenici su arenaria, contiene la più antica menzione conosciuta del nome 'Sardegna' (SRDN), databile intorno al IX-VIII sec. a.C."
    },
    {
        d: "Quale funzione aveva Monte Sirai, fondato dai Fenici di Sulky (Sant'Antioco) nell'entroterra sardo?",
        r: ["Era un avamposto strategico per il controllo delle risorse agricole e minerarie", "Era un santuario dedicato al dio Melqart", "Era una necropoli monumentale per le élite fenicie"],
        c: 0,
        sp: "Monte Sirai fu fondato come avamposto fortificato per controllare il fertile entroterra e le importanti risorse minerarie della regione, in un'area già abitata dai nuragici."
    },
    {
        d: "Cosa è la 'trafila' del Parco Archeologico di Pompei, un aspetto distintivo dello scavo borbonico?",
        r: ["La tecnica di scavo per cunicoli orizzontali usata per recuperare affreschi e oggetti preziosi", "Una macchina per sollevare i calchi delle vittime", "Il sistema di canali per drenare l'acqua piovana dal sito"],
        c: 0,
        sp: "La 'trafila' era il metodo di scavo settecentesco che procedeva per gallerie, seguendo le pareti affrescate per staccarle e recuperare gli oggetti, spesso causando danni alle strutture."
    },
    {
        d: "Qual è il nome della celebre villa suburbana di Pompei che deve il suo nome ai fregi con scene di iniziazione dionisiaca?",
        r: ["Villa dei Misteri", "Villa di Poppea", "Villa dei Papiri"],
        c: 0,
        sp: "La Villa dei Misteri, posta appena fuori le mura di Pompei, è famosa per il grande affresco del triclinio che illustra, secondo l'interpretazione più diffusa, il rito di iniziazione ai misteri dionisiaci."
    },
    {
        d: "Di quale materiale sono fatti i calchi delle vittime di Pompei, ottenuti da Giuseppe Fiorelli a partire dal 1863?",
        r: ["Gesso liquido colato nei vuoti lasciati dai corpi decomposti nella cenere", "Cera d'api modellata sugli scheletri originali", "Resina epossidica trasparente"],
        c: 0,
        sp: "Giuseppe Fiorelli ideò la tecnica di colare gesso liquido nelle cavità lasciate dai corpi decomposti all'interno dello strato di cenere solidificata, ottenendo calchi dettagliati."
    },
    {
        d: "Il Parco Archeologico di Ercolano è famoso per la conservazione dei materiali organici. Cosa rese possibile tutto ciò, a differenza di Pompei?",
        r: ["La nube ardente che investì la città carbonizzò il legno ma lo protesse dalla decomposizione", "La coltre di fango e lava che sigillò la città", "La cenere calda e secca che disidratò gli oggetti"],
        c: 0,
        sp: "Ercolano fu sepolta da una nube ardente (flusso piroclastico) a temperature elevate, che causò la carbonizzazione di legni, stoffe e cibi, preservandone la struttura."
    },
    {
        d: "Quale celebre biblioteca è stata rinvenuta nella Villa dei Papiri di Ercolano?",
        r: ["L'unica biblioteca dell'antichità classica giunta fino a noi con i suoi rotoli di papiro", "La biblioteca personale dell'imperatore Claudio", "Una biblioteca di testi religiosi cristiani"],
        c: 0,
        sp: "La Villa dei Papiri custodiva una biblioteca con oltre 1.800 rotoli di papiro, per lo più testi di filosofia epicurea, rendendola un unicum nell'archeologia classica."
    },
    {
        d: "Quale struttura ospita l'Antiquarium di Ercolano, che espone una collezione unica al mondo di mobili e oggetti in legno carbonizzato?",
        r: ["La terrazza superiore dell'area archeologica", "L'antico teatro romano", "La Villa dei Papiri"],
        c: 0,
        sp: "L'Antiquarium è situato sulla terrazza panoramica che domina gli scavi e ospita una straordinaria collezione di arredi lignei, gioielli e oggetti di uso quotidiano."
    },
    {
        d: "Qual è la particolarità dell'antico Teatro di Ercolano, ancora oggi in corso di scavo, rispetto all'accesso per la sua visita?",
        r: ["Vi si accede calandosi attraverso una botola da un cortile soprastante, poiché è sepolto sotto la città moderna", "È l'unico teatro romano interamente scavato nella roccia lavica", "Per visitarlo è necessario indossare un casco protettivo a causa dei crolli"],
        c: 0,
        sp: "Il Teatro di Ercolano, scoperto nel XVIII secolo, è sepolto sotto circa 20 metri di materiale piroclastico e la città moderna. Vi si accede scendendo da una botola posta in un cortile soprastante."
    },
    {
        d: "A Paestum, quale ordine architettonico caratterizza la cosiddetta 'Basilica', il tempio più antico della città?",
        r: ["Dorico arcaico, con forte entasis delle colonne e capitelli molto piatti", "Corinzio, con elaborate decorazioni di foglie d'acanto", "Tuscanico, con colonne lisce e capitelli semplici"],
        c: 0,
        sp: "La Basilica (tempio di Hera I, 550 a.C. ca.) è un capolavoro del dorico arcaico, con colonne dall'entasis molto pronunciata e capitelli dal profilo schiacciato ed espanso."
    },
    {
        d: "Il Tempio di Nettuno (o di Hera II) a Paestum è considerato uno dei migliori esempi di architettura templare greca. A quale secolo risale?",
        r: ["V secolo a.C. (circa 460 a.C.)", "VI secolo a.C. (circa 550 a.C.)", "III secolo a.C. (periodo lucano)"],
        c: 0,
        sp: "Il Tempio di Nettuno, o Hera II, è un perfetto esempio di tempio dorico della metà del V secolo a.C., contemporaneo del Partenone di Atene."
    },
    {
        d: "Quale celebre opera pittorica, emblema dell'arte greca in Italia, è custodita nel Museo Archeologico Nazionale di Paestum?",
        r: ["La Tomba del Tuffatore", "Il Vaso François", "Il Trono Ludovisi"],
        c: 0,
        sp: "La Tomba del Tuffatore (circa 480 a.C.) è un raro esempio di pittura greca su lastra di calcare, raffigurante un giovane che si tuffa in acqua, simbolo del passaggio dalla vita alla morte."
    },
    {
        d: "Oltre agli imponenti templi e alle mura, quale altra importante struttura difendeva la città greca di Paestum dal lato mare?",
        r: ["Una possente cinta muraria in blocchi di travertino, tra le meglio conservate della Magna Grecia", "Un porto fortificato con catene sottomarine", "Una torre di avvistamento alta oltre 30 metri"],
        c: 0,
        sp: "La cinta muraria di Paestum, lunga circa 4,75 km e quasi interamente percorribile, è uno dei sistemi difensivi meglio conservati della Magna Grecia, con torri e porte monumentali."
    },
    {
        d: "Quale tipo di roccia vulcanica caratterizza l'architettura monumentale del Parco Archeologico di Cosa, fondata dai Romani nel 273 a.C.?",
        r: ["Calcare cavernoso e arenaria, materiali locali utilizzati per mura e templi", "Marmo lunense, importato dalle cave di Carrara", "Tufo rosso, tipico dell'architettura etrusca"],
        c: 0,
        sp: "L'antica Cosa fu costruita utilizzando pietre locali come il calcare cavernoso e l'arenaria, che conferiscono alle rovine il loro caratteristico aspetto."
    },
    {
        d: "Cosa era l''arx' (o acropoli) di Cosa e dove si trovava?",
        r: ["Era la cittadella fortificata situata nel punto più alto del promontorio, con il tempio della Triade Capitolina", "Era il quartiere portuale alla base del promontorio", "Era la piazza del foro, centro della vita politica"],
        c: 0,
        sp: "L'arx di Cosa era l'acropoli fortificata, posta sulla sommità del promontorio (114 m s.l.m.), dove sorgeva il Capitolium dedicato a Giove, Giunone e Minerva."
    },
    {
        d: "Il Foro di Cosa, centro politico e commerciale della colonia, includeva un importante edificio per le assemblee. Quale?",
        r: ["Il Comitium, una struttura circolare gradinata per le riunioni politiche", "Una basilica civile a tre navate", "Un macellum (mercato coperto) a pianta centrale"],
        c: 0,
        sp: "Il Comitium di Cosa è uno spazio circolare con gradinate, destinato alle assemblee popolari, che testimonia l'adozione del modello politico-architettonico romano nella colonia."
    },
    {
        d: "La Reggia di Caserta, capolavoro di Luigi Vanvitelli, è stata dichiarata Patrimonio dell'Umanità UNESCO insieme a quali altre due strutture?",
        r: ["L'Acquedotto Carolino e il Complesso di San Leucio", "Il Palazzo Reale di Napoli e la Certosa di Padula", "Il Parco Virgiliano e il Ponte di Maddaloni"],
        c: 0,
        sp: "Il sito UNESCO 'Palazzo Reale del XVIII secolo di Caserta con il Parco, l'Acquedotto Vanvitelliano e il Complesso di San Leucio' riconosce l'unità progettuale del territorio voluta dai Borbone."
    },
    {
        d: "L'Acquedotto Carolino, o dei Ponti della Valle, fu progettato da Vanvitelli per alimentare le fontane della Reggia. Perché è considerato un'opera ingegneristica eccezionale?",
        r: ["Per la sua lunghezza di 38 km, in gran parte sotterraneo, e per l'imponenza del viadotto a tre ordini di arcate", "Perché fu il primo acquedotto romano costruito dopo la caduta dell'Impero", "Per il sistema di pompe a vapore che sollevava l'acqua"],
        c: 0,
        sp: "L'Acquedotto Carolino, lungo 38 km, è un capolavoro di ingegneria idraulica settecentesca. La sua sezione più spettacolare è il viadotto dei Ponti della Valle, alto fino a 55 metri."
    },
    {
        d: "Il Teatro Greco del Parco Archeologico della Neapolis di Siracusa è uno dei più grandi e meglio conservati del mondo greco. In cosa fu scavato?",
        r: ["Nella roccia viva del colle Temenite", "Su un terrapieno artificiale di terra e pietre", "All'interno di una cava di pietra abbandonata"],
        c: 0,
        sp: "Il Teatro Greco di Siracusa fu scavato quasi interamente nella roccia del colle Temenite nel V sec. a.C. e poi ampliato in epoca ellenistica, sfruttando la naturale pendenza del colle."
    },
    {
        d: "Quale peculiare struttura del Parco Archeologico della Neapolis, l'Orecchio di Dionisio, è famosa per una sua caratteristica acustica?",
        r: ["È una grotta artificiale a forma di orecchio umano che amplifica incredibilmente i suoni, persino un bisbiglio", "È una stanza sotterranea dove l'eco si ripete fino a sette volte", "È un anfiteatro dove la voce di un attore sul palco può essere udita fino all'ultima fila senza amplificazione"],
        c: 0,
        sp: "L'Orecchio di Dionisio è un'alta grotta artificiale scavata nella roccia, famosa per la sua eccezionale acustica che amplifica ogni suono. Secondo la leggenda, il tiranno Dionisio vi rinchiudeva i prigionieri per ascoltarne i discorsi."
    },
    {
        d: "L'Anfiteatro Romano di Siracusa è uno dei più grandi d'Italia dopo il Colosseo e l'Anfiteatro Campano. Quale caratteristica lo distingue dagli altri?",
        r: ["È in gran parte scavato nella roccia e presenta un'arena con un ampio vano centrale per le macchine sceniche", "È l'unico anfiteatro romano con un velarium ancora funzionante", "È costruito interamente in mattoni e presenta una facciata marmorea"],
        c: 0,
        sp: "L'Anfiteatro Romano di Siracusa (III sec. d.C.) è parzialmente scavato nella roccia. Al centro dell'arena, un profondo vano rettangolare ospitava i meccanismi per sollevare belve e gladiatori."
    },
    {
        d: "Nella Necropoli di Siracusa, un monumento funerario di epoca romana è tradizionalmente associato a quale celebre matematico siracusano?",
        r: ["Archimede", "Euclide", "Pitagora"],
        c: 0,
        sp: "La cosiddetta 'Tomba di Archimede' è un colombario di epoca romana nella Necropoli Grotticelli. La tradizione, seppur non storicamente provata, la associa al celebre matematico."
    },
    {
        d: "Il sito seriale UNESCO 'Palermo Arabo-Normanna e le Cattedrali di Cefalù e Monreale' è un eccezionale esempio di sincretismo. Quali tre culture artistiche si fondono in questi monumenti?",
        r: ["Cultura bizantina, islamica e latina", "Cultura greca, cartaginese e normanna", "Cultura longobarda, franca e ottoniana"],
        c: 0,
        sp: "I monumenti arabo-normanni di Palermo, Cefalù e Monreale rappresentano una sintesi unica di elementi dell'architettura e dell'arte bizantina, islamica e latino-normanna."
    },
    {
        d: "La Cattedrale di Monreale, voluta da Guglielmo II, è celebre per i suoi mosaici. Quale tema iconografico domina l'abside centrale?",
        r: ["Il Cristo Pantocratore, figura imponente che benedice con la mano destra", "L'Incoronazione della Vergine, con angeli e santi", "Il Giudizio Universale, con la divisione tra beati e dannati"],
        c: 0,
        sp: "L'abside centrale del Duomo di Monreale è dominata dall'enorme figura del Cristo Pantocratore, un capolavoro del mosaico bizantino-normanno che esprime la maestà divina."
    },
    {
        d: "Nella Cattedrale di Cefalù, qual è l'elemento decorativo più famoso, realizzato da maestranze bizantine?",
        r: ["I mosaici del catino absidale con il Cristo Pantocratore", "Il chiostro con capitelli istoriati", "Il portale bronzeo con scene bibliche"],
        c: 0,
        sp: "Come a Monreale, anche a Cefalù il catino absidale ospita la figura del Cristo Pantocratore, realizzato da mosaicisti bizantini chiamati da Ruggero II, in una dimensione più intima ma di straordinaria fattura."
    },
    {
        d: "All'interno del Palazzo dei Normanni a Palermo, quale ambiente è considerato il più fulgido esempio di arte arabo-normanna?",
        r: ["La Cappella Palatina, con mosaici bizantini e soffitto a muqarnas islamico", "La Sala d'Ercole, con affreschi barocchi", "La Sala di Ruggero, con mosaici profani di scene di caccia"],
        c: 0,
        sp: "La Cappella Palatina, voluta da Ruggero II, unisce un ciclo musivo bizantino di eccezionale bellezza a un soffitto ligneo a stalattiti (muqarnas) di chiara influenza fatimide."
    },
    {
        d: "Quale famosa iscrizione, scoperta nel Foro Romano, era esposta all'ingresso di Ostia Antica e ne celebrava la ricostruzione voluta da Augusto?",
        r: ["L'iscrizione che ricorda la costruzione del teatro di Agrippa", "La dedica a Mitra nel Mitreo delle Terme del Foro", "Il decreto di Costantino sulla libertà di culto"],
        c: 0,
        sp: "Questa iscrizione, posta all'ingresso dell'area archeologica, ricorda il restauro del teatro di Ostia promosso da Agrippa, genero di Augusto, sottolineando il legame tra la città e il potere imperiale."
    },
    {
        d: "Quale edificio di Ostia Antica, il più grande del suo genere a Roma, testimonia l'importanza degli scambi commerciali con l'Oriente?",
        r: ["La Piazza delle Corporazioni, con i suoi uffici di armatori e commercianti decorati a mosaico", "Il Capitolium, tempio dedicato alla Triade Capitolina", "Il Caseggiato dei Triclini, sede di una gilda di banchettatori"],
        c: 0,
        sp: "La Piazza delle Corporazioni, situata dietro il teatro, è un vasto spazio porticato con decine di uffici (stationes) di armatori e mercanti, molti dei quali con mosaici che indicano le merci trattate o la provenienza."
    },
    {
        d: "Le Terme di Nettuno a Ostia Antica sono famose per i loro mosaici. Cosa rappresentano principalmente?",
        r: ["Scene marine con Nettuno, anfitrite e creature mitologiche del mare", "Scene di gare atletiche e lotta greco-romana", "Mappe geografiche delle province dell'Impero"],
        c: 0,
        sp: "I mosaici pavimentali delle Terme di Nettuno raffigurano un vasto thiasos marino con Nettuno su un carro trainato da cavalli marini, anfitriti, tritoni e nereidi, celebrando il dominio sul mare."
    },
    {
        d: "Ostia era anche un importante centro per i culti orientali. Quale misterioso culto è testimoniato da numerosi mitrei scavati nella città?",
        r: ["Il Mitraismo, un culto iniziatico di origine persiana", "Il Cristianesimo delle origini", "Il Culto di Iside e Osiride, di provenienza egizia"],
        c: 0,
        sp: "Ostia ha restituito ben 18 mitrei, piccoli ambienti sotterranei o semi-ipogei dove si riunivano i seguaci del dio Mitra, un culto misterico molto diffuso tra soldati e commercianti."
    },
    {
        d: "Cosa sono i 'magazzini' (horrea) di Ostia Antica e quale funzione svolgevano?",
        r: ["Grandi edifici per lo stoccaggio delle merci (grano, olio, vino) provenienti da tutto il Mediterraneo", "Caserme per le truppe di stanza nel porto", "Scuole per la formazione dei marinai e dei mercanti"],
        c: 0,
        sp: "Gli horrea erano enormi magazzini pubblici e privati dove venivano stoccate e distribuite le derrate alimentari che rifornivano Roma. La loro grandezza testimonia il ruolo cruciale di Ostia come porto annonario."
    },
    {
        d: "Cosa significa il nome 'Sibari' nell'antica Grecia e perché la città era famosa?",
        r: ["Significava 'città ricca' ed era famosa per la sua opulenza e il lusso dei suoi abitanti (da cui 'sibarita')", "Significava 'città del vino' ed era famosa per i suoi vigneti", "Significava 'città dei filosofi' ed era famosa per la sua scuola pitagorica"],
        c: 0,
        sp: "Sibari, fondata dagli Achei nell'VIII sec. a.C., divenne proverbiale per la sua ricchezza e la vita lussuosa dei suoi cittadini, da cui deriva il termine 'sibarita' per indicare una persona amante dei piaceri."
    },
    {
        d: "Il Parco Archeologico di Sibari conserva i resti di più città sovrapposte. Quante e quali sono?",
        r: ["Tre: l'antica Sibari greca, la Thurii ellenistica e la Copia romana", "Due: la greca e la bizantina", "Quattro: enotria, greca, romana e medievale"],
        c: 0,
        sp: "Il sito di Sibari presenta una straordinaria sequenza stratigrafica: la Sibari arcaica distrutta, Thurii fondata da Pericle nel V sec. a.C., e la colonia romana di Copia."
    },
    {
        d: "Quale grande problema di conservazione affligge il Parco Archeologico di Sibari, influenzando le scelte di scavo e restauro?",
        r: ["La falda acquifera superficiale che allaga gli scavi, richiedendo costanti opere di pompaggio", "L'eccessiva urbanizzazione che ha coperto gran parte dell'antica città", "L'erosione costiera che sta facendo crollare i monumenti sul mare"],
        c: 0,
        sp: "I resti di Sibari si trovano sotto il livello della falda acquifera, rendendo necessario un sistema di drenaggio e pompaggio continuo per mantenere asciutte le aree scavate e consentire gli studi."
    },
    {
        d: "Quali sono le tre aree archeologiche principali che compongono il Parco Archeologico di Ostia Antica?",
        r: ["La città di Ostia, i Porti Imperiali di Claudio e Traiano e la Necropoli di Porto all'Isola Sacra", "Ostia, Portus e la Villa di Plinio il Giovane", "La città di Ostia, il Porto di Ostia e la Necropoli di Pianabella"],
        c: 0,
        sp: "Il Parco Archeologico di Ostia Antica si articola in tre nuclei distinti ma collegati: la città antica di Ostia, il complesso portuale di Portus con i bacini di Claudio e Traiano, e la Necropoli dell'Isola Sacra."
    },
    {
        d: "Il Parco Archeologico del Colosseo include, oltre all'Anfiteatro Flavio, il Foro Romano e il Palatino. Qual è la superficie complessiva dell'area archeologica?",
        r: ["Oltre 40 ettari nel cuore di Roma", "Circa 20 ettari, tra il Colosseo e il Circo Massimo", "Circa 60 ettari, includendo anche le Terme di Caracalla"],
        c: 0,
        sp: "Il Parco Archeologico del Colosseo si estende per oltre 40 ettari, comprendendo l'Anfiteatro Flavio, il Foro Romano e il Palatino, in un unico grande sistema archeologico centrale."
    },
    {
        d: "Quale imperatore fece costruire la Domus Aurea, la cui colossale statua (il 'Colosso') ha dato forse il nome al Colosseo?",
        r: ["Nerone", "Tito", "Domiziano"],
        c: 0,
        sp: "Il Colosseo prende probabilmente il nome dalla colossale statua di Nerone (il 'Colosso di Nerone') che sorgeva nelle vicinanze, poi modificata per raffigurare il dio Sole."
    },
    {
        d: "I sotterranei del Colosseo, visitabili oggi, sono noti con il nome di 'ipogeo'. Cosa contenevano originariamente?",
        r: ["Un complesso sistema di ascensori, botole e montacarichi per far salire gladiatori e belve nell'arena", "Le celle dove venivano tenuti i prigionieri in attesa del processo", "Un rifugio antiaereo per gli spettatori in caso di attacco nemico"],
        c: 0,
        sp: "L'ipogeo del Colosseo era un intricato labirinto di gallerie, ascensori e montacarichi azionati da argani, dove gladiatori e animali attendevano di essere sollevati nell'arena per gli spettacoli."
    },
    {
        d: "Quale piattaforma tecnologica è stata sviluppata dal Parco Archeologico di Ercolano per la gestione e la condivisione del suo patrimonio scientifico?",
        r: ["Ercolano Digitale, una piattaforma online costruita a partire dai dati scientifici del sito", "Virtual Herculaneum, un'app di realtà virtuale per la visita immersiva", "Il GIS archeologico di Ercolano, un sistema informativo territoriale condiviso"],
        c: 0,
        sp: "Ercolano Digitale è una piattaforma web che mette a disposizione del pubblico e degli studiosi i dati scientifici, i modelli 3D e la documentazione del sito."
    },
    {
        d: "Quale reperto eccezionale, simbolo della tragica fine di Ercolano, è stato rinvenuto sulla spiaggia dell'antica città?",
        r: ["Lo scheletro di un soldato romano con armatura e spada, soprannominato 'l'ultimo fuggiasco'", "Una barca carbonizzata con il suo carico di anfore intatte", "Un carro cerimoniale in legno e bronzo"],
        c: 0,
        sp: "Tra i ritrovamenti più drammatici vi è lo scheletro di un uomo, forse un soldato, ritrovato sulla spiaggia con la sua armatura e la spada, sorpreso dalla nube ardente mentre tentava di fuggire."
    },
    {
        d: "Da chi fu fondata l'antica città di Paestum e con quale nome originario?",
        r: ["Dai coloni greci di Sibari con il nome di Poseidonia", "Dagli Etruschi con il nome di Velia", "Dai Romani con il nome di Paestum"],
        c: 0,
        sp: "Paestum fu fondata intorno al 600 a.C. da coloni provenienti dalla ricca Sibari, che la dedicarono a Poseidone (il dio del mare), chiamandola Poseidonia."
    },
    {
        d: "Quale popolo italico conquistò Poseidonia alla fine del V secolo a.C., cambiandone la cultura ma mantenendone il prestigio?",
        r: ["I Lucani", "I Sanniti", "Gli Osci"],
        c: 0,
        sp: "Intorno al 420 a.C., i Lucani, popolo italico proveniente dall'interno, conquistarono Poseidonia. Sotto il loro dominio, la città mantenne una certa prosperità, come testimoniano le tombe dipinte del periodo."
    },
    {
        d: "La Necropoli di Tarquinia, sito UNESCO, è famosa per le tombe dipinte. Perché sono così importanti per la conoscenza della civiltà etrusca?",
        r: ["Rappresentano il più esteso e importante complesso di pittura etrusca, con scene di vita quotidiana e mitologia", "Sono le uniche tombe etrusche in cui sono stati trovati corredi funebri integri", "Sono le più antiche tombe monumentali del Mediterraneo occidentale"],
        c: 0,
        sp: "Le tombe dipinte di Tarquinia, circa 200, offrono una testimonianza inestimabile sulla società, la religione e la vita quotidiana degli Etruschi, colmando la perdita quasi totale della loro pittura."
    },
    {
        d: "La Tomba dei Leopardi di Tarquinia, capolavoro della pittura etrusca, cosa raffigura la scena principale del banchetto?",
        r: ["Coppie di uomini e donne sdraiati su klinai (letti) che banchettano, serviti da coppieri nudi", "Una processione di sacerdoti e sacerdotesse che si recano a un sacrificio", "Una scena di caccia al cinghiale con cani e cavalli"],
        c: 0,
        sp: "La scena del banchetto nella Tomba dei Leopardi mostra tre coppie di personaggi sdraiati sui letti conviviali (klinai), partecipando a un simposio, in un'atmosfera di gioiosa vitalità."
    },
    {
        d: "Il Parco Archeologico di Ercolano è famoso per la conservazione dei materiali organici. Quali oggetti sono esposti nell'Antiquarium?",
        r: ["Una collezione unica al mondo di mobili in legno carbonizzato, gioielli e oggetti di uso quotidiano", "Una raccolta di affreschi staccati dalle pareti delle ville", "Una serie di calchi in gesso delle vittime dell'eruzione"],
        c: 0,
        sp: "L'Antiquarium di Ercolano espone una straordinaria collezione di arredi lignei, gioielli, oggetti di uso quotidiano e persino cibi carbonizzati, recuperati durante gli scavi della città antica."
    },
    {
        d: "Quale importante ritrovamento è avvenuto nel 1996 sulla spiaggia di Ercolano, cambiando la comprensione della fuga degli abitanti?",
        r: ["Il rinvenimento di oltre 300 scheletri nei fornici (arcate) che fungevano da rimesse per le barche", "Il ritrovamento del tesoro del tempio di Ercole, nascosto in una cassa di bronzo", "La scoperta di un'intera nave romana con il suo carico di anfore"],
        c: 0,
        sp: "Nel 1996, sulla spiaggia di Ercolano, furono rinvenuti oltre 300 scheletri di persone che avevano cercato rifugio nei fornici, le arcate che fungevano da rimesse per le barche. Questo ritrovamento ha cambiato la comprensione della dinamica dell'eruzione e della morte degli abitanti."
    },
    {
        d: "Quale tecnologia è stata utilizzata per la prima volta in modo estensivo proprio a Ercolano per studiare i papiri carbonizzati della Villa dei Papiri?",
        r: ["L'intelligenza artificiale e la tomografia a raggi X per leggere virtualmente i rotoli senza aprirli", "La datazione al radiocarbonio per determinare l'età esatta dei manoscritti", "La fotografia a infrarossi per rivelare scritture invisibili"],
        c: 0,
        sp: "I papiri di Ercolano, carbonizzati e fragilissimi, sono oggi studiati con tecniche avanzate di imaging (come la tomografia a raggi X) e algoritmi di intelligenza artificiale per 'srotolare' e leggere virtualmente i testi."
    },
    {
        d: "Quale fu il primo insediamento sul sito di Cosa, prima della fondazione della colonia romana nel 273 a.C.?",
        r: ["Un insediamento etrusco noto come Cusi o Cusia", "Un villaggio di pescatori di origine fenicia", "Un accampamento militare cartaginese"],
        c: 0,
        sp: "Prima della colonia romana, sul promontorio di Cosa sorgeva un insediamento etrusco, probabilmente chiamato Cusi, di cui però non sono state trovate tracce monumentali consistenti."
    },
    {
        d: "Quale importante infrastruttura romana, che collegava Roma con la costa tirrenica, rese strategica la posizione della colonia di Cosa?",
        r: ["La Via Aurelia, che passava ai piedi del promontorio di Ansedonia", "La Via Appia, che da Roma giungeva fino a Brindisi", "La Via Flaminia, che attraversava l'Appennino"],
        c: 0,
        sp: "La costruzione della Via Aurelia, che collegava Roma a Pisa passando lungo la costa, rese Cosa un punto chiave per il controllo del territorio e delle rotte marittime."
    },
    {
        d: "Quale culto orientale, diffuso tra soldati e mercanti, è testimoniato a Ostia da numerosi mitrei scavati nella città?",
        r: ["Il Mitraismo, con i suoi tipici ambienti sotterranei (mitrei) decorati con la scena della tauroctonia", "Il Cristianesimo delle origini, con le prime catacombe ebraiche", "Il Culto di Iside, con il suo santuario (Iseo) nel Foro"],
        c: 0,
        sp: "Ostia ha restituito 18 mitrei, piccoli ambienti sotterranei o semi-ipogei dove i seguaci del dio Mitra praticavano riti iniziatici. Il più famoso è il Mitreo delle Sette Sfere."
    },
    {
        d: "Quale edificio di Ostia Antica, il più grande del suo genere, testimonia l'importanza degli scambi commerciali con l'Oriente?",
        r: ["La Piazza delle Corporazioni, con i suoi mosaici che raffigurano navi, animali esotici e simboli commerciali", "Il Capitolium, tempio dedicato alla Triade Capitolina che domina il Foro", "Il Caseggiato dei Triclini, sede di una potente gilda di banchettatori"],
        c: 0,
        sp: "La Piazza delle Corporazioni, situata dietro il teatro, è un vasto spazio porticato con decine di uffici (stationes) di armatori e mercanti, molti dei quali con mosaici che indicano le merci trattate o la provenienza."
    },
    {
        d: "Quale fu la tecnica costruttiva predominante utilizzata per gli edifici di Ostia Antica, che ha permesso la costruzione di insulae a più piani?",
        r: ["L'opus caementicium (calcestruzzo romano) rivestito in mattoni (opus testaceum)", "L'opera quadrata in blocchi di tufo e travertino", "La muratura a secco con pietre irregolari"],
        c: 0,
        sp: "La maggior parte degli edifici di Ostia fu costruita in opus caementicium, il calcestruzzo romano, rivestito da mattoni (opus testaceum), una tecnica che permetteva di realizzare solai e volte resistenti per edifici a più piani."
    },
    {
        d: "L'Anfiteatro Flavio, noto come Colosseo, è il più grande anfiteatro del mondo antico. Qual era la sua capienza stimata e la sua altezza originaria?",
        r: ["Poteva ospitare tra 50.000 e 75.000 spettatori e raggiungeva un'altezza di circa 52 metri", "Poteva ospitare circa 30.000 spettatori ed era alto circa 40 metri", "Poteva ospitare oltre 100.000 spettatori ed era alto circa 60 metri"],
        c: 0,
        sp: "Il Colosseo, con i suoi quattro piani per un'altezza di circa 52 metri, poteva accogliere tra 50.000 e 75.000 spettatori, rendendolo l'anfiteatro più capiente mai costruito."
    },
    {
        d: "Quale materiale da costruzione, leggero e resistente, fu utilizzato per la volta della Basilica di Massenzio nel Foro Romano?",
        r: ["Calcestruzzo romano (opus caementicium) con cassettoni in stucco", "Travertino massiccio e blocchi di marmo", "Legno di castagno rivestito in lamina di bronzo"],
        c: 0,
        sp: "La Basilica di Massenzio, completata da Costantino, utilizzava il calcestruzzo romano per creare le sue immense volte a crociera, decorate da cassettoni ottagonali in stucco."
    },
    {
        d: "Quale collina di Roma, secondo la tradizione, fu il luogo dove Romolo tracciò il solco primigenio per fondare la città, e dove oggi sorge il Parco Archeologico del Colosseo?",
        r: ["Il Palatino", "Il Campidoglio", "L'Aventino"],
        c: 0,
        sp: "Il Colle Palatino è considerato il luogo di fondazione di Roma. Qui Romolo avrebbe tracciato il pomerio e qui sono state rinvenute le più antiche tracce di insediamento umano nell'area."
    },
    {
        d: "Quali sono i tre templi dorici più celebri che si possono ammirare nell'area archeologica di Paestum?",
        r: ["La Basilica (Hera I), il Tempio di Nettuno (Hera II) e il Tempio di Cerere (Atena)", "Il Tempio di Zeus, il Tempio di Apollo e il Tempio di Demetra", "Il Partenone, l'Eretteo e il Tempio di Atena Nike"],
        c: 0,
        sp: "Paestum è celebre per i suoi tre templi dorici: la Basilica (tempio di Hera I), il più antico; il Tempio di Nettuno (Hera II), il meglio conservato; e il Tempio di Cerere (Atena), sulla collina settentrionale."
    },
    {
        d: "I Giganti di Monte Prama, esposti al Museo Civico di Cabras, rappresentano una delle più antiche forme di scultura monumentale del Mediterraneo. Quali figure raffigurano?",
        r: ["Pugilatori, arcieri e guerrieri, probabilmente eroi o antenati divinizzati", "Divinità del pantheon nuragico con le loro insegne", "Sacerdoti e sacerdotesse in processione rituale"],
        c: 0,
        sp: "I Giganti di Monte Prama raffigurano principalmente tre tipi di figure: pugilatori con scudo e guanto armato, arcieri con arco e faretra, e guerrieri con elmo e scudo. Si pensa rappresentino eroi o antenati divinizzati della comunità nuragica."
    },
    {
        d: "Qual è la funzione principale dei 'pozzi sacri' nuragici, come quello di Santa Cristina a Paulilatino?",
        r: ["Erano santuari dedicati al culto delle acque, con una camera sotterranea che raccoglieva l'acqua di una sorgente sacra", "Erano silos per la conservazione del grano e delle derrate alimentari", "Erano prigioni sotterranee per i nemici catturati in battaglia"],
        c: 0,
        sp: "I pozzi sacri nuragici sono sofisticate architetture ipogee legate al culto delle acque. Una scala monumentale scende fino alla camera del pozzo, dove sgorga la sorgente sacra. Santa Cristina ne è l'esempio più perfetto."
    },
    {
        d: "Cosa sono i 'nuraghi a tholos', come quello di La Prisgiona ad Arzachena?",
        r: ["Torri a pianta circolare con copertura a falsa cupola (tholos), tipiche della civiltà nuragica", "Tombe a camera scavate nella roccia con ingresso a pozzo", "Templi a cielo aperto con altare centrale e recinto sacro"],
        c: 0,
        sp: "I nuraghi a tholos sono la tipologia più classica e diffusa: torri troncoconiche costruite con filari di pietre aggettanti che formano una falsa cupola all'interno. La Prisgiona è un esempio complesso con torre centrale e antemurale."
    },
    {
        d: "Quale importante città fenicio-punica della Sardegna, situata sulla penisola del Sinis, mostra una straordinaria continuità di vita dal periodo nuragico all'alto Medioevo?",
        r: ["Tharros", "Nora", "Bithia"],
        c: 0,
        sp: "Tharros, nel comune di Cabras, fu un fiorente centro commerciale fenicio, poi cartaginese e infine romano. La sua posizione strategica sulla penisola del Sinis ne fece un crocevia di culture per oltre un millennio."
    },
    {
        d: "Quale edificio sacro del complesso di Santa Cristina a Paulilatino presenta un perfetto orientamento astronomico che permette alla luce lunare di illuminare l'interno in particolari periodi dell'anno?",
        r: ["Il pozzo sacro, orientato in modo che la luce della luna piena illumini la camera del pozzo durante il solstizio d'inverno", "Il nuraghe, che fungeva da calendario solare", "La tomba dei giganti, allineata con la costellazione di Orione"],
        c: 0,
        sp: "Il pozzo sacro di Santa Cristina è orientato astronomicamente: durante il solstizio d'inverno, la luce della luna piena penetra attraverso l'apertura superiore e illumina l'acqua del pozzo."
    },
    {
        d: "Quale materiale da costruzione, tipico della Gallura, fu utilizzato per edificare la Tomba dei Giganti di Coddu Vecchiu?",
        r: ["Granito locale, modellato in grandi lastre e blocchi", "Basalto, estratto dalle vicine colate vulcaniche", "Calcare bianco, facilmente lavorabile"],
        c: 0,
        sp: "La Tomba dei Giganti di Coddu Vecchiu, come molti monumenti nuragici della Gallura, è costruita con il granito locale, una pietra dura che conferisce imponenza e durabilità alla struttura."
    },
    {
        d: "Il Parco Archeologico di Ercolano è noto per la conservazione di materiali organici. Oltre al legno, quali altri materiali deperibili sono stati ritrovati in buono stato?",
        r: ["Tessuti, cordami, cesti di vimini e persino cibi come pane, fichi e datteri carbonizzati", "Pergamene, cuoio e avorio intatto", "Dipinti su tela, strumenti musicali in osso e piume di uccelli"],
        c: 0,
        sp: "Grazie al flusso piroclastico che ha investito Ercolano, molti materiali organici come tessuti, cordami e cibi si sono carbonizzati, preservandosi. Sono stati trovati pani, cesti e persino un letto in legno con le lenzuola."
    },
    {
        d: "Quale fu la causa della distruzione della ricca e potente Sibari nel 510 a.C., che portò alla sua scomparsa come potenza della Magna Grecia?",
        r: ["Fu rasa al suolo dall'esercito della vicina Crotone, che deviò il fiume Crati per sommergerla", "Fu distrutta da un devastante terremoto seguito da un maremoto", "Fu abbandonata a causa di un'epidemia di peste bubbonica"],
        c: 0,
        sp: "La leggendaria ricchezza di Sibari suscitò l'invidia di Crotone, che nel 510 a.C. la attaccò e la distrusse completamente. Si narra che i Crotoniati deviarono il corso del fiume Crati per sommergere definitivamente la città."
    },
    {
        d: "Nella Necropoli di Tarquinia, la Tomba dei Leopardi è celebre per la scena di banchetto. Quale interpretazione viene data a queste scene conviviali nelle tombe etrusche?",
        r: ["Rappresentano il banchetto funebre in onore del defunto o la sua continuazione della vita terrena nell'aldilà", "Illustrano scene di mitologia greca legate al dio Dioniso", "Sono semplici scene di vita quotidiana senza alcun significato religioso"],
        c: 0,
        sp: "Le scene di banchetto nelle tombe etrusche sono generalmente interpretate come rappresentazioni del simposio funebre o come la proiezione nell'aldilà della vita gioiosa del defunto, in un contesto di continuità e celebrazione."
    },
    {
